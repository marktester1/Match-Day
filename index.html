<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Day</title>
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=whistle">
<link rel="icon" href="icons/icon-192.png?v=whistle">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=whistle">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match Day">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-column touchline app — tournament header, tab bar, then a grass "pitch" panel as the one bold element */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#16211a; --muted:#5b6a60; --line:#d7dfd6;
  --grass:#1e6a3a; --grass-2:#25784318; --grass-deep:#175a30; --chalk:#ffffff;
  --live:#b06a10; --live-bg:#fbefdc; --bad:#b3261e; --good:#1e6a3a; --gk:#7a3fb0; --gk-bg:#f0e6fa; --gold:#c8961a; --gold-ink:#241a02;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.top{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-size:28px;line-height:1}
.brand h1 span{color:var(--grass)}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--good);border-color:currentColor}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:8px}
@media(max-width:420px){.trow{grid-template-columns:1fr 130px}}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:4px 0 6px}
.sections{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.sections button{border:0;background:none;padding:8px 4px 10px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.sections button.on{color:var(--ink);border-bottom-color:var(--grass)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
body.sec-season .trow,body.ingame .trow{display:none}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:7px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:400px){.tabs button{font-size:15px}}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.pc.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star{color:var(--gold);font-weight:700}
.award{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-top:1px solid var(--line)}
.award:first-child{border-top:0}
.award .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.award .hd span{font-size:13px;color:var(--muted)}
.award ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.award li{font-size:15px}
.award li i{color:var(--muted);font-style:normal}
.cnts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:14px}
.cnt b{font-family:var(--display);font-size:17px}
.cnt.zero{border-style:dashed;color:var(--muted)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tcard>button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.tcard .tn{font-weight:700}
.tcard .ts{font-size:13px;color:var(--muted)}
.tcard .tb{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tcard .gl{display:flex;justify-content:space-between;gap:10px}
.danger{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.tabs button.on{background:var(--grass);color:var(--chalk)}

.summary{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}
.glist{display:flex;flex-direction:column;gap:8px}
.gcard{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.gcard .gn{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;color:var(--muted)}
.gcard .gn small{display:block;font-size:12px;letter-spacing:.08em;font-weight:600}
.gcard .opp{font-weight:700;overflow-wrap:anywhere}
.gcard .sub{font-size:13px;color:var(--muted)}
.gcard .res{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gcard .scr{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live-bg);color:var(--live)}
.pill.ft{background:var(--grass-2);color:var(--good)}
.lenrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lenrow input{width:72px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:22px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pv{display:grid;grid-template-columns:52px 1fr;gap:2px 10px}
.pv b{font-family:var(--display);font-size:18px}
.pv .sm{color:var(--muted)}

.back{border:0;background:none;color:var(--grass);font-weight:700;padding:4px 0;align-self:flex-start}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead h2{font-size:30px}
.meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.meta.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* iPhone Safari gives date boxes a fixed minimum width, which pushed them over their neighbours and widened the page */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.meta label{display:flex;flex-direction:column;gap:4px;min-width:0}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.side .nm{font-weight:700;font-size:14px;text-align:center;overflow-wrap:anywhere}
.sc{display:flex;align-items:center;gap:8px}
.sc b{font-family:var(--display);font-size:46px;line-height:1;min-width:1.2ch;text-align:center}
.sc button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.sc button.plus{background:var(--grass);color:var(--chalk);border-color:var(--grass)}
.clock{text-align:center;padding-inline:4px}
.clock .t{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.clock small{display:block;color:var(--muted);font-size:12px}
.lenbtn{display:block;margin:2px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline dotted;padding:4px 6px}
.fix{display:flex;flex-direction:column;gap:10px}
.fix h3{margin:6px 0 0}
.fix .lenrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fix .lenrow input{width:80px}
.subadd{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px}
.subadd label{display:flex;flex-direction:column;gap:4px;min-width:0}
.subadd select,.subadd input{width:100%;min-width:0}
.subt{width:72px;flex:0 0 auto}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:700;flex:1;text-align:center}
.btn.go{background:var(--grass);border-color:var(--grass);color:var(--chalk)}
.btn.warn{color:var(--bad)}
.btn.small{flex:0 0 auto;padding:7px 11px;font-size:14px}

.pitch{position:relative;background:
  linear-gradient(90deg,transparent calc(50% - 1px),#ffffff55 calc(50% - 1px),#ffffff55 calc(50% + 1px),transparent calc(50% + 1px)),
  repeating-linear-gradient(90deg,var(--grass) 0 12.5%,var(--grass-deep) 12.5% 25%);
  border:2px solid #ffffff66;border-radius:14px;padding:30px 12px 16px;min-height:150px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .lbl{position:absolute;top:8px;left:12px;color:#ffffffcc}
.pitch .cnt{position:absolute;top:8px;right:12px;color:#ffffffcc;font-size:12px;font-weight:700}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;padding:8px 12px;border-radius:10px;border:2px solid transparent;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002;touch-action:none;user-select:none;-webkit-user-select:none}
.chip .n{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .m{font-size:12px;color:var(--muted)}
.chip .gkb{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--gk);color:var(--surface);padding:1px 5px;border-radius:5px}
.chip.keeper{background:var(--gk-bg)}
.chip.sel{border-color:var(--live);background:var(--live-bg)}
.chip.target{border-style:dashed;border-color:var(--grass)}
.chip.over{border-style:solid;border-color:var(--live);transform:scale(1.06)}
.chip.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;box-shadow:0 8px 24px #0004;transform-origin:center}
.benchbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.benchbox .chips{justify-content:flex-start}
.benchbox .chip{background:var(--bg);box-shadow:none}
.hint{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--live-bg);color:var(--ink)}
.hint.quiet{background:var(--grass-2)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:20px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.meta.one{grid-template-columns:minmax(0,1fr);gap:12px}
.seg.fill{width:100%}
.seg.fill button{flex:1 1 0;min-width:0;padding-inline:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button{border:0;background:var(--surface);padding:7px 9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--grass);color:var(--chalk)}
.seg button.on.b{background:var(--live-bg);color:var(--live)}
.seg button.on.k{background:var(--gk);color:var(--surface)}
.log .row{font-size:14px}
.log .at{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);min-width:46px}
.log .txt{flex:1;min-width:0}
.off{color:var(--bad)} .onn{color:var(--good)}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{font-weight:700;overflow-wrap:anywhere}
.mrow .tot{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;text-align:right}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);border-radius:4px}
.mrow.low .bar i{background:var(--live)}
.mrow .brk{grid-column:1/-1;font-size:12px;color:var(--muted)}
.flag{font-size:11px;font-weight:700;color:var(--live);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}

.addf{display:flex;gap:8px}
.addf .btn{flex:0 0 auto}
.teamsw{cursor:pointer;white-space:nowrap}
.hright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.menubtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.member .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.member{flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 5px}
.tag.mgr{color:var(--gold);border-color:currentColor}
body.beta .brand h1::after{content:"BETA";font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--live-bg);background:var(--live);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.acctf{display:flex;flex-direction:column;gap:8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.teamsw::after{content:" ▾";font-size:.6em;color:var(--muted)}
.teamsw.others::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
.teamrow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teamrow .who{flex:1 1 auto}
.teamrow.cur .who{color:var(--grass)}
.flag.run{color:var(--live)}
.rk{font-family:var(--display);font-size:18px;color:var(--muted);min-width:22px}
.note-item{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.note-item:first-child{border-top:0}
.note-item .nt{white-space:pre-wrap;overflow-wrap:anywhere}
.note-item .nm2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-item.done .nt{color:var(--muted);text-decoration:line-through}
.note-done-who{padding:8px 12px 0}
.gstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gstrip::-webkit-scrollbar{display:none}
.gs{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);position:relative}
.gs b{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
.gs small{font-size:11px}
.gs.done{opacity:.7}
.gs.on{background:var(--grass);border-color:var(--grass);color:var(--chalk);opacity:1}
.gs.on b{color:var(--chalk)}
.gs.live::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--live)}
.lbl .us{font-size:10px;letter-spacing:.06em;color:var(--grass);border:1px solid currentColor;border-radius:5px;padding:0 4px;margin-left:4px}
.weare{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.fixed{display:flex;flex-direction:column;gap:4px;min-width:0}
.usname{display:block;padding:9px 10px;border:1px dashed var(--line);border-radius:8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint.scorer{display:flex;flex-direction:column;gap:8px}
.modal{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px 16px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px #0006}
.modal h3{margin:0}
.scsel{flex:1 1 auto;width:auto}
.scsel.unset{color:var(--muted)}
.gls{font-size:13px;color:var(--muted);padding:0 0 6px}
.x{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.x.sure{color:var(--chalk);background:var(--bad);border-color:var(--bad)}
.empty{text-align:center;padding:26px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:0}
.ro [data-act]:not([data-act="tab"]):not([data-act="open"]):not([data-act="back"]){pointer-events:none;opacity:.45}
.ro .chip{pointer-events:none}
.gate .trow,.gate #tabs{display:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:40}
@media (prefers-reduced-motion:no-preference){.chip{transition:transform .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1><span id="hteam" style="color:inherit"></span> <span>Match Day</span></h1><span class="hright"><span id="sync" class="sync">Connecting…</span><button id="menubtn" class="menubtn" data-act="menu" aria-label="Menu" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></span></div>
  </header>
  <nav class="nav" id="tabs" aria-label="Sections">
    <div class="sections" id="sections"></div>
    <div class="tabs" id="subtabs"></div>
  </nav>
  <div class="trow">
    <input id="tname" data-tour="name" placeholder="Tournament name" aria-label="Tournament name">
    <input id="tdate" data-tour="date" type="date" aria-label="Tournament date">
  </div>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>

<script>
const APP_VERSION='0.14.0';
/*CFG*/const DEFAULT_CFG={team:'Example FC U10s',short:'Example FC',size:5};/*END*/
const S={cfg:{...DEFAULT_CFG},cfgLoaded:false,fx:false,squad:[],tour:{name:'',date:'',len:10,count:6},games:{},tab:'games',game:null,pick:null,confirm:null,readOnly:false,addLate:false,
  gate:false,teamId:null,invite:'',restore:null,fix:null,scorer:null,askGk:null,menu:false,members:[],createdBy:null,askSize:null,notes:[],noteFor:'',showDone:false,teams:false,adding:false,acct:null,
  awards:[],archive:[],aw:{date:'',type:'Training',label:'',picks:{}},openT:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nice=d=>{if(!d)return'';const t=new Date(d+'T12:00');return isNaN(t)?d:t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
let db=null,pending=false,suppressClick=false;
const queues={};
const gids=()=>Array.from({length:Math.min(10,Math.max(1,S.tour.count||6))},(_,i)=>'g'+(i+1));

function blank(n){return{n,opponent:'',team:'',time:'',pitch:'',gk:null,starters:[],bench:[],subs:[],gkChanges:[],goals:[],clock:{running:false,startedAt:0,acc:0},score:{us:0,them:0},done:false}}
function G(id){const g=S.games[id];const b=blank(+id.slice(1));return g?{...b,...g,clock:{...b.clock,...g.clock},score:{...b.score,...g.score}}:b}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nameOf(id){const p=S.squad.find(p=>p.id===id);if(p)return p.name;for(const t of S.archive){const q=(t.players||[]).find(p=>p.id===id);if(q)return q.name}return'Removed player'}
const el=g=>g.clock.acc+(g.clock.running?Math.max(0,Date.now()-g.clock.startedAt):0);
const started=g=>g.clock.running||g.clock.acc>0;
const nPer=()=>[1,2,4].includes(+S.tour.periods)?+S.tour.periods:1;
const perLen=()=>(S.tour.len||10)*60000/nPer();
const perOf=ms=>Math.min(nPer()-1,Math.floor(ms/perLen()+1e-9));
const perName=i=>nPer()===2?['1st half','2nd half'][i]:nPer()===4?'Q'+(i+1):'';
const perShort=i=>nPer()===2?(i+1)+'H':nPer()===4?'Q'+(i+1):'';
function atBreak(g){ // paused exactly at the end of a half/quarter that isn't the last
  if(nPer()===1||g.clock.running||g.done)return 0;const e=el(g),k=Math.round(e/perLen());
  return k>0&&k<nPer()&&Math.abs(e-k*perLen())<500?k:0;
}
const tAt=ms=>nPer()===1?fmt(ms):perShort(perOf(ms))+' '+fmt(ms-perOf(ms)*perLen()); // e.g. "2H 3:24"
const clockText=g=>{const e=el(g);return nPer()===1?fmt(e):fmt(e-perOf(e)*perLen())};
const clockSub=g=>{if(nPer()===1)return 'of '+fmt((S.tour.len||10)*60000);const b=atBreak(g);
  return b?(nPer()===2?'Half time':'End of Q'+b):perName(perOf(el(g)))+' · of '+fmt(perLen())};
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtM(ms){const m=ms/60000;return m<1&&ms>0?fmt(ms):Math.round(m)+'m'}
const bySubTime=g=>[...g.subs].sort((a,b)=>a.at-b.at);
const SECTIONS={tournament:{label:'Tournament',tabs:[['games','Games'],['minutes','Minutes'],['notes','Notes']]},
  season:{label:'Season',tabs:[['season','Results'],['awards','Awards'],['squad','Squad']]}};
const secOf=t=>SECTIONS.season.tabs.some(([k])=>k===t)?'season':'tournament';
const lastTab={tournament:'games',season:'season'}; // where you were in each section
const tourSize=()=>+S.tour.size||+S.cfg.size||5;   // players a side for this tournament
const gameSize=g=>+g.size||tourSize();                  // ...unless changed for one game
const isAway=g=>g.side==='away';
const usName=()=>S.cfg.short||S.cfg.team||'Us';
const homeName=g=>isAway(g)?(g.opponent||'Home team'):usName(g);
const awayName=g=>isAway(g)?usName(g):(g.opponent||'Away team');
const scoreHA=g=>isAway(g)?g.score.them+'–'+g.score.us:g.score.us+'–'+g.score.them;
const scorerName=p=>p==='og'?'Own goal':p?nameOf(p):'Scorer not set';
function goalTally(games){const c={};games.forEach(g=>(g.goals||[]).forEach(x=>{if(x.p&&x.p!=='og')c[x.p]=(c[x.p]||0)+1}));return c}
const alpha=l=>[...l].sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));
const byName=ids=>[...ids].sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'en',{sensitivity:'base'}));

function onPitch(g){const s=new Set(g.starters);for(const e of bySubTime(g)){s.delete(e.off);if(e.on)s.add(e.on)}return s}
function keeper(g){const ev=[...bySubTime(g).filter(e=>e.gk).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[])].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function inGame(g){return [...new Set([...g.starters,...g.bench,...g.subs.flatMap(e=>[e.off,e.on])])].filter(Boolean)}
function benchNow(g){const p=onPitch(g);return inGame(g).filter(x=>!p.has(x))}
function mins(g){
  const m={},end=el(g);let set=new Set(g.starters),prev=0;
  for(const e of bySubTime(g)){const at=Math.min(e.at,end);for(const p of set)m[p]=(m[p]||0)+Math.max(0,at-prev);set.delete(e.off);if(e.on)set.add(e.on);prev=at}
  for(const p of set)m[p]=(m[p]||0)+Math.max(0,end-prev);
  inGame(g).forEach(p=>{m[p]=m[p]||0});return m;
}

/* ---------- saving ---------- */
function put(path,body){
  if(!db)return;
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).catch(e=>{
    if(e&&e.code==='invalid_argument'){S.readOnly=true;render();toast("You can view this but not edit it. Ask the owner to invite you by email as an Editor.")}
    else if(e&&e.code==='quota_exceeded')toast("Storage is full, so that change wasn't saved.");
    else toast("Couldn't save that change. Check your connection and try again.");
  });
}
function remove(path){
  if(!db)return;
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).delete()).catch(()=>toast("Couldn't delete that. Check your connection and try again."));
}
function mut(id,fn){const g=structuredClone(G(id));fn(g);S.games[id]=g;put('games/'+id,g);render()}
function saveSquad(){S.squad=alpha(S.squad);put('club/squad',{players:S.squad});render()}
function saveTour(){put('club/tournament',S.tour)}

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}

/* ---------- swaps (tap or drag) ---------- */
function swap(id,a,aSide,b,bSide){
  const g=G(id);
  if(aSide==='pitch'&&bSide==='pitch'){ // change keeper between two players on the pitch
    const k=keeper(g);if(a!==k&&b!==k){toast('Drag the keeper onto a player to swap the gloves.');return}
    const nk=a===k?b:a;
    if(!started(g))mut(id,g=>{g.gk=nk});
    else mut(id,g=>{g.gkChanges=[...(g.gkChanges||[]),{at:el(g),p:nk}]});
    toast(`${nameOf(nk)} is in goal`);return;
  }
  if(aSide===bSide)return;
  const off=aSide==='pitch'?a:b,on=aSide==='pitch'?b:a;
  if(!started(g)){
    mut(id,g=>{g.starters=g.starters.map(x=>x===off?on:x);g.bench=g.bench.filter(x=>x!==on);g.bench.push(off);if(g.gk===off)g.gk=on});
    return;
  }
  if(g.done){toast('Reopen the game to change subs.');return}
  const wasK=keeper(g)===off;
  mut(id,g=>{g.subs.push({at:el(g),off,on,...(wasK?{gk:true}:{})})});
  toast(`${nameOf(on)} on, ${nameOf(off)} off at ${fmt(el(G(id)))}${wasK?' (now in goal)':''}`);
}

/* ---------- scoreboard side (home on the left, away on the right) ---------- */
function scoreSide(g,k){
  const nm=k==='us'?usName(g):(g.opponent||'Opponent'),who=k==='us'?'our':'their';
  return `<div class="side"><span class="nm">${esc(nm)}<small>${(k==='us')===!isAway(g)?'Home':'Away'}</small></span><div class="sc"><button data-act="score" data-k="${k}" data-d="-1" aria-label="Remove ${who} goal">−</button><b class="num">${g.score[k]}</b><button class="plus" data-act="score" data-k="${k}" data-d="1" aria-label="Add ${who} goal">+</button></div></div>`;
}

/* ---------- notes: something to pick up later with a player ---------- */
function saveNotes(){put('club/notes',{items:S.notes});render()}
function notesView(){
  const open=S.notes.filter(n=>!n.done),done=S.notes.filter(n=>n.done).sort((a,b)=>b.at-a.at);
  const byP={};open.forEach(n=>{(byP[n.p]=byP[n.p]||[]).push(n)});
  const row=(n,isDone)=>`<div class="note-item ${isDone?'done':''}"><div class="nt">${esc(n.text)}</div>
    <div class="nm2"><span class="note">${esc(nice(new Date(n.at).toISOString().slice(0,10)))}${n.by?' · '+esc(n.by):''}</span>
      <span class="cbtns"><button class="x" data-act="notedone" data-id="${n.id}">${isDone?'Not done':'Done ✓'}</button>
      <button class="x ${S.confirm==='nd-'+n.id?'sure':''}" data-act="notedel" data-id="${n.id}">${S.confirm==='nd-'+n.id?'Tap to delete':'Delete'}</button></span></div></div>`;
  return `<div class="sec" style="gap:14px">
  <form class="card" id="notef"><h3>New note</h3>
    <label style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Player</span>
      <select id="notep" aria-label="Player"><option value="">Choose a player</option>${S.squad.map(p=>`<option value="${p.id}" ${S.noteFor===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <textarea id="notet" maxlength="300" placeholder="e.g. Talk about staying wide in defence"></textarea>
    <button class="btn go" type="submit">Add note</button></form>
  ${open.length?Object.keys(byP).sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(p=>`<section class="sec"><h3>${esc(nameOf(p))}</h3>
    <div class="rows">${byP[p].sort((a,b)=>b.at-a.at).map(n=>row(n,false)).join('')}</div></section>`).join('')
    :`<div class="empty"><b>No notes to pick up</b>Add a note against a player above. It stays here until you tick it done.</div>`}
  ${done.length?`<button class="btn small" data-act="notesdone" style="align-self:flex-start">${S.showDone?'Hide':'Show'} done notes (${done.length})</button>
    ${S.showDone?`<div class="rows">${done.map(n=>`<div class="note-done-who lbl">${esc(nameOf(n.p))}</div>${row(n,true)}`).join('')}</div>`:''}`:''}
  <p class="note">Every coach on the team sees these notes. Notes stay after a tournament is saved.</p>
  </div>`;
}

/* ---------- game strip: jump between games without going back to the list ---------- */
function gameStrip(cur){
  return `<div class="gstrip" role="tablist" aria-label="Games">${gids().map(x=>{const g=G(x),st=started(g);
    return `<button class="gs ${x===cur?'on':''} ${g.clock.running?'live':''} ${g.done?'done':''}" data-act="open" data-g="${x}" role="tab" aria-selected="${x===cur}" aria-label="Game ${g.n}${g.opponent?' v '+esc(g.opponent):''}">
      <b class="num">${g.n}</b><small class="num">${st?scoreHA(g):g.time?esc(g.time):'&nbsp;'}</small></button>`}).join('')}</div>`;
}

/* ---------- kick-off: who's in goal, then players a side, then start the clock ---------- */
function tryKick(id,o={}){
  const g=G(id);
  if(!started(g)){
    if(!g.gk&&!o.nokeeper){S.askGk=id;S.askSize=null;render();return}
    const n=g.starters.length;
    if(!o.sizeOk&&n&&n!==gameSize(g)){S.askGk=null;S.askSize={g:id,n,why:n<gameSize(g)?'fewer':'kickmore'};render();return}
  }
  S.askGk=null;S.askSize=null;
  mut(id,g=>{g.clock.running=true;g.clock.startedAt=Date.now();g.done=false});
  if(!started(g))toast('Kicked off.');
}

/* ---------- players a side: changing it for one game ---------- */
function sizeAsk(g,a){
  const more=a.why==='more'||a.why==='kickmore';
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="szq"><div class="box">
    <h3 id="szq">${more?`Play ${a.n}-a-side this game?`:`Only ${a.n} starting`}</h3>
    <p class="note">${more?`That makes ${a.n} starting${a.why==='kickmore'?' with the keeper':''}, but this game is ${gameSize(g)}-a-side.`:`This game is ${gameSize(g)}-a-side. Kick off with ${a.n} instead?`} Other games aren't changed.</p>
    <div class="cbtns"><button class="btn go" data-act="sizeyes">${more?`Yes, ${a.n}-a-side`:`Kick off ${a.n}-a-side`}</button><button class="btn" data-act="sizeno">${more?'No':'Cancel'}</button></div>
  </div></div>`;
}

/* ---------- keeper check before kick-off ---------- */
function keeperAsk(g){
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="gkq"><div class="box">
    <h3 id="gkq">Who's in goal?</h3>
    <p class="note">No keeper is picked for this game.</p>
    ${g.starters.length?`<span class="lbl">Starting</span><div class="pickchips">${byName(g.starters).map(p=>`<button class="pc" data-act="pickgk" data-p="${p}">${esc(nameOf(p))}</button>`).join('')}</div>`:''}
    ${g.bench.length?`<span class="lbl">On the bench</span><div class="pickchips">${byName(g.bench).map(p=>`<button class="pc" data-act="pickgk" data-p="${p}">${esc(nameOf(p))}</button>`).join('')}</div>`:''}
    <div class="cbtns"><button class="btn" data-act="kick" data-nokeeper="1">Kick off without a keeper</button><button class="btn" data-act="gkcancel">Cancel</button></div>
  </div></div>`;
}

/* ---------- goal scorers ---------- */
function scorerBar(g,i){
  const on=byName([...onPitchAt(g,g.goals[i].at)]);
  return `<div class="hint scorer"><b>Who scored?</b>
    <div class="pickchips">${on.map(p=>`<button class="pc" data-act="scorer" data-p="${p}">${esc(nameOf(p))}</button>`).join('')}
      <button class="pc" data-act="scorer" data-p="og">Own goal</button><button class="pc" data-act="scorerskip">Skip</button></div></div>`;
}

/* ---------- corrections: game length, clock, subs after the fact ---------- */
// Subs are recorded live by default; this panel fixes the clock and adds, retimes or removes subs.
function parseT(v){const m=String(v||'').trim().replace('.',':').match(/^(\d{1,3})(?::(\d{1,2}))?$/);if(!m)return null;return (+m[1]*60+(+(m[2]||0)))*1000}
function keeperAt(g,t,skip){const ev=[...bySubTime(g).filter(e=>e!==skip&&e.gk&&e.at<=t).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[]).filter(c=>c.at<=t)].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function onPitchAt(g,t){const s=new Set(g.starters);for(const e of bySubTime(g)){if(e.at>t)break;s.delete(e.off);if(e.on)s.add(e.on)}return s}
function subsProblem(g){ // replay every sub in time order: each one must take off someone who was on, and bring on someone who wasn't
  const s=new Set(g.starters),end=el(g);
  for(const e of bySubTime(g)){
    if(e.at>end)return `${fmt(e.at)} is later than the clock (${fmt(end)}).`;
    if(!s.has(e.off))return `${nameOf(e.off)} wasn't on the pitch at ${fmt(e.at)}.`;
    if(e.on&&s.has(e.on))return `${nameOf(e.on)} was already on the pitch at ${fmt(e.at)}.`;
    s.delete(e.off);if(e.on)s.add(e.on);
  }
  return null;
}
function tryFix(id,fn,ok){ // apply a correction only if the subs still make sense afterwards
  const g=structuredClone(G(id));fn(g);
  g.subs.forEach(e=>{const k=keeperAt(g,e.at,e)===e.off;if(k)e.gk=true;else delete e.gk});
  const bad=subsProblem(g);if(bad){toast(bad+' Nothing was changed.');return false}
  S.games[id]=g;put('games/'+id,g);if(ok)toast(ok);render();return true;
}
function fixPanel(id,g,st){
  const now=fmt(el(g)),inG=inGame(g),subs=g.subs.map((e,i)=>({e,i})).sort((a,b)=>b.e.at-a.e.at);
  const opt=(ids,ph)=>`<option value="">${ph}</option>`+ids.map(p=>`<option value="${p}">${esc(nameOf(p))}</option>`).join('');
  return `<section class="card fix"><h3>Game length</h3>
    <label class="lenrow"><span>Minutes per game</span><input class="num" type="number" min="1" max="60" data-tour="len" value="${S.tour.len||10}"></label>
    <span class="seg fill" role="group" aria-label="Periods">${[[1,'One period'],[2,'Halves'],[4,'Quarters']].map(([v,l])=>`<button class="${nPer()===v?'on':''}" data-act="periods" data-v="${v}">${l}</button>`).join('')}</span>
    ${nPer()>1?`<p class="note">${nPer()===2?'Two halves':'Four quarters'} of ${fmt(perLen())}. Times below count from kick-off: ${Array.from({length:nPer()-1},(_,i)=>perName(i+1)+' starts at '+fmt((i+1)*perLen())).join(', ')}.</p>`:''}
    <p class="note">Applies to every game in this tournament.</p>
    <label class="lenrow"><span>Players a side, this game</span><input class="num" type="number" min="3" max="11" data-gsize="1" value="${gameSize(g)}"></label>
    ${gameSize(g)!==tourSize()?`<p class="note">The tournament is ${tourSize()}-a-side. <button class="x" data-act="gsizereset">Use ${tourSize()}</button></p>`:''}
  ${st?`<h3>Clock</h3>
    <div class="addf"><input id="clkset" class="num" inputmode="decimal" placeholder="e.g. 4:30" value="${now}" aria-label="Set the clock to"><button class="btn" data-act="clockset">Set clock</button></div>
    <button class="btn warn" data-act="clock0">${S.confirm==='clk0'?'Tap again to reset the clock to 0:00':'Reset clock to 0:00'}</button>
    <p class="note">Subs recorded after the new time move back to it, so playing time stays right.</p>
  <h3>Add a sub that already happened</h3>
    <div class="subadd">
      <label><span class="lbl">Time</span><input id="psat" class="num" inputmode="decimal" value="${now}" placeholder="4:30"></label>
      <label><span class="lbl">Off</span><select id="psoff">${opt(byName(inG),'Choose')}</select></label>
      <label><span class="lbl">On</span><select id="pson">${opt(S.squad.map(p=>p.id),'Choose')}</select></label>
    </div>
    <button class="btn go" data-act="pastsub">Add sub</button>
  ${subs.length?`<h3>Change a sub's time</h3>
    <div class="rows">${subs.map(({e,i})=>`<div class="row"><input class="num subt" data-subat="${i}" value="${fmt(e.at)}" inputmode="decimal" aria-label="Time of this sub"><span class="txt"><span class="onn">▲ ${esc(nameOf(e.on))}</span> <span class="off">▼ ${esc(nameOf(e.off))}</span></span>
      <button class="x ${S.confirm==='sd'+i?'sure':''}" data-act="subdel" data-i="${i}">${S.confirm==='sd'+i?'Tap to delete':'Delete'}</button></div>`).join('')}</div>
    <p class="note">Type a new time and tap away to save it.</p>`:''}`:''}
  </section>`;
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='file'&&a.closest('#view, .top')){pending=true;syncHeader(false);return}
  pending=false;syncHeader(true);
  document.body.classList.toggle('ro',S.readOnly);
  document.body.classList.toggle('gate',!!(S.gate||S.teams||S.menu));
  const mb=document.getElementById('menubtn');if(mb)mb.hidden=!(FB&&S.teamId&&!S.gate);
  const sec=secOf(S.tab);document.body.classList.toggle('sec-season',sec==='season');
  document.body.classList.toggle('ingame',!(S.tab==='games'&&!S.game&&!S.fx)); // name/date only on the Games list
  document.getElementById('sections').innerHTML=Object.entries(SECTIONS).map(([k,x])=>`<button class="${k===sec?'on':''}" data-act="section" data-s="${k}" aria-pressed="${k===sec}">${x.label}</button>`).join('');
  document.getElementById('subtabs').innerHTML=SECTIONS[sec].tabs.map(([k,l])=>`<button class="${k===S.tab?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('');
  const v=document.getElementById('view');
  const h=document.getElementById('hteam');h.textContent=S.gate?'':S.cfg.team||'';
  const sw=!!(FB&&S.teamId&&!S.gate);h.classList.toggle('teamsw',sw);if(sw)h.dataset.act='teams';else delete h.dataset.act;
  h.classList.toggle('others',sw&&myTeams().some(t=>t!==S.teamId&&teamInfo[t]?.running?.length));
  if(S.gate){v.innerHTML=gateView();return}
  if(S.teams){v.innerHTML=teamsView();return}
  if(S.menu){v.innerHTML=menuView();return}
  if(S.cfgLoaded&&!S.cfg.team){v.innerHTML=setupView();return}
  v.innerHTML=S.tab==='games'&&S.fx&&!S.game?fixturesView():S.tab==='games'?(S.game?gameView(S.game):gamesList()):S.tab==='minutes'?minutesView():S.tab==='notes'?notesView():S.tab==='awards'?awardsView():S.tab==='season'?seasonView():squadView();
}
function syncHeader(force){
  const n=document.getElementById('tname'),d=document.getElementById('tdate');
  if(force||document.activeElement!==n)n.value=S.tour.name||'';
  if(force||document.activeElement!==d)d.value=S.tour.date||'';
}
function status(g){
  if(g.done)return'<span class="pill ft">Full time</span>';
  if(g.clock.running)return'<span class="pill live">Live</span>';
  if(atBreak(g))return`<span class="pill live">${nPer()===2?'Half time':'Q'+atBreak(g)+' break'}</span>`;
  if(started(g))return'<span class="pill live">Paused</span>';
  return'<span class="pill">Not started</span>';
}

  return `<div class="sec">
  <div class="summary num"><span>Played <b>${W+D+L}</b> of ${ids.length}</span><span>W <b>${W}</b> · D <b>${D}</b> · L <b>${L}</b></span><span>Goals <b>${F}–${A}</b></span></div>
  <div class="glist">${ids.map(id=>{const g=G(id);const n=inGame(g).length;
    return `<button class="gcard" data-act="open" data-g="${id}">
      <span class="gn"><small>GAME</small>${g.n}</span>
      <span style="min-width:0"><span class="opp">${g.opponent?esc(homeName(g))+' v '+esc(awayName(g)):'Opponent not set'}</span>

      <span class="res">${started(g)?`<span class="scr num">${scoreHA(g)}</span>`:''}${status(g)}${started(g)&&!g.done?`<span class="sub num" data-clock="${id}">${nPer()>1?perShort(perOf(el(g)))+' ':''}${clockText(g)}</span>`:''}</span>
    </button>`}).join('')}</div>

  ${nPer()>1?`<p class="note">${nPer()===2?'Two halves':'Four quarters'} of ${fmt(perLen())}. The clock pauses by itself at each break.</p>`:''}

function minutesView(){
  if(!S.squad.length)return `<div class="empty"><b>No squad yet</b>Add the players on the Squad tab and their playing time will add up here.</div>`;
  const per=gids().map(id=>({g:G(id),m:mins(G(id)),k:G(id)})),gl=goalTally(per.map(x=>x.g));
  const rows=S.squad.map(p=>{let t=0,n=0,gk=0,brk=[];per.forEach(({g,m})=>{if(p.id in m){t+=m[p.id];n++;brk.push(`G${g.n} ${fmt(m[p.id])}`)}if(g.gk===p.id)gk++});return{p,t,n,gk,brk}}).sort((a,b)=>a.t-b.t);
  const max=Math.max(1,...rows.map(r=>r.t)),avg=rows.reduce((s,r)=>s+r.t,0)/rows.length;
  return `<div class="sec"><p class="note">Least time first, so you can see who needs more minutes. Average so far: <b class="num">${fmtM(avg)}</b>.</p>
  <div class="rows">${rows.map(r=>{const low=avg>0&&r.t<avg*0.8;return `<div class="mrow ${low?'low':''}"><span class="who">${esc(r.p.name)}${low?'<span class="flag">Needs time</span>':''}</span><span class="tot num">${fmtM(r.t)}</span>
    <span class="bar"><i style="width:${(r.t/max*100).toFixed(1)}%"></i></span>
    <span class="brk num">${r.n?r.n+(r.n>1?' games':' game')+(r.gk?` · starts in goal ${r.gk}×`:'')+(gl[r.p.id]?` · ⚽ ${gl[r.p.id]}`:'')+' · '+r.brk.join(' · '):'Not picked yet'}</span></div>`}).join('')}</div></div>`;
}

/* ---------- backup ---------- */
// A backup is one JSON file with every document the app stores. New versions may add fields
// but must keep reading old backups, so never rename or remove a field.
function backupCard(){
  const r=S.restore;
  if(r)return `<div class="card"><h3>Restore this backup?</h3>
    <p>Saved ${esc(nice(r.exported.slice(0,10)))} from <b>${esc(r.cfg?.team||'a team')}</b>: ${[[r.squad.length,'player'],[Object.keys(r.games).length,'game'],[r.archive.length,'tournament'],[r.awards.length,'award']].map(([n,w])=>n+' '+w+(n===1?'':'s')).join(', ')}.</p>
    <p class="note">This replaces the team's current squad, games, season record and awards for every coach on the team.</p>
    <div class="cbtns"><button class="btn warn" data-act="restoreok">Replace with backup</button><button class="btn" data-act="restorecancel">Cancel</button></div></div>`;
  return `<div class="card"><h3>Backup</h3>
    <p class="note">Save a copy of everything (squad, games, season record, awards) to this phone. Do it before the end of the season, or before deleting anything.</p>
    <div class="cbtns"><button class="btn" data-act="backup">Save a backup</button>
    <label class="btn filebtn">Restore from a backup<input id="restorefile" type="file" accept=".json,application/json"></label></div></div>`;
}
async function saveBackup(){
  const data={app:'match-day',version:APP_VERSION,exported:new Date().toISOString(),
    cfg:S.cfg,squad:S.squad,tour:S.tour,games:S.games,awards:S.awards,archive:S.archive};
  const slug=(S.cfg.short||S.cfg.team||'team').replace(/[^\w-]+/g,'-').toLowerCase();
  const name=`match-day-${slug}-${today()}.json`;
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  // Phones: the share sheet lets coaches save to Files, Drive or email. Computers: a normal download.
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved.');
}
async function readBackup(f){
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='match-day'||!Array.isArray(d.squad)||typeof d.games!=='object')throw 0;
    S.restore={exported:String(d.exported||''),cfg:d.cfg||null,squad:d.squad,tour:d.tour||{},games:d.games||{},awards:d.awards||[],archive:d.archive||[]};
  }catch(_){toast("That file isn't a Match Day backup.")}
  render();
}
function applyRestore(){
  const r=S.restore;S.restore=null;
  if(r.cfg&&r.cfg.team){S.cfg={...DEFAULT_CFG,...r.cfg};put('club/settings',S.cfg)}
  S.squad=alpha(r.squad);put('club/squad',{players:S.squad});
  S.tour={...S.tour,...r.tour};put('club/tournament',S.tour);
  Object.keys(S.games).forEach(id=>{if(!(id in r.games))remove('games/'+id)});
  S.games=r.games;Object.entries(r.games).forEach(([id,g])=>put('games/'+id,g));
  const keep=(list,coll)=>{const ids=new Set(list.map(x=>x.id));S[coll].forEach(x=>{if(!ids.has(x.id))remove(coll+'/'+x.id)});
    list.forEach(({id,...doc})=>put(coll+'/'+id,doc));S[coll]=list};
  keep(r.awards,'awards');keep(r.archive,'archive');
  toast('Backup restored.');render();
}

/* ---------- squad helpers ---------- */
function addNames(text){
  const raw=String(text||'').split(/[\n,;]+/).map(x=>x.replace(/\s+/g,' ').replace(/[^\p{L}\p{M}' -]/gu,'').trim()).filter(Boolean);
  if(!raw.length)return 0;
  const firsts=raw.map(n=>n.split(' ')[0]);
  const all=firsts.map(f=>f.toLowerCase());
  let added=0;const squad=[...S.squad];
  raw.forEach((n,i)=>{const parts=n.split(' '),f=cap(parts[0]);
    let name=f;if(all.filter(x=>x===f.toLowerCase()).length>1&&parts[1])name=f+' '+parts[1][0].toUpperCase();
    if(squad.some(p=>p.name.toLowerCase()===name.toLowerCase()))return;
    squad.push({id:'p'+Math.random().toString(36).slice(2,9),name:name.slice(0,30)});added++});
  S.squad=squad;if(added)saveSquad();return added;
}
const cap=w=>w?w[0].toUpperCase()+w.slice(1):w;

function parseFixtures(text){
  const short=(S.cfg.short||'').trim().toLowerCase();
  let lines=String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(short&&lines.some(l=>l.toLowerCase().includes(short)))lines=lines.filter(l=>l.toLowerCase().includes(short));
  return lines.map(l=>{
    let time='',pitch='',rest=l;
    const tm=rest.match(/\b(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);if(tm){time=tm[1]+':'+tm[2];rest=rest.replace(tm[0],' ')}
    const pm=rest.match(/\(?\s*(?:pitch|pt)\s*([A-Za-z0-9]+)\s*\)?/i)||rest.match(/\bP(\d+)\b/);if(pm){pitch=pm[1];rest=rest.replace(pm[0],' ')}
    rest=rest.replace(/[()\[\]|]/g,' ');
    let parts=rest.split(/\s+(?:vs\.?|v\.?|versus|-|–)\s+/i).map(x=>x.trim()).filter(Boolean);
    let opp=parts.length>1?(parts.find(x=>!short||!x.toLowerCase().includes(short))||parts[1]):(parts[0]||'');
    const side=parts.length>1&&short&&!parts[0].toLowerCase().includes(short)&&parts.slice(1).some(x=>x.toLowerCase().includes(short))?'away':'home';
    if(short)opp=opp.replace(new RegExp(short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),' ');
    opp=opp.replace(/^\s*(?:v|vs)\s+/i,'').replace(/\s+/g,' ').trim().slice(0,40);
    return{time,pitch,opponent:opp,side};
  }).filter(f=>f.opponent||f.time).slice(0,10);
}

    ${picked.map(id=>`<label style="display:flex;flex-direction:column;gap:4px"><span class="lbl">${esc(nameOf(id))} – what for?</span><input id="aw-r-${id}" data-awr="${id}" value="${esc(A.picks[id])}" placeholder="e.g. Brilliant saves in goal"></label>`).join('')}

      <ul>${(a.winners||[]).map(w=>`<li><span class="star">★</span> <b>${esc(nameOf(w.p))}</b>${w.reason?` <i>– ${esc(w.reason)}</i>`:''}</li>`).join('')}</ul></div>`).join('')}</div>`

/* ---------- season ---------- */
function finishTournament(){
  const ids=gids();
  const games=ids.map(id=>{const g=G(id);return{n:g.n,opponent:g.opponent,team:usName(),side:isAway(g)?'away':'home',size:gameSize(g),time:g.time,pitch:g.pitch,score:g.score,done:g.done,played:started(g),gk:keeper(g)||g.gk||null,mins:mins(g),goals:(g.goals||[]).map(x=>({at:x.at,p:x.p||null}))}});
  const doc={name:S.tour.name||'',date:S.tour.date||today(),savedAt:Date.now(),games,players:S.squad.map(p=>({id:p.id,name:p.name}))};
  const tid='t'+Date.now();
  put('archive/'+tid,doc);S.archive=[{id:tid,...doc},...S.archive.filter(t=>t.id!==tid)];
  ids.forEach(id=>{const n=blank(G(id).n);S.games[id]=n;put('games/'+id,n)});
  S.tour={...S.tour,name:'',date:''};saveTour();
  toast('Tournament saved to the Season tab.');render();
}
function record(games){let W=0,D=0,L=0,F=0,A=0;games.filter(g=>g.played||g.done).forEach(g=>{F+=g.score.us;A+=g.score.them;g.score.us>g.score.them?W++:g.score.us<g.score.them?L++:D++});return{W,D,L,F,A}}
function seasonView(){
  const ts=[...S.archive].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.savedAt-a.savedAt);
  const all=record(ts.flatMap(t=>t.games||[]));
  const tot={},gp={};ts.forEach(t=>(t.games||[]).forEach(g=>Object.entries(g.mins||{}).forEach(([p,ms])=>{tot[p]=(tot[p]||0)+ms;gp[p]=(gp[p]||0)+1})));
  const ac=awardCounts(),gl=goalTally(ts.flatMap(t=>t.games||[])),now=goalTally(gids().map(G));
  const allG={...gl};Object.entries(now).forEach(([p,n])=>{allG[p]=(allG[p]||0)+n});
  const scorers=Object.entries(allG).sort((a,b)=>b[1]-a[1]||nameOf(a[0]).localeCompare(nameOf(b[0])));
  const rank=scorers.map(([,n],i,arr)=>arr.findIndex(([,m])=>m===n)+1); // joint places share a number
  const ppl=new Map();S.squad.forEach(p=>ppl.set(p.id,p.name));Object.keys(tot).forEach(p=>{if(!ppl.has(p))ppl.set(p,nameOf(p))});
  const rows=[...ppl].map(([id,name])=>({id,name,t:tot[id]||0,n:gp[id]||0,a:ac[id]||0})).sort((a,b)=>a.t-b.t);
  const max=Math.max(1,...rows.map(r=>r.t)),avg=rows.length?rows.reduce((s,r)=>s+r.t,0)/rows.length:0;
  return `<div class="sec" style="gap:14px">
  ${ts.length?`<div class="summary num"><span>Tournaments <b>${ts.length}</b></span><span>W <b>${all.W}</b> · D <b>${all.D}</b> · L <b>${all.L}</b></span><span>Goals <b>${all.F}–${all.A}</b></span><span>Awards <b>${S.awards.length}</b> sessions</span></div>`:''}
  <section class="sec"><h3>Season minutes</h3>
  ${ts.length&&rows.length?`<p class="note">Saved tournaments only, least time first.</p><div class="rows">${rows.map(r=>{const low=avg>0&&r.t<avg*0.8;return `<div class="mrow ${low?'low':''}"><span class="who">${esc(r.name)}${low?'<span class="flag">Needs time</span>':''}</span><span class="tot num">${fmtM(r.t)}</span>
    <span class="bar"><i style="width:${(r.t/max*100).toFixed(1)}%"></i></span><span class="brk num">${r.n} game${r.n===1?'':'s'}${gl[r.id]?` · ${gl[r.id]} goal${gl[r.id]>1?'s':''}`:''}${r.a?` · <span class="star">★${r.a}</span> award${r.a>1?'s':''}`:''}</span></div>`}).join('')}</div>`
  :`<div class="empty"><b>Nothing saved yet</b>When a tournament ends, tap "Finish tournament and save to season" on the Games tab.</div>`}</section>
  ${scorers.length?`<section class="sec"><h3>Goal scorers</h3><p class="note">Every scorer this season, most goals first${Object.keys(now).length?', including the tournament in progress':''}.</p>
    <div class="rows">${scorers.map(([p,n],i)=>`<div class="row"><span class="rk num">${rank[i]}</span><span class="who">${esc(nameOf(p))}${now[p]?` <span class="note">(${now[p]} today)</span>`:''}</span><b class="num">${n}</b></div>`).join('')}</div></section>`:''}
  ${ts.length?`<section class="sec"><h3>Tournaments</h3>${ts.map(t=>{const r=record(t.games||[]),open=S.openT===t.id;
    return `<div class="tcard"><button data-act="topen" data-id="${t.id}"><span><span class="tn">${esc(t.name||'Tournament')}</span><span class="ts" style="display:block">${esc(nice(t.date))}</span></span>
      <span class="num" style="text-align:right"><b>W${r.W} D${r.D} L${r.L}</b><span class="ts" style="display:block">Goals ${r.F}–${r.A}</span></span></button>
      ${open?`<div class="tb">${(t.games||[]).map(g=>`<div class="gl"><span>${esc(g.time||'G'+g.n)} ${esc(isAway(g)?(g.opponent||'?'):(g.team||t.short||S.cfg.short||'Us'))} v ${esc(isAway(g)?(g.team||t.short||S.cfg.short||'Us'):(g.opponent||'?'))}</span><b class="num">${g.played||g.done?scoreHA(g):'not played'}</b></div>${(g.goals||[]).length?`<div class="gls">⚽ ${(g.goals||[]).map(x=>esc(scorerName(x.p))).join(', ')}</div>`:''}`).join('')}
        <button class="x ${S.confirm==='t-'+t.id?'sure':''}" data-act="tdel" data-id="${t.id}" style="align-self:flex-start">${S.confirm==='t-'+t.id?'Tap to delete this tournament':'Delete this tournament'}</button></div>`:''}</div>`}).join('')}</section>`:''}
  ${ts.length||S.awards.length?`<div class="danger"><button class="btn warn" data-act="wipe">${S.confirm==='wipe'?'Tap again to delete all season data':'Delete all season data'}</button>
    <p class="note">For the end of the season: removes every saved tournament and award. The squad stays until you remove the players on the Squad tab.</p></div>`:''}
  </div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=S.game,p=b.dataset.p;
  if(!['reset','del','finish','awdel','tdel','wipe','leave','clock0','subdel','signout','notedel'].includes(a))S.confirm=null;
  switch(a){
    case'tab':if(b.dataset.t===S.tab&&S.game){S.game=null;S.fix=null;S.pick=null;render();break}
      S.tab=b.dataset.t;lastTab[secOf(S.tab)]=S.tab;S.pick=null;render();break;
    case'section':S.tab=lastTab[b.dataset.s]||SECTIONS[b.dataset.s].tabs[0][0];S.pick=null;render();window.scrollTo(0,0);break;
    case'open':S.game=b.dataset.g;S.pick=null;S.addLate=false;render();window.scrollTo(0,0);break;
    case'back':S.fix=null;S.game=null;S.pick=null;render();break;
    case'reset':if(S.confirm==='reset'){S.confirm=null;gids().forEach(g=>{const o=G(g),n=blank(o.n);Object.assign(n,{opponent:o.opponent,time:o.time,pitch:o.pitch,team:o.team});S.games[g]=n;put('games/'+g,n)});toast('Scores, line-ups and subs cleared. Fixtures kept.');render()}else{S.confirm='reset';render()}break;
    case'score':{const k=b.dataset.k,d=+b.dataset.d;
      if(k==='us'&&d>0){let i=0;mut(id,g=>{g.goals=[...(g.goals||[]),{at:el(g),p:null}];i=g.goals.length-1;g.score.us++});S.scorer={g:id,i};render();break}
      if(k==='us'&&d<0){mut(id,g=>{if(g.score.us<=0)return;g.score.us--;const gs=g.goals||[];if(gs.length>g.score.us)g.goals=gs.slice(0,g.score.us)});S.scorer=null;render();break}
      mut(id,g=>{g.score[k]=Math.max(0,g.score[k]+d)});break}
    case'scorer':{const sc=S.scorer;if(sc)mut(sc.g,g=>{if(g.goals&&g.goals[sc.i])g.goals[sc.i].p=b.dataset.p});S.scorer=null;render();break}
    case'scorerskip':S.scorer=null;render();break;
    case'kick':tryKick(id,{nokeeper:!!b.dataset.nokeeper});break;
    case'sizeyes':{const a=S.askSize;S.askSize=null;if(!a)break;
      mut(a.g,g=>{g.size=a.n});
      if(a.why==='more'){mut(a.g,g=>{g.starters=g.starters.filter(x=>x!==a.p);g.bench=g.bench.filter(x=>x!==a.p);if(g.gk===a.p)g.gk=null;
        if(a.r==='gk'){g.gk=a.p;g.starters.unshift(a.p)}else g.starters.push(a.p)});toast(`Game ${G(a.g).n} is ${a.n}-a-side.`)}
      else{toast(`Game ${G(a.g).n} is ${a.n}-a-side.`);tryKick(a.g,{sizeOk:true,nokeeper:true})}
      break}
    case'gsizereset':mut(id,g=>{delete g.size});break;
    case'sizeno':S.askSize=null;render();break;
    case'pickgk':mut(id,g=>{g.gk=p;g.bench=g.bench.filter(x=>x!==p);g.starters=[p,...g.starters.filter(x=>x!==p)]});S.askGk=null;
      toast(`${nameOf(p)} is in goal.`);tryKick(id,{nokeeper:true});break;
    case'gkcancel':S.askGk=null;render();break;
    case'pause':mut(id,g=>{g.clock.acc=el(g);g.clock.running=false});break;
    case'ft':S.pick=null;mut(id,g=>{g.clock.acc=el(g);g.clock.running=false;g.done=true});break;
    case'reopen':mut(id,g=>{g.done=false});break;
    case'role':{const r=b.dataset.r,g=G(id);
      const startersAfter=g.starters.filter(x=>x!==p).length;
      if((r==='start'||r==='gk')&&!g.starters.includes(p)&&startersAfter>=gameSize(g)){
        if(gameSize(g)>=11){toast('11 are already starting. Move one to the bench first.');break}
        S.askSize={g:id,n:startersAfter+1,p,r,why:'more'};render();break}
      mut(id,g=>{g.starters=g.starters.filter(x=>x!==p);g.bench=g.bench.filter(x=>x!==p);if(g.gk===p)g.gk=null;
        if(r==='gk'){g.gk=p;g.starters.unshift(p)}if(r==='start')g.starters.push(p);if(r==='bench')g.bench.push(p)});break}
    case'tap':{const side=b.dataset.side;
      if(S.pick&&S.pick.g===id&&S.pick.p!==p&&(S.pick.side!==side||side==='pitch')){const pk=S.pick;S.pick=null;swap(id,pk.p,pk.side,p,side);if(!S.pick)render()}
      else{S.pick=S.pick&&S.pick.p===p?null:{g:id,p,side};render()}break}
    case'cancel':S.pick=null;render();break;
    case'acctcreate':S.acct='create';render();setTimeout(()=>document.getElementById('acctemail')?.focus(),0);break;
    case'acctsignin':S.acct='signin';render();setTimeout(()=>document.getElementById('acctemail')?.focus(),0);break;
    case'acctcancel':S.acct=null;render();break;
    case'acctforgot':resetPassword();break;
    case'google':b.disabled=true;googleSignIn().finally(()=>{b.disabled=false});break;
    case'signout':if(S.confirm==='signout')signOutAccount();else{S.confirm='signout';render()}break;
    case'side':mut(id,g=>{g.side=b.dataset.v==='away'?'away':'home'});break;
    case'fxside':mut(b.dataset.g,g=>{g.side=isAway(g)?'home':'away'});break;
    case'notedone':S.notes=S.notes.map(n=>n.id===b.dataset.id?{...n,done:!n.done}:n);saveNotes();break;
    case'notedel':{const k='nd-'+b.dataset.id;if(S.confirm===k){S.confirm=null;S.notes=S.notes.filter(n=>n.id!==b.dataset.id);saveNotes()}else{S.confirm=k;render()}break}
    case'notesdone':S.showDone=!S.showDone;render();break;
    case'periods':S.tour={...S.tour,periods:+b.dataset.v};saveTour();render();break;
    case'menu':S.menu=true;S.teams=false;S.game=null;S.fix=null;render();window.scrollTo(0,0);break;
    case'menuclose':S.menu=false;S.acct=null;render();break;
    case'teams':S.teams=true;S.game=null;S.fix=null;render();window.scrollTo(0,0);break;
    case'teamsclose':S.teams=false;render();break;
    case'switch':if(b.dataset.id===S.teamId){S.teams=false;render()}else switchTeam(b.dataset.id);break;
    case'addteam':S.menu=false;S.teams=false;S.gate=true;S.adding=true;render();break;
    case'gateback':S.gate=false;S.adding=false;S.teams=false;S.menu=true;render();break;
    case'fix':S.fix=S.fix===id?null:id;render();if(S.fix)setTimeout(()=>document.querySelector('.fix')?.scrollIntoView({behavior:'smooth',block:'start'}),0);break;
    case'clockset':{const v=parseT(document.getElementById('clkset')?.value);if(v==null){toast('Type the time like 4:30.');break}
      tryFix(id,g=>{g.clock.acc=v;if(g.clock.running)g.clock.startedAt=Date.now();g.subs.forEach(e=>{if(e.at>v)e.at=v});(g.gkChanges||[]).forEach(c=>{if(c.at>v)c.at=v})},`Clock set to ${fmt(v)}.`);break}
    case'clock0':if(S.confirm==='clk0'){S.confirm=null;tryFix(id,g=>{g.clock.acc=0;if(g.clock.running)g.clock.startedAt=Date.now();g.subs.forEach(e=>e.at=0);(g.gkChanges||[]).forEach(c=>c.at=0)},'Clock reset to 0:00.')}else{S.confirm='clk0';render()}break;
    case'pastsub':{const at=parseT(document.getElementById('psat')?.value),off=document.getElementById('psoff')?.value,on=document.getElementById('pson')?.value;
      if(at==null){toast('Type the time like 4:30.');break}if(!off||!on){toast('Pick who came off and who went on.');break}if(off===on){toast('Pick two different players.');break}
      tryFix(id,g=>{g.subs.push({at,off,on});if(!inGame(g).includes(on))g.bench.push(on)},`${nameOf(on)} on, ${nameOf(off)} off at ${fmt(at)}.`);break}
    case'subdel':{const i=+b.dataset.i,k='sd'+i;if(S.confirm===k){S.confirm=null;tryFix(id,g=>{g.subs.splice(i,1)},'Sub deleted.')}else{S.confirm=k;render()}break}
    case'undo':mut(id,g=>{const last=[...g.subs].sort((a,b)=>b.at-a.at)[0];g.subs=g.subs.filter(x=>x!==last)});toast('Last sub removed.');break;
    case'late':S.addLate=!S.addLate;render();break;
    case'addbench':mut(id,g=>{if(!g.bench.includes(p))g.bench.push(p)});break;
    case'del':if(S.confirm===p){S.confirm=null;S.squad=S.squad.filter(x=>x.id!==p);saveSquad()}else{S.confirm=p;render()}break;
    case'finish':if(S.confirm==='finish'){S.confirm=null;finishTournament()}else{S.confirm='finish';render()}break;
    case'awtype':S.aw.type=b.dataset.v;render();break;
    case'awpick':if(p in S.aw.picks)delete S.aw.picks[p];else S.aw.picks[p]='';render();break;
    case'awsave':{const ps=Object.entries(S.aw.picks);if(!ps.length)break;const aid='a'+Date.now();
      const doc={date:S.aw.date||today(),type:S.aw.type,label:S.aw.label.trim().slice(0,60),winners:ps.map(([p,r])=>({p,reason:String(r||'').trim().slice(0,80)})),createdAt:Date.now()};
      S.awards=[...S.awards,{id:aid,...doc}];put('awards/'+aid,doc);S.aw={date:S.aw.date,type:S.aw.type,label:'',picks:{}};toast(`${ps.length} award${ps.length>1?'s':''} saved.`);render();break}
    case'awdel':{const k='aw-'+b.dataset.id;if(S.confirm===k){S.confirm=null;S.awards=S.awards.filter(x=>x.id!==b.dataset.id);remove('awards/'+b.dataset.id);render()}else{S.confirm=k;render()}break}
    case'topen':S.openT=S.openT===b.dataset.id?null:b.dataset.id;render();break;
    case'tdel':{const k='t-'+b.dataset.id;if(S.confirm===k){S.confirm=null;S.archive=S.archive.filter(x=>x.id!==b.dataset.id);remove('archive/'+b.dataset.id);render()}else{S.confirm=k;render()}break}

    case'fxopen':S.fx=true;render();window.scrollTo(0,0);break;
    case'fxclose':S.fx=false;render();break;
    case'fxadd':S.tour={...S.tour,count:Math.min(10,(S.tour.count||6)+1)};saveTour();render();break;
    case'fxdrop':S.tour={...S.tour,count:Math.max(1,(S.tour.count||6)-1)};saveTour();render();break;
    case'fxparse':{const f=parseFixtures(document.getElementById('fxpaste')?.value);if(!f.length){toast('No fixtures found. Put one game per line with the opponent in it.');break}
      S.tour={...S.tour,count:f.length};saveTour();
      f.forEach((x,i)=>{const id='g'+(i+1),g=structuredClone(G(id));Object.assign(g,{time:x.time,opponent:x.opponent,pitch:x.pitch,side:x.side});S.games[id]=g;put('games/'+id,g)});
      document.getElementById('fxpaste').value='';toast(`${f.length} fixtures filled in. Check them above.`);render();break}
    case'bulkadd':{const t=document.getElementById('bulknames');const n=addNames(t?.value);if(t)t.value='';toast(n?`${n} added to the squad.`:'Nobody new to add.');render();break}
    case'setupdone':{const c={...S.cfg};['team','short'].forEach(k=>{const i=document.getElementById('cfg-'+k);if(i)c[k]=i.value.trim().slice(0,40)});
      const sz=document.getElementById('cfg-size');c.size=Math.min(11,Math.max(3,parseInt(sz?.value)||5));
      if(!c.team){toast('Add a team name first.');break}if(!c.short)c.short=c.team.split(' ')[0];
      S.cfg=c;put('club/settings',c);addNames(document.getElementById('bulknames')?.value);toast('All set.');render();break}
    case'mkteam':b.disabled=true;createTeam().finally(()=>{b.disabled=false});break;
    case'backup':saveBackup();break;
    case'restoreok':applyRestore();break;
    case'restorecancel':S.restore=null;render();break;
    case'leave':if(S.confirm==='leave')leaveTeam();else{S.confirm='leave';render()}break;
  }
});

/* drag and drop between pitch and bench */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip[data-p]');if(!c||S.readOnly||e.button>0)return;
  drag={c,x:e.clientX,y:e.clientY,pid:e.pointerId,moved:false,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.moved=true;const r=drag.c.getBoundingClientRect();drag.w=r.width;drag.h=r.height;
    const gh=drag.c.cloneNode(true);gh.classList.add('ghost');gh.style.width=r.width+'px';document.body.append(gh);drag.ghost=gh;drag.c.classList.add('dragging')}
  drag.ghost.style.transform=`translate(${e.clientX-drag.w/2}px,${e.clientY-drag.h/2}px) scale(1.08)`;
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.chip[data-p]');
  const ok=t&&t!==drag.c&&(t.dataset.side!==drag.c.dataset.side||t.dataset.side==='pitch')?t:null;
  if(drag.over!==ok){drag.over?.classList.remove('over');ok?.classList.add('over');drag.over=ok}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,350);
  d.ghost.remove();d.c.classList.remove('dragging');d.over?.classList.remove('over');
  if(!cancel&&d.over){S.pick=null;swap(d.c.dataset.g,d.c.dataset.p,d.c.dataset.side,d.over.dataset.p,d.over.dataset.side);render()}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* live clock */
setInterval(()=>{
  let any=false;
  gids().forEach(id=>{const g=G(id);if(!g.clock.running)return;any=true;
    if(nPer()>1){const startP=Math.floor(g.clock.acc/perLen()+1e-9),end=(startP+1)*perLen();
      if(startP<nPer()-1&&el(g)>=end){ // time for the break: stop the clock exactly on the boundary
        mut(id,g=>{g.clock.acc=end;g.clock.running=false});
        toast(nPer()===2?`Half time in game ${g.n}.`:`End of Q${startP+1} in game ${g.n}.`);return}}
    document.querySelectorAll(`[data-clock="${id}"]`).forEach(n=>n.textContent=(n.classList.contains('sub')&&nPer()>1?perShort(perOf(el(g)))+' ':'')+clockText(g));
    document.querySelectorAll(`[data-clocksub="${id}"]`).forEach(n=>n.textContent=clockSub(g));
    const m=mins(g);document.querySelectorAll(`[data-m^="${id}|"]`).forEach(n=>{n.textContent=fmt(m[n.dataset.m.split('|')[1]]||0)})});
  if(any&&S.tab==='minutes'&&!drag)render();
},1000);
