// answer has been seen. status: undefined = waiting, 'declined', 'unsent' (needs asking again), 'removed'.
function getPending(){try{return JSON.parse(lsGet('matchday-pending')||'[]').filter(x=>x&&x.t&&x.code)}catch(_){return[]}}
function setPending(l){lsSet('matchday-pending',l.length?JSON.stringify(l):null);S.pending=l}
function addPending(t,code,extra={}){const l=getPending().filter(x=>x.t!==t);l.push({t,code,at:Date.now(),...extra});setPending(l);watchPending()}
function markPending(t,status){setPending(getPending().map(x=>x.t===t?{...x,status}:x))}
function dropPending(t){setPending(getPending().filter(x=>x.t!==t))}
const pendingWatch={};
function watchPending(){
  const {F,fs,auth}=FB,uid=auth.currentUser?.uid;if(!uid)return;S.pending=getPending();
  S.pending.filter(x=>!x.status).forEach(({t})=>{if(pendingWatch[t])return;
    pendingWatch[t]=[
      F.onSnapshot(F.doc(fs,'teams',t,'members',uid),m=>{if(!m.exists())return; // accepted
        stopPending(t);dropPending(t);saveTeams([...myTeams(),t]);syncTeamList();
        if(!S.teamId)openTeam(t);else{toast("A coach accepted you. Open the team from My teams.");render()}},()=>{}),
      F.onSnapshot(F.doc(fs,'teams',t,'requests',uid),r=>{if(r.exists()||r.metadata.hasPendingWrites||r.metadata.fromCache)return;
        F.getDocFromServer(F.doc(fs,'teams',t,'members',uid)).then(m=>{if(!m.exists()&&getPending().some(x=>x.t===t&&!x.status)){ // declined
          stopPending(t);markPending(t,'declined');toast("Your request to join wasn't accepted.");render()}}).catch(()=>{})},()=>{})];
  });
}
function stopPending(t){(pendingWatch[t]||[]).forEach(u=>{try{u()}catch(_){}});delete pendingWatch[t]}
async function cancelRequest(t){
  const {F,fs,auth}=FB,p=getPending().find(x=>x.t===t);stopPending(t);dropPending(t);render();
  if(p&&!p.status)await F.deleteDoc(F.doc(fs,'teams',t,'requests',auth.currentUser.uid)).catch(()=>{});
}
async function askAgain(t){ // after a decline, a lost request or being removed: send it again with the same code
  const p=getPending().find(x=>x.t===t);if(!p)return;
  if(!navigator.onLine){toast('You need a signal to ask again.');return}
  if(!myName()){toast('Add your name first (☰ menu or the Join form).');return}
  try{await signedIn();await askToJoin(FB.F,FB.fs,FB.auth.currentUser,t,p.code);addPending(t,p.code);toast('Request sent again. A coach needs to accept you.')}
  catch(e){toast(e.code==='too-many'?"You're already waiting to join 3 teams. Cancel one of those requests first."
    :e.code==='permission-denied'?"That code doesn't work any more: the team has a new one. Ask a coach for it.":`Couldn't send it (${errCode(e)}).`)}
  render();
}

/* ---------- the team side: requests to accept, new coaches, removing a coach ---------- */
function watchRequests(t){
  const {F,fs}=FB;
  F.onSnapshot(F.collection(fs,'teams',t,'requests'),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));render()},()=>{});
}
const reqBusy={}; // request id -> 'accept' | 'decline' while it's being sent (no double taps)
async function acceptRequest(id){
  const {F,fs}=FB,r=S.requests.find(x=>x.id===id);if(!r||reqBusy[id])return;
  if(!navigator.onLine){toast('You need a signal to accept someone.');return}
  reqBusy[id]='accept';render();
  try{const t=await F.getDocFromServer(F.doc(fs,'teams',S.teamId));S.invite=t.data()?.code||S.invite;
    const b=F.writeBatch(fs);
    b.set(F.doc(fs,'teams',S.teamId,'members',id),{code:S.invite,joined:F.serverTimestamp(),name:r.name||'',via:r.via||'phone',by:myName()});
    b.delete(F.doc(fs,'teams',S.teamId,'requests',id));
    await track(within(b.commit(),10000).then(x=>{if(x===null)throw Object.assign(new Error('timeout'),{code:'no signal'})}));
    toast(`${r.name||'The new coach'} is in the team.`)}
  catch(e){toast(`Couldn't accept ${r.name||'them'} (${errCode(e)}). Try again.`)}
  finally{delete reqBusy[id];render()}
}
async function declineRequest(id){
  const {F,fs}=FB,r=S.requests.find(x=>x.id===id);if(!r||reqBusy[id])return;
  reqBusy[id]='decline';render();
  try{await track(F.deleteDoc(F.doc(fs,'teams',S.teamId,'requests',id)));toast(`Declined ${r.name||'the request'}. They're told it wasn't accepted.`)}
  catch(e){toast(`Couldn't decline (${errCode(e)}).`)}
  finally{delete reqBusy[id];render()}
}
async function newInviteCode(){ // manager: the old code stops working at once; coaches already in stay in
  const {F,fs}=FB,old=S.invite;
  if(!navigator.onLine){toast('You need a signal to make a new code.');return}
  for(let i=0;i<3;i++){ // a new random code could (very rarely) be taken already
    const code=newCode(),b=F.writeBatch(fs);
    b.update(F.doc(fs,'teams',S.teamId),{code});
    b.set(F.doc(fs,'codes',code),{team:S.teamId});
    if(old)b.delete(F.doc(fs,'codes',old));
    try{await track(within(b.commit(),10000).then(x=>{if(x===null)throw Object.assign(new Error('timeout'),{code:'no signal'})}),null,'team');
      toast(`New invite code ${showCode(code)}. The old code ${showCode(old)} no longer works.`);return}
    catch(e){if(e.code!=='permission-denied'||i===2){toast(`Couldn't make a new code (${errCode(e)}).`);return}}
  }
}
async function handOver(id){ // manager: make another coach the manager (they can then remove coaches and make codes)
  const {F,fs}=FB,m=S.members.find(x=>x.id===id);
  try{await track(F.updateDoc(F.doc(fs,'teams',S.teamId),{createdBy:id}),null,'team');toast(`${m?.name||'That coach'} is now the manager.`)}
  catch(e){toast(`Couldn't change the manager (${errCode(e)}).`)}
}
async function removeCoach(id){
  const {F,fs}=FB,m=S.members.find(x=>x.id===id);
  await track(F.deleteDoc(F.doc(fs,'teams',S.teamId,'members',id))).then(()=>toast(`${m?.name||'That coach'} has been removed from the team.`)).catch(e=>toast(`Couldn't remove (${errCode(e)}).`));
}
function requestsBanner(){
  if(!S.requests.length)return'';
  const how=r=>r.via==='google'?`Signed in with Google${r.email?' as <b>'+esc(r.email)+'</b>':''}`:r.via==='email'?`Signed in with email${r.email?' as <b>'+esc(r.email)+'</b>':''}`:'No account: just a name typed on their phone';
  const when=at=>{const m=Math.round((Date.now()-(at||0))/60000);return !at?'':m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} hr ago`:nice(new Date(at).toISOString().slice(0,10))};
  return `<section class="reqs" aria-label="Join requests"><p class="note">Anyone with the invite code can ask; the code alone doesn't let them in. Only accept people you know: they'll see and change the squad (children's names) and games.</p>
    ${S.requests.map(r=>{const busy=reqBusy[r.id];return `<div class="req" role="alert">
    <span><b>${esc(r.name||'Someone')}</b> wants to join the team${when(r.at)?` <span class="note">· asked ${esc(when(r.at))}</span>`:''}</span>
    <span class="note">${how(r)}</span>
    <span class="cbtns"><button class="btn go small" data-act="reqok" data-id="${esc(r.id)}" ${busy?'disabled':''}>${busy==='accept'?'Accepting…':'Accept'}</button>
    <button class="btn small" data-act="reqno" data-id="${esc(r.id)}" ${busy?'disabled':''}>${busy==='decline'?'Declining…':'Decline'}</button></span></div>`}).join('')}</section>`;
}

// Other Match Day windows on this phone: when one leaves a team or signs out, the others let go of
// the phone's copy (so it can be cleared) and say why.
const chan=('BroadcastChannel' in self)?new BroadcastChannel('matchday'):null;
if(chan)chan.onmessage=e=>{if(e.data?.type!=='wipe'||!FB)return;
  leaving=true;try{FB.F.terminate(FB.fs)}catch(_){}
  S.closed=e.data.why||'This phone left a team or signed out in another Match Day window.';render()};
async function wipeLocalData(){ // shared phones: nothing from the team stays on the device. Returns 'cleared' or 'later'.
  const {F,fs}=FB;let done=false;
  chan?.postMessage({type:'wipe',why:'You left a team or signed out in another Match Day window, so this window has closed its copy of the team.'});
  try{await F.terminate(fs)}catch(_){}
  for(let i=0;i<3&&!done;i++){ // other windows need a moment to let go
    try{await F.clearIndexedDbPersistence(fs);done=true}catch(_){await new Promise(r=>setTimeout(r,700))}
  }
  if(!done)lsSet('matchday-wipe','1'); // finish the job when the app next starts
  ['matchday-name','matchday-seen','matchday-google'].forEach(k=>lsSet(k,null));
  Object.keys(localStorage).filter(k=>k.startsWith('matchday-undo-')).forEach(k=>lsSet(k,null));
  return done?'cleared':'later';
}
async function uploadedFirst(force){ // don't throw away changes that haven't reached the server yet
  const ok=await within(FB.F.waitForPendingWrites(FB.fs).then(()=>true).catch(()=>false),sync.pending?5000:1500);
  if(ok||force)return true;
  toast(`${sync.pending||'Some'} change${sync.pending===1?" hasn't":"s haven't"} uploaded yet, so nothing was changed. Get a signal and wait for "All saved", then try again.`);
  return false;
}
// What happened when leaving or signing out, shown when the app reopens.
const settle=(p,ms)=>within(p.then(()=>'ok',e=>e?.code==='not-found'?'ok':errCode(e)),ms).then(x=>x??'no signal');
const leaveTodo=()=>{try{return JSON.parse(lsGet('matchday-leave-todo')||'[]')}catch(_){return[]}};
async function finishLeaves(){ // removing this phone from a team's coach list, if that couldn't finish before
  const {F,fs,auth}=FB,l=leaveTodo(),uid=auth.currentUser?.uid;if(!l.length||!uid||!navigator.onLine)return;
  const left=[];
  for(const t of l){const r=await settle(F.deleteDoc(F.doc(fs,'teams',t,'members',uid)),5000);
    const r2=await settle(F.updateDoc(F.doc(fs,'users',uid),{['teams.'+t]:F.deleteField()}),3000);
    if((r!=='ok'&&r!=='permission-denied')||r2!=='ok')left.push(t)}
  lsSet('matchday-leave-todo',left.length?JSON.stringify(left):null);
  const rep=getReport();if(rep&&rep.member&&rep.member!=='ok'&&!left.length){rep.member='ok';rep.later=true;lsSet('matchday-report',JSON.stringify(rep));render()}
}
const getReport=()=>{try{return JSON.parse(lsGet('matchday-report')||'null')}catch(_){return null}};
function reportCard(){
  const r=getReport();if(!r)return'';
  const ok=(good,text)=>`<li class="${good?'ok':'no'}">${good?'✓':'✗'} ${text}</li>`;
  return `<div class="card report" role="status"><h3>${r.kind==='signout'?`Signed out${r.email?' of '+esc(r.email):''}`:`You left ${esc(r.team||'the team')}`}</h3><ul class="checks">
    ${r.kind==='leave'?ok(r.member==='ok',r.member==='ok'?`Removed from the team's coach list${r.later?' (finished once there was signal)':''}.`
      :`Not yet removed from the team's coach list (${esc(r.member)}). The app tries again whenever it opens with a signal; or ask the manager to remove you.`):''}
    ${r.kind==='signout'?ok(true,'Signed out on this phone. Your teams stay saved to your account.'):''}
    ${ok(r.cache==='cleared',r.cache==='cleared'?"This phone's copy of the team data was deleted.":"This phone's copy couldn't be deleted yet because another Match Day window was open. Close every Match Day window: it's deleted when the app next opens.")}
    ${r.pending?ok(false,`${r.pending} change${r.pending>1?'s':''} that hadn't uploaded were left behind.`):''}
  </ul><button class="btn small" data-act="reportok" style="align-self:flex-start">OK</button></div>`;
}
let leaving=false,removedCheck=false;
async function leaveTeam(remote=true,force=false){
  const {F,fs,auth}=FB,t=S.teamId,uid=auth.currentUser?.uid;
  if(!remote){ // a coach removed this phone: keep a note of the team and its code, so it can ask to rejoin
    const left=await F.getDocFromServer(F.doc(fs,'teams',t,'members',uid)).then(m=>!m.exists()).catch(e=>e?.code==='permission-denied');
    if(!left){removedCheck=false;setSync('bad','Not connected to the team');toast("Couldn't load the team just now. Nothing was removed from this phone; reload to try again.");return} // a glitch, not a removal: keep everything
    setSync(false,'Not a member');toast("This phone isn't a member of that team any more.");
    if(S.invite)addPending(t,S.invite,{status:'removed',name:S.cfg.team||''});
    // off this sign-in's saved team list too, or the team would come back (and be refused) at every start
    await settle(F.updateDoc(F.doc(fs,'users',uid),{['teams.'+t]:F.deleteField()}),4000);
    await new Promise(r=>setTimeout(r,1500));
  }
  if(remote&&!(await uploadedFirst(force))){S.confirm='leave-force';render();return}
  const rep={kind:'leave',team:S.cfg.team||'the team',at:Date.now(),pending:force?sync.pending:0};
  if(remote){leaving=true;setSync('wait','Leaving…');
    rep.member=t?await settle(F.deleteDoc(F.doc(fs,'teams',t,'members',uid)),6000):'ok';
    const listed=t?await settle(F.updateDoc(F.doc(fs,'users',uid),{['teams.'+t]:F.deleteField()}),3000):'ok';
    // not confirmed (no signal): finish at the next start with signal, and keep the team out of the list meanwhile
    if((rep.member!=='ok'||listed!=='ok')&&t)lsSet('matchday-leave-todo',JSON.stringify([...new Set([...leaveTodo(),t])]));
  }
  const rest=myTeams().filter(x=>x!==t);saveTeams(rest);lsSet(TEAM_KEY,rest[0]||null);
  if(remote){rep.cache=await wipeLocalData();lsSet('matchday-report',JSON.stringify(rep))} // other teams download again next time there's signal
  location.reload();
}
/* accounts: optional email + password, so a coach's teams follow them to a new phone.
   Creating an account upgrades this phone's sign-in in place, so team access carries over. */
const isAccount=()=>!!FB?.auth?.currentUser?.email;
const within=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function loadAccountTeams(){
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u)return;
  const s=await within(F.getDoc(F.doc(fs,'users',u.uid)).catch(()=>null),3000);
  const gone=leaveTodo(),theirs=Object.keys(s?.data?.()?.teams||{}).filter(t=>!gone.includes(t)); // teams being left stay left
  if(theirs.length)saveTeams([...myTeams(),...theirs]);
}
function syncTeamList(){
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u)return;
  F.setDoc(F.doc(fs,'users',u.uid),{teams:Object.fromEntries(myTeams().map(t=>[t,true]))},{merge:true}).catch(()=>{});
}
function authMsg(e){
  const c=String(e?.code||'').replace('auth/','');
  return({'email-already-in-use':'There\'s already an account for that email. Tap "I have an account" to sign in.',
    'credential-already-in-use':'There\'s already an account for that email. Tap "I have an account" to sign in.',
    'invalid-credential':"That email and password don't match.",'wrong-password':"That email and password don't match.",'user-not-found':"That email and password don't match.",
    'invalid-email':"That doesn't look like an email address.",'missing-email':'Type your email address first.',
    'weak-password':'Use a password of at least 6 characters.','missing-password':'Type a password.',
    'too-many-requests':'Too many tries. Wait a few minutes and try again.',
    'network-request-failed':'You need a signal for this.',
    'operation-not-allowed':"That sign-in method isn't switched on for this app yet.",
    'unauthorized-domain':"Google sign-in isn't set up for this web address yet.",
    'redirect-cancelled-by-user':'Google sign-in was cancelled.','user-cancelled':'Google sign-in was cancelled.',
    'web-storage-unsupported':"This browser is blocking sign-in. Open the app in Safari or Chrome itself."})[c]||`That didn't work (${c||errCode(e)}).`;
}
const acctVals=()=>({email:(document.getElementById('acctemail')?.value||'').trim(),pw:document.getElementById('acctpw')?.value||''});
async function createAccount(){
  const {A,auth}=FB,{email,pw}=acctVals();
  try{await signedIn();await A.linkWithCredential(auth.currentUser,A.EmailAuthProvider.credential(email,pw));
    syncTeamList();myTeams().forEach(t=>touchMember(t,true));S.acct=null;toast(S.teamId?'Account created. Sign in with it on any phone to get your teams back.':'Account created. Now create or join a team: it will be saved to your account.');render()}
  catch(e){toast(authMsg(e))}
}
async function signInAccount(){
  const {A}=FB,{email,pw}=acctVals();
  if(!email||!pw){toast('Type your email and password.');return}
  await moveTeamsTo(a=>A.signInWithEmailAndPassword(a,email,pw));
}
/* Signing into an account that already exists, on a phone that has teams under its own sign-in.
   The phone's sign-in is the only key to those teams, so it isn't given up until the account is
   safely in each one: the account signs in on the side first and asks to join each team, the
   phone (still a member) accepts it and hands over the manager role if it had it, all in one
   step per team. Only when every team has moved does the phone switch to the account. If any
   team can't be moved, nothing switches and the phone keeps its teams. */
async function moveTeamsTo(signIn){
  const {A,F,AppM,fs,auth,cfg}=FB,old=auth.currentUser;
  if(!navigator.onLine){toast('You need a signal to sign in, so your teams can move to the account.');return}
  if(!(await uploadedFirst()))return;
  setSync('wait','Signing in…');
  // 1. Which teams this phone is in now, with each one's code and manager.
  const mine=[];
  for(const t of myTeams()){
    const s=await within(F.getDocFromServer(F.doc(fs,'teams',t)).catch(e=>e),6000);
    if(s===null){toast("Couldn't reach one of your teams, so nothing changed. Try again with a better signal.");liveLabel();return}
    if(s instanceof Error||!s.exists())continue; // not a member any more: nothing to move
    mine.push({t,code:s.data().code,mgr:s.data().createdBy===old.uid});
  }
  // 2. The account signs in on the side (the phone stays signed in as itself meanwhile).
  const app2=AppM.initializeApp(cfg,'switch'+Date.now()),auth2=A.initializeAuth(app2,{persistence:A.inMemoryPersistence});
  const fs2=F.initializeFirestore(app2,{localCache:F.memoryLocalCache()}),done=async()=>{try{await AppM.deleteApp(app2)}catch(_){}};
  let u2;try{u2=(await signIn(auth2)).user}catch(e){await done();toast(authMsg(e));liveLabel();return}
  if(u2.uid===old.uid){await done();toast('That is already the account on this phone.');liveLabel();return}
  // 3. Move each team: the account asks, the phone accepts (and hands over manager) in one write.
  for(const {t,code,mgr} of mine){
    try{
      const inAlready=await F.getDoc(F.doc(fs2,'teams',t,'members',u2.uid)).then(x=>x.exists()).catch(()=>false);
      const b=F.writeBatch(fs);
      if(!inAlready){
        await askToJoin(F,fs2,u2,t,code);
        b.set(F.doc(fs,'teams',t,'members',u2.uid),{code,joined:F.serverTimestamp(),name:myName(),via:u2.providerData.some(p=>p.providerId==='google.com')?'google':'email',by:myName()});
        b.delete(F.doc(fs,'teams',t,'requests',u2.uid));
      }
      if(mgr)b.update(F.doc(fs,'teams',t),{createdBy:u2.uid});
      b.delete(F.doc(fs,'teams',t,'members',old.uid)); // the phone's own entry: the account replaces it
      const ok=await within(b.commit().then(()=>true),10000);
      if(!ok)throw Object.assign(new Error('timeout'),{code:'no signal'});
    }catch(e){
      await done();liveLabel();
      toast(`Couldn't move ${teamInfo[t]?.name||'one of your teams'} to the account (${errCode(e)}). You're still signed in as before${mine[0].t!==t?'; teams already moved are in both':''}. Try again.`);
      return;
    }
  }
  // 4. Requests this phone was still waiting on are sent again from the account.
  for(const p of getPending().filter(x=>!x.status)){
    await F.deleteDoc(F.doc(fs,'teams',p.t,'requests',old.uid)).catch(()=>{});stopPending(p.t);
    try{await askToJoin(F,fs2,u2,p.t,p.code)}catch(_){markPending(p.t,'unsent')}
  }
  // 5. Every team has moved: the phone switches to the account.
  try{await A.updateCurrentUser(auth,u2)}
  catch(e){await done();toast(`Your teams are on the account, but this phone didn't finish signing in (${errCode(e)}). Sign in again.`);liveLabel();return}
  await done();
  await loadAccountTeams();syncTeamList();myTeams().forEach(t=>touchMember(t,true));
  if(!lsGet(TEAM_KEY))lsSet(TEAM_KEY,myTeams()[0]||null);
  location.reload();
}
async function googleSignIn(){
  const {A,auth}=FB;
  try{
    await signedIn();
    const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    lsSet('matchday-google','1');
    // Upgrading the phone's sign-in keeps its teams. If that Google account is already a Match
    // Day account, finishGoogle() below signs into it and moves the teams across instead.
    await A.linkWithRedirect(auth.currentUser,p);
  }catch(e){lsSet('matchday-google',null);toast(authMsg(e))}
}
async function finishGoogle(){ // runs at start-up after Google sends the coach back
  if(!lsGet('matchday-google'))return false;
  lsSet('matchday-google',null);
  const {A,auth}=FB;
  try{const r=await A.getRedirectResult(auth);if(r){syncTeamList();setTimeout(()=>myTeams().forEach(t=>touchMember(t,true)),1500);toast(`Signed in as ${r.user.email}.`)}return false}
  catch(e){
    const cred=A.GoogleAuthProvider.credentialFromError(e);
    if(cred&&/credential-already-in-use|email-already-in-use/.test(e.code||'')){await moveTeamsTo(a=>A.signInWithCredential(a,cred));return false}
    toast(authMsg(e));return false;
  }
}
async function resetPassword(){
  const {A,auth}=FB,{email}=acctVals();
  if(!email){toast('Type your email address, then tap Forgot password.');return}
  try{await A.sendPasswordResetEmail(auth,email);toast("If there's an account for that email, a reset link is on its way. Check spam too.")}
  catch(e){toast(authMsg(e))}
}
async function signOutAccount(force=false){
  if(!(await uploadedFirst(force))){S.confirm='signout-force';render();return}
  const rep={kind:'signout',email:FB.auth.currentUser?.email||'',at:Date.now(),pending:force?sync.pending:0};
  leaving=true;
  try{await FB.A.signOut(FB.auth)}catch(e){leaving=false;toast(`Couldn't sign out (${errCode(e)}). Nothing was changed.`);return}
  saveTeams([]);lsSet(TEAM_KEY,null);rep.cache=await wipeLocalData();lsSet('matchday-report',JSON.stringify(rep));location.reload();
}
const googleBtn=()=>`<button class="btn gbtn" data-act="google"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>`;
function acctForm(mode){
  return `<form class="acctf" id="acctf" data-mode="${mode}">
    <input id="acctemail" type="email" autocomplete="username" placeholder="Email address" aria-label="Email address">
    <input id="acctpw" type="password" autocomplete="${mode==='create'?'new-password':'current-password'}" placeholder="${mode==='create'?'Choose a password (6+ characters)':'Password'}" aria-label="Password">
    <div class="cbtns"><button class="btn go" type="submit">${mode==='create'?'Create account':'Sign in'}</button>
    ${mode==='signin'?'<button class="btn" type="button" data-act="acctforgot">Forgot password</button>':''}
    <button class="btn" type="button" data-act="acctcancel">Cancel</button></div></form>`;
}
function accountCard(){
  if(!FB)return'';
  const u=FB.auth.currentUser;
  if(isAccount())return `<div class="card"><h3>Your account</h3>
    <p>Signed in as <b>${esc(u.email)}</b>.</p>
    <p class="note">Your teams are saved to this account. On a new phone, open the app and tap <b>Sign in</b> to get them all back.</p>
    ${signoutBtn()}</div>`;
  return `<div class="card"><h3>Keep your teams safe</h3>
    <p class="note">Right now your teams are only on this phone. Sign in with Google or make a free email account, and you can get all your teams back on a new phone. Optional.</p>
    ${S.acct?acctForm(S.acct):`${googleBtn()}<div class="cbtns"><button class="btn" data-act="acctcreate">Create an account with email</button><button class="btn" data-act="acctsignin">Sign in with email</button></div>`}</div>`;
}
const signoutBtn=()=>`<button class="x ${S.confirm&&S.confirm.startsWith('signout')?'sure':''}" data-act="signout">${S.confirm==='signout-force'?`Not uploaded: tap again to sign out anyway and lose ${sync.pending||'some'} change${sync.pending===1?'':'s'}`:S.confirm==='signout'?'Tap again to sign out on this phone':'Sign out on this phone'}</button>`;
const leaveBtn=()=>`<button class="x ${S.confirm&&S.confirm.startsWith('leave')?'sure':''}" data-act="leave">${S.confirm==='leave-force'?`Not uploaded: tap again to leave anyway and lose ${sync.pending||'some'} change${sync.pending===1?'':'s'}`:S.confirm==='leave'?'Tap again to leave this team on this phone':'Leave this team on this phone'}</button>`;
function pendingCard(){
  if(!S.pending.length)return'';
  const sent=p=>new Date(p.at||Date.now()).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  return `<div class="card"><h3>Your requests to join</h3>
    ${S.pending.map(p=>{const c=`<b class="num">${esc(showCode(p.code))}</b>`;
      return `<div class="pend ${p.status||'wait'}">${
      p.status==='declined'?`<span><b>Not accepted.</b> Your request with code ${c} wasn't accepted by the team's coaches. If that's a mistake, talk to them, then ask again.</span>
        <span class="cbtns"><button class="btn small" data-act="reqagain" data-id="${esc(p.t)}">Ask again</button><button class="x" data-act="reqcancel" data-id="${esc(p.t)}">OK</button></span>`
      :p.status==='unsent'?`<span><b>Not sent yet.</b> Your request for the team with code ${c} didn't go through when you signed in.</span>
        <span class="cbtns"><button class="btn small go" data-act="reqagain" data-id="${esc(p.t)}">Send it</button><button class="x" data-act="reqcancel" data-id="${esc(p.t)}">Forget it</button></span>`
      :p.status==='removed'?`<span><b>No longer in ${esc(p.name||'a team')}.</b> A coach removed this phone from the team (code ${c}).</span>
        <span class="cbtns"><button class="btn small" data-act="reqagain" data-id="${esc(p.t)}">Ask to rejoin</button><button class="x" data-act="reqcancel" data-id="${esc(p.t)}">OK</button></span>`
      :`<span><b>Waiting for a coach to accept you.</b> Sent ${esc(sent(p))} with code ${c}. A coach in that team sees your name and accepts or declines; this updates by itself, and you'll see the team as soon as you're in.</span>
        <button class="x" data-act="reqcancel" data-id="${esc(p.t)}">Cancel request</button>`}</div>`}).join('')}</div>`;
}
function gateView(){
  return `<div class="sec" style="gap:14px">
  ${reportCard()}
  ${pendingCard()}
  ${S.adding?`<button class="back" data-act="gateback">← My teams</button><h2>Add a team</h2>`:''}
  <div class="card"><h3>Start a new team</h3>
    <p class="note">You'll get an invite code to give the other coaches.</p>
    <button class="btn go" data-act="mkteam">Create a team</button></div>
  <div class="card"><h3>Join a team</h3>
    <p class="note">Ask a coach for the team's invite code (in their ☰ menu). The code sends a request: a coach in the team then accepts you.${FB?.auth?.currentUser?.email?' They also see the email you signed in with, so they know it\'s you.':''}</p>
    <label style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Your name (the coaches see this)</span><input id="joinname" value="${esc(myName())}" placeholder="e.g. Sam (coach)" maxlength="40" autocomplete="name"></label>
    <form class="addf" id="joinf"><input id="joincode" value="${esc(S.joinCode||'')}" placeholder="e.g. ABCD-2345" autocomplete="off" autocapitalize="characters" aria-label="Invite code"><button class="btn go" type="submit" ${joining?'disabled':''}>${joining?'Sending…':'Ask to join'}</button></form></div>
  ${FB&&!isAccount()?`<div class="card"><h3>Your account</h3>
    <p class="note">Optional. Sign in with Google or a free email account and your teams are saved to you, so you can get them all back on a new phone.</p>
    ${S.acct?acctForm(S.acct):`${googleBtn()}<div class="cbtns"><button class="btn" data-act="acctsignin">Sign in with email</button><button class="btn" data-act="acctcreate">Create an account</button></div>`}</div>`:''}
  <p class="note num" style="text-align:center">Match Day v${APP_VERSION}</p>
  </div>`;
}
function teamsView(){
  const l=myTeams();
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="teamsclose">← Back</button>
  <h2>My teams</h2>
  <div class="rows">${l.map(t=>{const i=teamInfo[t]||{},cur=t===S.teamId,name=cur?S.cfg.team:i.name;
    return `<button class="row teamrow ${cur?'cur':''}" data-act="switch" data-id="${esc(t)}">
      <span class="who">${esc(name||'Loading…')}</span>
      ${i.running&&i.running.length?`<span class="flag run">Game ${i.running.join(', ')} running</span>`:''}
      ${i.gone?'<span class="flag">No longer a member</span>':''}
      <span class="note">${cur?'Open now':'Switch'}</span></button>`}).join('')}</div>
  <button class="btn go" data-act="addteam">+ Add a team</button>
  <p class="note">Each team has its own squad, games, season and invite code. To leave a team, open it and use the ☰ menu.</p>
  </div>`;
}
/* ---------- members: who's in each team ---------- */
const myName=()=>(lsGet('matchday-name')||FB?.auth?.currentUser?.displayName||'').slice(0,40);
function signInVia(){const u=FB?.auth?.currentUser;if(!u)return'phone';return u.providerData.some(p=>p.providerId==='google.com')?'google':u.email?'email':'phone'}
function touchMember(t,force){ // keep my entry in this team's member list up to date (at most every few hours)
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u||!t)return;
  let seen={};try{seen=JSON.parse(lsGet('matchday-seen')||'{}')}catch(_){}
  if(!force&&seen[t]&&Date.now()-seen[t]<6*3600e3)return;
  F.setDoc(F.doc(fs,'teams',t,'members',u.uid),{name:myName(),via:signInVia(),seen:F.serverTimestamp()},{merge:true})
    .then(()=>{seen[t]=Date.now();lsSet('matchday-seen',JSON.stringify(seen))}).catch(()=>{});
}
function checkOwner(){
  const {F,fs,auth}=FB;if(!auth.currentUser?.email){S.owner=false;return}
  F.getDocs(F.query(F.collection(fs,'teams'),F.limit(1))).then(()=>{S.owner=true;if(S.menu)render()}).catch(()=>{S.owner=false});
}
async function loadAdmin(){
  const {F,fs}=FB;S.admin={loading:true,teams:[]};render();
  try{
    const ts=await F.getDocs(F.collection(fs,'teams'));
    const rows=await Promise.all(ts.docs.map(async d=>{
      const [st,ms]=await Promise.all([F.getDoc(F.doc(fs,'teams',d.id,'club','settings')).catch(()=>null),F.getDocs(F.collection(fs,'teams',d.id,'members')).catch(()=>null)]);
      const cfg=st?.data?.()||{},mem=ms?ms.docs.map(m=>m.data()):[];
      const seen=Math.max(0,...mem.map(m=>m.seen?.toMillis?.()||m.joined?.toMillis?.()||0));
      return{id:d.id,name:cfg.team||'',sport:cfg.sport||'football',created:d.data().created?.toMillis?.()||0,coaches:mem.length,seen};
    }));
    S.admin={loading:false,teams:rows.sort((a,b)=>b.seen-a.seen)};
  }catch(e){S.admin={loading:false,error:errCode(e),teams:[]}}
  render();
}
function adminView(){
  const A=S.admin||{teams:[]},T=A.teams,day=864e5,now=Date.now();
  const week=T.filter(t=>now-t.seen<7*day).length,rug=T.filter(t=>t.sport==='rugby').length;
  const when=ms=>ms?nice(new Date(ms).toISOString().slice(0,10)):'–';
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="adminclose">← Back</button>
  <h2>Admin</h2>
  <p class="note">Only you can see this. Team names and activity only, never squads, games or notes.</p>
  ${A.loading?'<p class="note">Loading…</p>':A.error?`<p class="note">Couldn't load (${esc(A.error)}).</p>`:`
  <div class="summary num"><span>Teams <b>${T.length}</b></span><span>Active this week <b>${week}</b></span><span>Football <b>${T.length-rug}</b> · Rugby <b>${rug}</b></span></div>
  <div class="rows">${T.map(t=>`<div class="row adm"><div class="who">${esc(t.name||'(not set up yet)')}<span class="tag">${t.sport==='rugby'?'Rugby':'Football'}</span></div>
    <div class="note">${t.coaches} coach${t.coaches===1?'':'es'} · last active ${esc(when(t.seen))} · created ${esc(when(t.created))}</div>
    <div class="note num admid">${esc(t.id)}</div></div>`).join('')}</div>
  <button class="btn small" data-act="adminload" style="align-self:flex-start">Refresh</button>`}
  </div>`;
}
function watchMembers(t){
  const {F,fs}=FB;
  let known=null;
  F.onSnapshot(F.collection(fs,'teams',t,'members'),s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));
    const me=FB.auth.currentUser?.uid,ids=new Set(S.members.map(m=>m.id));
    if(known)S.members.filter(m=>!known.has(m.id)&&m.id!==me).forEach(m=>toast(`${m.name||'A new coach'} joined the team.`));
    known=ids;if(S.menu)render()},()=>{});
}
function ago(ts){
  const ms=ts?.toMillis?.();if(!ms)return'';const d=Math.floor((Date.now()-ms)/864e5);
  return d<=0?'active today':d===1?'active yesterday':d<7?`active ${d} days ago`:d<60?`active ${Math.round(d/7)} week${Math.round(d/7)>1?'s':''} ago`:'not active lately';
}
function membersList(){
  const me=FB.auth.currentUser?.uid,via={google:'Google',email:'Email',phone:'No account'};
  const l=[...S.members].sort((a,b)=>(b.id===S.createdBy)-(a.id===S.createdBy)||(b.id===me)-(a.id===me)||(a.name||'~').localeCompare(b.name||'~'));
  return `<div class="rows">${l.map(m=>`<div class="row member"><span class="who">${esc(m.name||(m.via==='phone'||!m.via?'Coach (no account)':'Coach'))}
      ${m.id===S.createdBy?'<span class="tag mgr">Manager</span>':''}${m.id===me?'<span class="tag">you</span>':''}</span>
    <span class="note">${via[m.via]||'No account'}${ago(m.seen)?' · '+ago(m.seen):''}</span>
    ${S.createdBy===me&&m.id!==me?`<span class="cbtns"><button class="x ${S.confirm==='mg-'+m.id?'sure':''}" data-act="mkmgr" data-id="${esc(m.id)}">${S.confirm==='mg-'+m.id?'Tap to make manager':'Make manager'}</button><button class="x ${S.confirm==='rm-'+m.id?'sure':''}" data-act="rmcoach" data-id="${esc(m.id)}">${S.confirm==='rm-'+m.id?'Tap to remove':'Remove'}</button></span>`:''}</div>`).join('')||'<p class="note">Loading…</p>'}</div>`;
}
function menuView(){
  const u=FB.auth.currentUser;
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="menuclose">← Back</button>
  <div class="card"><h3>You</h3>
    <label style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Your name (other coaches see this)</span>
      <input id="myname" value="${esc(myName())}" placeholder="e.g. Sam (coach)" maxlength="40" autocomplete="name"></label>
    ${isAccount()?`<p class="note">Signed in with ${signInVia()==='google'?'Google':'email'} as <b>${esc(u.email)}</b>. Only you see your email.</p>
      ${signoutBtn()}`
    :`<p class="note">Not signed in: your teams are only on this phone. Sign in to get them back on a new phone.</p>
      ${S.acct?acctForm(S.acct):`${googleBtn()}<div class="cbtns"><button class="btn" data-act="acctcreate">Create an account with email</button><button class="btn" data-act="acctsignin">Sign in with email</button></div>`}`}
  </div>
  <div class="card"><h3>My teams</h3>
    <div class="rows">${myTeams().map(t=>{const i=teamInfo[t]||{},cur=t===S.teamId;
      return `<button class="row teamrow ${cur?'cur':''}" data-act="switch" data-id="${esc(t)}"><span class="who">${esc((cur?S.cfg.team:i.name)||'Loading…')}</span>
        ${i.running&&i.running.length?`<span class="flag run">Game ${i.running.join(', ')} running</span>`:''}<span class="note">${cur?'Open now':'Switch'}</span></button>`}).join('')}</div>
    <button class="btn" data-act="addteam">+ Add a team</button></div>
  ${pendingCard()}
  <div class="card"><h3>${esc(S.cfg.team||'This team')}</h3>
    <p>Invite code: <b class="num" style="font-family:var(--display);font-size:26px;letter-spacing:.06em">${esc(showCode(S.invite))||'…'}</b></p>
    <p class="note">Other coaches open the app, tap <b>Join a team</b> and enter this code. The code only sends a request: someone in the team has to accept each person.</p>
    ${S.createdBy===FB.auth.currentUser?.uid?`<button class="x ${S.confirm==='newcode'?'sure':''}" data-act="newcode" style="align-self:flex-start">${S.confirm==='newcode'?'Tap again: the old code stops working at once':'Make a new invite code'}</button>
      <p class="note">${S.invite&&S.invite.length<8?'Your code is the older, shorter kind: a new one is 8 characters and much harder to guess. ':''}Use this if the code has been shared too widely. Coaches already in the team stay in.</p>`:''}
    ${requestsBanner()}
    <span class="lbl">Team members</span>
    ${membersList()}
    ${leaveBtn()}</div>
  ${backupCard()}
  ${S.owner?'<button class="btn" data-act="admin">Admin: all teams</button>':''}
  <p class="note num" style="text-align:center">Match Day v${APP_VERSION}</p>
  </div>`;
}
function teamCard(){
  if(!FB||!S.teamId)return'';
  return `<div class="card"><h3>Invite other coaches</h3>
    <p>Invite code: <b class="num" style="font-family:var(--display);font-size:26px;letter-spacing:.06em">${esc(showCode(S.invite))||'…'}</b></p>
    <p class="note">Other coaches open the app, tap <b>Join a team</b> and enter this code. That sends a request, and someone in the team accepts it in the ☰ menu: the code alone doesn't let anyone in. Everyone accepted can see and change this team's squad and games.</p>
    ${leaveBtn()}</div>`;
}

render();
(async()=>{
  try{
    if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
    if(!await connectFirebase())setSync(false,'Not syncing');
  }catch(e){setSync(false,'Not syncing')}
})();
</script>
