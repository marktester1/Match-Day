<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Day</title>
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=whistle">
<link rel="icon" href="icons/icon-192.png?v=whistle">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=whistle">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match Day">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-column touchline app — tournament header, tab bar, then a grass "pitch" panel as the one bold element */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#16211a; --muted:#5b6a60; --line:#d7dfd6;
  --grass:#1e6a3a; --grass-2:#25784318; --grass-deep:#175a30; --chalk:#ffffff;
  --live:#b06a10; --live-bg:#fbefdc; --bad:#b3261e; --good:#1e6a3a; --gk:#7a3fb0; --gk-bg:#f0e6fa; --gold:#c8961a; --gold-ink:#241a02;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.top{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-size:28px;line-height:1}
.brand h1 span{color:var(--grass)}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--good);border-color:currentColor}
.sync.wait{color:var(--live);border-color:currentColor}
.sync.bad{color:var(--bad);border-color:currentColor}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:8px}
@media(max-width:420px){.trow{grid-template-columns:minmax(0,1fr) minmax(0,130px)}}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:4px 0 6px}
.sections{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.sections button{border:0;background:none;padding:8px 4px 10px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.sections button.on{color:var(--ink);border-bottom-color:var(--grass)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
body.sec-season .trow,body.ingame .trow{display:none}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:7px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:400px){.tabs button{font-size:15px}}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.pc.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star{color:var(--gold);font-weight:700}
.award{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-top:1px solid var(--line)}
.award:first-child{border-top:0}
.award .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.award .hd span{font-size:13px;color:var(--muted)}
.award ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.award li{font-size:15px}
.award li i{color:var(--muted);font-style:normal}
.cnts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:14px}
.cnt b{font-family:var(--display);font-size:17px}
.cnt.zero{border-style:dashed;color:var(--muted)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tcard>button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.tcard .tn{font-weight:700}
.tcard .ts{font-size:13px;color:var(--muted)}
.tcard .tb{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tcard .gl{display:flex;justify-content:space-between;gap:10px}
.danger{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.tabs button.on{background:var(--grass);color:var(--chalk)}

.summary{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}
.glist{display:flex;flex-direction:column;gap:8px}
.gcard{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.gcard .gn{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;color:var(--muted)}
.gcard .gn small{display:block;font-size:12px;letter-spacing:.08em;font-weight:600}
.gcard .opp{font-weight:700;overflow-wrap:anywhere}
.gcard .sub{font-size:13px;color:var(--muted)}
.gcard .res{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gcard .scr{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live-bg);color:var(--live)}
.pill.ft{background:var(--grass-2);color:var(--good)}
.lenrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lenrow input{width:72px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:22px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pv{display:grid;grid-template-columns:52px 1fr;gap:2px 10px}
.pv b{font-family:var(--display);font-size:18px}
.pv .sm{color:var(--muted)}

.back{border:0;background:none;color:var(--grass);font-weight:700;padding:4px 0;align-self:flex-start}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead h2{font-size:30px}
.meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.meta.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* iPhone Safari gives date boxes a fixed minimum width, which pushed them over their neighbours and widened the page */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.meta label{display:flex;flex-direction:column;gap:4px;min-width:0}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.side .nm{font-weight:700;font-size:14px;text-align:center;overflow-wrap:anywhere}
.sc{display:flex;align-items:center;gap:8px}
.sc b{font-family:var(--display);font-size:46px;line-height:1;min-width:1.2ch;text-align:center}
.sc button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.sc button.plus{background:var(--grass);color:var(--chalk);border-color:var(--grass)}
.clock{text-align:center;padding-inline:4px}
.clock .t{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.clock small{display:block;color:var(--muted);font-size:12px}
.lenbtn{display:block;margin:2px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline dotted;padding:4px 6px}
.fix{display:flex;flex-direction:column;gap:10px}
.fix h3{margin:6px 0 0}
.fix .lenrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fix .lenrow input{width:80px}
.subadd{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px}
.subadd label{display:flex;flex-direction:column;gap:4px;min-width:0}
.subadd select,.subadd input{width:100%;min-width:0}
.subt{width:72px;flex:0 0 auto}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:700;flex:1;text-align:center}
.btn.go{background:var(--grass);border-color:var(--grass);color:var(--chalk)}
.btn.warn{color:var(--bad)}
.btn.small{flex:0 0 auto;padding:7px 11px;font-size:14px}

.pitch{position:relative;background:
  linear-gradient(90deg,transparent calc(50% - 1px),#ffffff55 calc(50% - 1px),#ffffff55 calc(50% + 1px),transparent calc(50% + 1px)),
  repeating-linear-gradient(90deg,var(--grass) 0 12.5%,var(--grass-deep) 12.5% 25%);
  border:2px solid #ffffff66;border-radius:14px;padding:30px 12px 16px;min-height:150px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .lbl{position:absolute;top:8px;left:12px;color:#ffffffcc}
.pitch .cnt{position:absolute;top:8px;right:12px;color:#ffffffcc;font-size:12px;font-weight:700}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;padding:8px 12px;border-radius:10px;border:2px solid transparent;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002;touch-action:none;user-select:none;-webkit-user-select:none}
.chip .n{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .m{font-size:12px;color:var(--muted)}
.chip .gkb{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--gk);color:var(--surface);padding:1px 5px;border-radius:5px}
.chip.keeper{background:var(--gk-bg)}
.chip.sel{border-color:var(--live);background:var(--live-bg)}
.chip.target{border-style:dashed;border-color:var(--grass)}
.chip.over{border-style:solid;border-color:var(--live);transform:scale(1.06)}
.chip.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;box-shadow:0 8px 24px #0004;transform-origin:center}
.benchbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.benchbox .chips{justify-content:flex-start}
.benchbox .chip{background:var(--bg);box-shadow:none}
.hint{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--live-bg);color:var(--ink)}
.hint.quiet{background:var(--grass-2)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:20px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.meta.one{grid-template-columns:minmax(0,1fr);gap:12px}
.seg.fill{width:100%}
.seg.fill button{flex:1 1 0;min-width:0;padding-inline:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button{border:0;background:var(--surface);padding:7px 9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--grass);color:var(--chalk)}
.seg button.on.b{background:var(--live-bg);color:var(--live)}
.seg button.on.k{background:var(--gk);color:var(--surface)}
.log .row{font-size:14px}
.log .at{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);min-width:46px}
.log .txt{flex:1;min-width:0}
.off{color:var(--bad)} .onn{color:var(--good)}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{font-weight:700;overflow-wrap:anywhere}
.mrow .tot{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;text-align:right}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);border-radius:4px}
.mrow.low .bar i{background:var(--live)}
.mrow .brk{grid-column:1/-1;font-size:12px;color:var(--muted)}
.flag{font-size:11px;font-weight:700;color:var(--live);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}

.addf{display:flex;gap:8px}
.addf .btn{flex:0 0 auto}
.teamsw{cursor:pointer;white-space:nowrap}
.hright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.menubtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.member .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.member{flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 5px}
.tag.mgr{color:var(--gold);border-color:currentColor}
body.beta .brand h1::after{content:"BETA";font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--live-bg);background:var(--live);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.acctf{display:flex;flex-direction:column;gap:8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.teamsw::after{content:" ▾";font-size:.6em;color:var(--muted)}
.teamsw.others::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
.teamrow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teamrow .who{flex:1 1 auto}
.teamrow.cur .who{color:var(--grass)}
.flag.run{color:var(--live)}
.hav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.hav label,.hav .fixed{display:flex;flex-direction:column;gap:4px;min-width:0}
.swapbtn{width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--grass);display:grid;place-items:center;padding:0}
.swapbtn:active{transform:rotate(180deg)}
@media (prefers-reduced-motion:no-preference){.swapbtn{transition:transform .2s}}
.adm{flex-direction:column;align-items:stretch;gap:2px}
.adm .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.admid{font-size:11px;opacity:.7}
.errs{margin:0;padding-left:18px;font-size:14px;color:var(--bad);display:flex;flex-direction:column;gap:4px}
.errs.ok{color:var(--ink)}
.reqs{display:flex;flex-direction:column;gap:8px}
.req{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:2px solid var(--live);background:var(--live-bg)}
.menubtn.dot{position:relative}
.menubtn.dot::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--live);border:2px solid var(--surface)}
.qps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left}
.qp b{font-size:18px}
.qp .num{font-size:13px;color:var(--muted)}
.modal .box{max-height:calc(100vh - 32px);overflow:auto}
.undobar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600}
.undobar button{border:0;background:none;color:var(--grass);font-weight:800;font-size:15px;padding:4px 8px;flex:0 0 auto}
.ftscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;font-weight:700}
.ftscore b{font-family:var(--display);font-size:34px}
.setupcard{display:flex;flex-direction:column;gap:10px}
.setupline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);padding:10px 12px;font-size:13px}
.setupline b{color:var(--grass);flex:0 0 auto}
.evl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:64px}
.rk{font-family:var(--display);font-size:18px;color:var(--muted);min-width:22px}
.tedit{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.tg{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chk input{width:auto}
.scl{display:flex;flex-direction:column;gap:4px}
.note-item{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.note-item:first-child{border-top:0}
.note-item .nt{white-space:pre-wrap;overflow-wrap:anywhere}
.note-item .nm2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-item.done .nt{color:var(--muted);text-decoration:line-through}
.note-done-who{padding:8px 12px 0}
.gstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gstrip::-webkit-scrollbar{display:none}
.gs{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);position:relative}
.gs b{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
.gs small{font-size:11px}
.gs.done{opacity:.7}
.gs.on{background:var(--grass);border-color:var(--grass);color:var(--chalk);opacity:1}
.gs.on b{color:var(--chalk)}

<script>
const APP_VERSION='0.22.0';
/*CFG*/const DEFAULT_CFG={team:'Example Team U10s',short:'Example Team',size:5};/*END*/
const S={cfg:{...DEFAULT_CFG},cfgLoaded:false,fx:false,squad:[],tour:{name:'',date:'',len:10,count:6},games:{},tab:'games',game:null,pick:null,confirm:null,readOnly:false,addLate:false,
  gate:false,teamId:null,invite:'',restore:null,fix:null,scorer:null,askGk:null,menu:false,members:[],createdBy:null,askSize:null,undo:null,askFt:null,requests:[],pending:[],qp:null,notes:[],noteFor:'',showDone:false,saved:null,editT:null,draft:null,rpick:null,setupOpen:false,owner:false,admin:null,adminOpen:false,teams:false,adding:false,acct:null,
  bill:null,billLoaded:false,teamCreated:0,unlockOpen:false,feed:null,pfeed:undefined,pgames:[],pbanner:null,awards:[],archive:[],aw:{date:'',type:'Training',label:'',picks:{}},openT:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nice=d=>{if(!d)return'';const t=new Date(d+'T12:00');return isNaN(t)?d:t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
let db=null,pending=false,suppressClick=false;
const queues={};
const gids=()=>Array.from({length:Math.min(10,Math.max(1,S.tour.count||6))},(_,i)=>'g'+(i+1));

function withUndo(id,label){ // call just before changing a game
  S.undo={g:id,label,prev:structuredClone(G(id)),at:Date.now()};
  setTimeout(()=>{if(S.undo&&Date.now()-S.undo.at>=10000){S.undo=null;render()}},10050);
}
const undoLive=id=>S.undo&&S.undo.g===id&&Date.now()-S.undo.at<10000;
function blank(n){return{n,opponent:'',team:'',time:'',pitch:'',gk:null,starters:[],bench:[],subs:[],gkChanges:[],goals:[],clock:{running:false,startedAt:0,acc:0},score:{us:0,them:0},done:false}}
function G(id){const g=S.games[id];const b=blank(+id.slice(1));return g?{...b,...g,clock:{...b.clock,...g.clock},score:{...b.score,...g.score}}:b}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nameOf(id){const p=S.squad.find(p=>p.id===id);if(p)return p.name;for(const t of S.archive){const q=(t.players||[]).find(p=>p.id===id);if(q)return q.name}return'Removed player'}
const el=g=>g.clock.acc+(g.clock.running?Math.max(0,Date.now()-g.clock.startedAt):0);
const started=g=>g.clock.running||g.clock.acc>0;
const nPer=()=>[1,2,4].includes(+S.tour.periods)?+S.tour.periods:1;
const perLen=()=>(S.tour.len||10)*60000/nPer();
const perOf=ms=>Math.min(nPer()-1,Math.floor(ms/perLen()+1e-9));
const perName=i=>nPer()===2?['1st half','2nd half'][i]:nPer()===4?'Q'+(i+1):'';
const perShort=i=>nPer()===2?(i+1)+'H':nPer()===4?'Q'+(i+1):'';
function atBreak(g){ // paused exactly at the end of a half/quarter that isn't the last
  if(nPer()===1||g.clock.running||g.done)return 0;const e=el(g),k=Math.round(e/perLen());
  return k>0&&k<nPer()&&Math.abs(e-k*perLen())<500?k:0;
}
const tAt=ms=>nPer()===1?fmt(ms):perShort(perOf(ms))+' '+fmt(ms-perOf(ms)*perLen()); // e.g. "2H 3:24"
const clockText=g=>{const e=el(g);return nPer()===1?fmt(e):fmt(e-perOf(e)*perLen())};
const clockSub=g=>{if(nPer()===1)return 'of '+fmt((S.tour.len||10)*60000);const b=atBreak(g);
  return b?(nPer()===2?'Half time':'End of Q'+b):perName(perOf(el(g)))+' · of '+fmt(perLen())};
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtM(ms){const m=ms/60000;return m<1&&ms>0?fmt(ms):Math.round(m)+'m'}
const bySubTime=g=>[...g.subs].sort((a,b)=>a.at-b.at);
const SECTIONS={tournament:{label:'Tournament',tabs:[['games','Games'],['minutes','Minutes'],['notes','Notes']]},
  season:{label:'Season',tabs:[['season','Results'],['awards','Awards'],['squad','Squad']]}};
const secOf=t=>SECTIONS.season.tabs.some(([k])=>k===t)?'season':'tournament';
const lastTab={tournament:'games',season:'season'}; // where you were in each section
const tourSize=()=>+S.tour.size||+S.cfg.size||5;   // players a side for this tournament
const gameSize=g=>+g.size||tourSize();                  // ...unless changed for one game
const isAway=g=>g.side==='away';
const usName=()=>S.cfg.short||S.cfg.team||'Us';
const homeName=g=>isAway(g)?(g.opponent||'Home team'):usName(g);
const awayName=g=>isAway(g)?usName(g):(g.opponent||'Away team');
const scoreHA=g=>isAway(g)?g.score.them+'–'+g.score.us:g.score.us+'–'+g.score.them;
const isRugby=()=>S.cfg.sport==='rugby';
const triesOnly=()=>isRugby()&&S.cfg.rscore==='tries';
const RTYPES={try:{n:'Try',p:5},con:{n:'Conversion',p:2},pen:{n:'Penalty',p:3},drop:{n:'Drop goal',p:3}};
const ptsOf=x=>!isRugby()?1:triesOnly()?(x.type==='try'?1:0):(RTYPES[x.type]?.p||0);
const Words=()=>isRugby()?(triesOnly()?{goals:'Tries',goal:'try',Goal:'Try',scorers:'Try scorers'}:{goals:'Points',goal:'score',Goal:'Score',scorers:'Points scorers'}):{goals:'Goals',goal:'goal',Goal:'Goal',scorers:'Goal scorers'};
const evLabel=x=>isRugby()?(RTYPES[x.type]?.n||'Score'):'';
const scorerName=p=>p==='og'?'Own goal':p?nameOf(p):'Scorer not set';
function goalTally(games){const c={};games.forEach(g=>(g.goals||[]).forEach(x=>{if(x.p&&x.p!=='og')c[x.p]=(c[x.p]||0)+ptsOf(x)}));return c}
const alpha=l=>[...l].sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));
const byName=ids=>[...ids].sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'en',{sensitivity:'base'}));

function onPitch(g){const s=new Set(g.starters);for(const e of bySubTime(g)){s.delete(e.off);if(e.on)s.add(e.on)}return s}
function keeper(g){if(isRugby())return null;const ev=[...bySubTime(g).filter(e=>e.gk).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[])].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function inGame(g){return [...new Set([...g.starters,...g.bench,...g.subs.flatMap(e=>[e.off,e.on])])].filter(Boolean)}
function benchNow(g){const p=onPitch(g);return inGame(g).filter(x=>!p.has(x))}
function mins(g){
  const m={},end=el(g);let set=new Set(g.starters),prev=0;
  for(const e of bySubTime(g)){const at=Math.min(e.at,end);for(const p of set)m[p]=(m[p]||0)+Math.max(0,at-prev);set.delete(e.off);if(e.on)set.add(e.on);prev=at}
  for(const p of set)m[p]=(m[p]||0)+Math.max(0,end-prev);
  inGame(g).forEach(p=>{m[p]=m[p]||0});return m;
}

/* ---------- saving ---------- */
function put(path,body){
  if(!db)return;
  if(locked()){lockedToast();return}
  if(/^games\/g\d+$/.test(path))feedGame=path.slice(6);
  if(/^(games\/|club\/(tournament|settings)$)/.test(path))schedulePublish();
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).catch(e=>{
    if(e&&e.code==='invalid_argument'){S.readOnly=true;render();toast("You can view this but not edit it. Ask the owner to invite you by email as an Editor.")}
    else if(e&&e.code==='quota_exceeded')toast("Storage is full, so that change wasn't saved.");
    else toast("Couldn't save that change. Check your connection and try again.");
  });
}
function remove(path){
  if(!db)return;
  if(locked()){lockedToast();return}
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).delete()).catch(()=>toast("Couldn't delete that. Check your connection and try again."));
}
function mut(id,fn){if(locked()){lockedToast();render();return}const g=structuredClone(G(id));fn(g);S.games[id]=g;put('games/'+id,g);render()}
function saveSquad(){S.squad=alpha(S.squad);put('club/squad',{players:S.squad});render()}
function saveTour(){put('club/tournament',S.tour)}

/* ---------- paying for a team: 30-day free trial, then view-only until unlocked (£3.99 once) ---------- */
const PRICE='£3.99',TRIAL_DAYS=30;
let SHOP={}; // from firebase-config.js: the checkout link for this project (test mode on beta)
function buyUnlock(){
  if(!SHOP.checkout){toast("Payments aren't switched on in this version yet.");return}
  if(!navigator.onLine){toast('You need a signal to pay.');return}
  // Lemon Squeezy's own checkout page takes the payment; the team's ID rides along so its
  // confirmation to our server knows which team to unlock. Match Day never sees card details.
  const u=new URL(SHOP.checkout);u.searchParams.set('checkout[custom][team]',S.teamId);
  lsSet('matchday-paying',JSON.stringify({t:S.teamId,at:Date.now()}));
  location.href=u.toString();
}
const paying=()=>{try{const p=JSON.parse(lsGet('matchday-paying')||'null');return p&&p.t===S.teamId&&Date.now()-p.at<30*60000}catch(_){return false}};
const PLAN_FROM=Date.UTC(2026,9,16); // teams made before the paywall started get their 30 days from here (set the real launch date at release)
function plan(){
  if(!FB||!S.teamId||!S.billLoaded)return{state:'unknown'};
  const b=S.bill||{};if(b.unlocked)return{state:'unlocked',source:b.source||'purchase'};
  const end=b.trialEnds||Math.max(S.teamCreated||0,PLAN_FROM)+TRIAL_DAYS*864e5;
  return Date.now()<end?{state:'trial',left:Math.max(1,Math.ceil((end-Date.now())/864e5)),end}:{state:'expired',end};
}
const gameOn=()=>gids().some(id=>{const g=G(id);return started(g)&&!g.done}); // a game under way can always be finished
const locked=()=>plan().state==='expired'&&!gameOn();
let lockT=0;
function lockedToast(){if(Date.now()-lockT<1500)return;lockT=Date.now();toast('This team is view-only until it is unlocked. Tap ☰ → Unlock.')}
function watchBilling(t){
  const {F,fs}=FB;
  F.onSnapshot(F.doc(fs,'teams',t,'billing','state'),s=>{const was=S.bill&&S.bill.unlocked;S.bill=s.exists()?s.data():null;S.billLoaded=true;
    if(S.bill&&S.bill.unlocked&&!was&&S.bill.source==='purchase'&&paying()){lsSet('matchday-paying',null);S.unlockOpen=false;toast(`Thank you! ${S.cfg.team||'Your team'} is unlocked for good.`)}
    render()},()=>{S.billLoaded=true;render()});
}
function planBanner(){
  const p=plan(),t=esc(S.cfg.team||'this team');
  if(p.state==='trial'&&p.left<=7)return `<div class="card plan"><h3>Free trial: ${p.left} day${p.left>1?'s':''} left</h3>
    <p class="note">Unlock ${t} for ${PRICE} (once, not a subscription) to keep using everything after the trial. Nothing is lost either way.</p>
    <button class="btn go" data-act="unlock">Unlock for ${PRICE}</button></div>`;
  if(p.state==='expired')return `<div class="card plan"><h3>The free trial has ended</h3>
    <p class="note">${t} is view-only: you can still see every game, result and award, and save a backup. Nothing has been deleted.${gameOn()?' You can finish the game that is under way.':''}</p>
    <button class="btn go" data-act="unlock">Unlock for ${PRICE}</button></div>`;
  return '';
}
function planCard(){ // in the ☰ menu
  const p=plan();if(p.state==='unknown')return'';
  const src={founding:'Founding club: free for good',voucher:'Unlocked with a voucher',purchase:'Unlocked',test:'Unlocked (test)'};
  return `<div class="card ${p.state==='unlocked'?'plan ok':'plan'}"><h3>${p.state==='unlocked'?esc(src[p.source]||'Unlocked'):p.state==='trial'?`Free trial: ${p.left} day${p.left>1?'s':''} left`:'Free trial ended: view-only'}</h3>
    ${p.state==='unlocked'?`<p class="note">Every coach in this team has everything, for good.</p>`
      :`<p class="note">${p.state==='trial'?`Trial ends ${esc(nice(new Date(p.end).toISOString().slice(0,10)))}. `:''}One payment of ${PRICE} unlocks this team for every coach in it.</p>
        <button class="btn go" data-act="unlock">Unlock for ${PRICE}</button>`}</div>`;
}
function unlockView(){
  const p=plan(),t=esc(S.cfg.team||'this team');
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="unlockclose">← Back</button>
  <h2>Unlock ${t}</h2>
  ${p.state==='unlocked'?`<div class="card plan ok"><h3>${t} is unlocked</h3><p class="note">Nothing more to pay. Thank you!</p></div>`:`
  <div class="card"><span class="price">${PRICE}</span><span class="note">Once, for this team. Not a subscription.</span>
    <ul class="note" style="margin:0;padding-left:18px">
      <li>Line-ups, subs, scores and playing time for every game</li>
      <li>Tournaments, season results, awards and notes</li>
      <li>Every coach in the team, on any phone</li>
      <li>Nothing you've already entered is lost</li></ul>
    <button class="btn go" data-act="unlockbuy">Unlock for ${PRICE}</button>
    <p class="note">By paying you agree to the <a href="terms.html">terms</a>. Refunds within 14 days of paying.</p>
    ${paying()?'<p class="note"><b>Paid already?</b> The unlock arrives within a minute of paying. Keep this screen open.</p>':''}
    <form class="addf" id="vouchf"><input id="vcode" placeholder="Voucher code" autocomplete="off" autocapitalize="characters" aria-label="Voucher code" maxlength="20"><button class="btn" type="submit">Redeem</button></form>
    <p class="note">${p.state==='trial'?`Your free trial has ${p.left} day${p.left>1?'s':''} left.`:p.state==='expired'?'The free trial has ended, so the team is view-only for now.':''}</p></div>
  ${S.owner?`<div class="card"><h3>Owner only</h3><p class="note">Try the unlock without paying. Undo it from Admin → Reset.</p>
    <button class="btn" data-act="unlocktest">Test unlock this team</button></div>`:''}`}
  </div>`;
}
async function setBilling(t,data){ // owner only (the rules refuse anyone else)
  const {F,fs}=FB,ref=F.doc(fs,'teams',t,'billing','state');
  try{await (data?F.setDoc(ref,data):F.deleteDoc(ref));return true}catch(e){toast(`Couldn't change that (${errCode(e)}).`);return false}
}

/* ---------- vouchers: the owner makes codes; a coach redeems one to unlock their team ---------- */
const newVoucherCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>CODE_CHARS[n%CODE_CHARS.length]).join('');
const showVoucher=c=>c.length===10?c.slice(0,5)+'-'+c.slice(5):c;
let redeeming=false;
async function redeemVoucher(raw){
  const {F,fs}=FB,code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<8){toast('Voucher codes are 10 letters and numbers, like ABCDE-23456.');return}
  if(!/^[A-Z2-9]+$/.test(code)){toast("That code has a letter or number vouchers never use (0, 1, I or O). Check it and try again.");return}
  if(!navigator.onLine){toast('You need a signal to redeem a voucher.');return}
  if(redeeming)return;redeeming=true;
  try{
    const b=F.writeBatch(fs); // one write: a use comes off the voucher and the team unlocks, or neither happens
    b.update(F.doc(fs,'vouchers',code),{usesLeft:F.increment(-1),lastTeam:S.teamId});
    b.set(F.doc(fs,'teams',S.teamId,'billing','state'),{unlocked:true,source:'voucher',at:Date.now(),voucher:code});
    await b.commit();
    S.unlockOpen=false;render();toast(`${S.cfg.team||'Your team'} is unlocked. Enjoy the season!`);
  }catch(e){toast(e&&(e.code==='permission-denied'||e.code==='not-found')?"That code isn't valid, has expired or has been used up.":`Couldn't redeem it (${errCode(e)}). Try again.`)}
  finally{redeeming=false}
}
async function makeVoucher(){
  const {F,fs}=FB,uses=Math.min(1000,Math.max(1,parseInt(document.getElementById('vuses').value)||1)),
    days=Math.min(730,Math.max(1,parseInt(document.getElementById('vdays').value)||90)),note=document.getElementById('vnote').value.trim().slice(0,60);
  const code=newVoucherCode();

  const b={team:S.teamId,home:us,away:'',us:'home',score:{us:0,them:0},status:'none',clock:{running:false,startedAt:0,acc:0},
    periods:nPer(),len:Math.min(60,Math.max(1,+S.tour.len||10)),gameN:1,sport:isRugby()?'rugby':'football',

    status:gStatus(g),clock:{running:!!g.clock.running,startedAt:g.clock.startedAt||0,acc:g.clock.acc||0},gameN:g.n};

const feedFixture=id=>{const g=G(id);return{n:g.n,home:homeName(g).slice(0,40),away:awayName(g).slice(0,40),us:isAway(g)?'away':'home',
  time:String(g.time||'').slice(0,10),pitch:String(g.pitch||'').slice(0,10),score:{us:g.score.us,them:g.score.them},status:gStatus(g)}};
function publishFeed(){ // sends parents the changes made on this phone (only what changed)
  if(!feedOn()||!tourReady())return; // between tournaments: the last results stay up for parents
  const {F,fs}=FB,id=S.feed.id,ids=gids(),run=ids.find(x=>G(x).clock.running);

const pel=c=>(c.acc||0)+(c.running?Math.max(0,Date.now()-(c.startedAt||0)):0);
function pClock(f){
  const e=pel(f.clock),n=f.periods||1,per=(f.len||10)*60000/n;
  if(n===1)return fmt(Math.min(e,f.len*60000));
  const i=Math.min(n-1,Math.floor(e/per+1e-9));return fmt(Math.min(per,e-i*per));
}
function pStatus(f){
  const n=f.periods||1,per=(f.len||10)*60000/n,e=pel(f.clock),i=Math.min(n-1,Math.floor(e/per+1e-9));
  const pname=n===2?['1st half','2nd half'][i]:n===4?'Quarter '+(i+1):'Live';
  return{none:'No game yet',pre:'Kick-off soon',live:pname,paused:'Clock paused',break:n===2?'Half time':'End of quarter '+Math.round(e/per),ft:'Full time'}[f.status]||'';
}

/* ---------- swaps (tap or drag) ---------- */
function swap(id,a,aSide,b,bSide){
  const g=G(id);
  if(aSide==='pitch'&&bSide==='pitch'){ // change keeper between two players on the pitch
    if(isRugby())return;
    const k=keeper(g);if(a!==k&&b!==k){toast('Drag the keeper onto a player to swap the gloves.');return}
    const nk=a===k?b:a;
    if(!started(g))mut(id,g=>{g.gk=nk});
    else{withUndo(id,`${nameOf(nk)} now in goal`);mut(id,g=>{g.gkChanges=[...(g.gkChanges||[]),{at:el(g),p:nk}]})}
    toast(`${nameOf(nk)} is in goal`);return;
  }
  if(aSide===bSide||a===b)return;
  const off=aSide==='pitch'?a:b,on=aSide==='pitch'?b:a;
  // Check against the game as it is now (another coach may have just made a change on their phone),
  // so a player can never be on the pitch twice or on the pitch and bench at once.
  if(started(g)){const now=onPitch(g);
    if(!now.has(off)){toast(`${nameOf(off)} isn't on the pitch any more. Check the latest line-up.`);render();return}
    if(now.has(on)){toast(`${nameOf(on)} is already on the pitch.`);render();return}}
  else if(!g.starters.includes(off)||g.starters.includes(on)){render();return}
  if(!started(g)){
    mut(id,g=>{g.starters=g.starters.map(x=>x===off?on:x);g.bench=g.bench.filter(x=>x!==on);g.bench.push(off);if(g.gk===off)g.gk=on});
    return;
  }
  if(g.done){toast('Reopen the game to change subs.');return}
  const wasK=keeper(g)===off;
  withUndo(id,`${nameOf(on)} on, ${nameOf(off)} off at ${tAt(el(g))}${wasK?` · ${nameOf(on)} now in goal`:''}`);
  mut(id,g=>{g.subs.push({at:el(g),off,on,...(wasK?{gk:true}:{})})});
}

/* ---------- opening the app on match day: go straight to the game that matters now ---------- */
let autoOpened=false;
function kickoffAt(g){ // today's kick-off time from "9:30", "9.30", "14:15" or "2.15pm"
  const m=String(g.time||'').trim().match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?$/i);if(!m)return null;
  let h=+m[1];if(m[3]&&/pm/i.test(m[3])&&h<12)h+=12;if(m[3]&&/am/i.test(m[3])&&h===12)h=0;
  const d=new Date();d.setHours(h,+m[2],0,0);return d.getTime();
}
function autoOpen(){
  if(autoOpened||!S.cfgLoaded&&!Object.keys(S.games).length)return;
  autoOpened=true;
  if(S.game||S.tab!=='games'||S.menu||S.teams||S.gate)return; // only from the normal starting screen
  const ids=gids(),live=ids.find(id=>G(id).clock.running);
  let pick=live;
  if(!pick&&S.tour.date===today()){ // a game about to start, or started and not finished
    const now=Date.now(),len=(S.tour.len||10)*60000;
    pick=ids.find(id=>{const g=G(id),k=kickoffAt(g);return k&&!g.done&&now>=k-30*60000&&now<=k+len+15*60000});
  }
  if(pick){S.game=pick;S.fx=false}
}

/* ---------- kick-off: who's in goal, then players a side, then start the clock ---------- */
function tryKick(id,o={}){
  const g=G(id);
  if(!started(g)){
    if(!isRugby()&&!g.gk&&!o.nokeeper){S.askGk=id;S.askSize=null;render();return}
    const n=g.starters.length;
    if(!o.sizeOk&&n&&n!==gameSize(g)){S.askGk=null;S.askSize={g:id,n,why:n<gameSize(g)?'fewer':'kickmore'};render();return}
  }
  S.askGk=null;S.askSize=null;
  withUndo(id,started(g)?(atBreak(g)?'Started '+perName(atBreak(g)):'Clock restarted'):'Kicked off');
  mut(id,g=>{g.clock.running=true;g.clock.startedAt=Date.now();g.done=false});
  if(!started(g))toast('Kicked off.');
}

/* ---------- players a side: changing it for one game ---------- */
function sizeAsk(g,a){
  const more=a.why==='more'||a.why==='kickmore';
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="szq"><div class="box">

/* ---------- rugby scoring: what was scored, then (for us) who ---------- */
function addScore(id,k,type){
  let i=-1;withUndo(id,`${RTYPES[type].n}${k==='us'?'':' for '+(G(id).opponent||'them')}`);
  mut(id,g=>{const x={at:el(g),type};
    if(k==='us'){x.p=null;g.goals=[...(g.goals||[]),x];i=g.goals.length-1;g.score.us+=ptsOf(x)}
    else{g.opp=[...(g.opp||[]),x];g.score.them+=ptsOf(x)}});
  if(k==='us')S.scorer={g:id,i};render();
}
function removeScore(id,k){
  mut(id,g=>{if(k==='us'){const gs=g.goals||[];if(!gs.length)return;const x=gs[gs.length-1];g.goals=gs.slice(0,-1);g.score.us=Math.max(0,g.score.us-ptsOf(x))}
    else{const os=g.opp||[];if(!os.length)return;const x=os[os.length-1];g.opp=os.slice(0,-1);g.score.them=Math.max(0,g.score.them-ptsOf(x))}});
  S.scorer=null;render();
}
function rugbyBar(g,k){
  return `<div class="hint scorer"><b>${k==='us'?'What did we score?':'What did '+esc(g.opponent||'they')+' score?'}</b>
    <div class="pickchips">${Object.entries(RTYPES).map(([t,x])=>`<button class="pc" data-act="rtype" data-type="${t}">${x.n} +${x.p}</button>`).join('')}

}

/* ---------- corrections: game length, clock, subs after the fact ---------- */
// Subs are recorded live by default; this panel fixes the clock and adds, retimes or removes subs.
function parseT(v){const m=String(v||'').trim().replace('.',':').match(/^(\d{1,3})(?::(\d{1,2}))?$/);if(!m)return null;return (+m[1]*60+(+(m[2]||0)))*1000}
function keeperAt(g,t,skip){const ev=[...bySubTime(g).filter(e=>e!==skip&&e.gk&&e.at<=t).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[]).filter(c=>c.at<=t)].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function onPitchAt(g,t){const s=new Set(g.starters);for(const e of bySubTime(g)){if(e.at>t)break;s.delete(e.off);if(e.on)s.add(e.on)}return s}
function subsProblem(g){ // replay every sub in time order: each one must take off someone who was on, and bring on someone who wasn't
  const s=new Set(g.starters),end=el(g);
  for(const e of bySubTime(g)){
    if(e.at>end)return `${fmt(e.at)} is later than the clock (${fmt(end)}).`;
    if(!s.has(e.off))return `${nameOf(e.off)} wasn't on the pitch at ${fmt(e.at)}.`;
    if(e.on&&s.has(e.on))return `${nameOf(e.on)} was already on the pitch at ${fmt(e.at)}.`;
    s.delete(e.off);if(e.on)s.add(e.on);
  }
  return null;
}
function tryFix(id,fn,ok){ // apply a correction only if the subs still make sense afterwards
  const g=structuredClone(G(id));fn(g);
  g.subs.forEach(e=>{const k=keeperAt(g,e.at,e)===e.off;if(k)e.gk=true;else delete e.gk});
  const bad=subsProblem(g);if(bad){toast(bad+' Nothing was changed.');return false}
  S.games[id]=g;put('games/'+id,g);if(ok)toast(ok);render();return true;
}

  return[`Squad: ${r.squad.length} players (${plus(sq1,sq0)} added, ${plus(sq0,sq1)} removed)`,

async function readBackup(f){
  let d=null;try{if(f.size>5e6)throw 0;d=JSON.parse(await f.text())}catch(_){S.restore={errors:["That file isn't a Match Day backup."]};render();return}
  const v=validateBackup(d);
  S.restore=v.errors.length?{errors:v.errors}:{errors:[],exported:String(d.exported||''),data:v.data,diff:restoreDiff(v.data)};
  render();
}
const undoKey=()=>'matchday-undo-'+S.teamId;
function undoInfo(){try{const u=JSON.parse(lsGet(undoKey())||'null');return u&&u.at?new Date(u.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):null}catch(_){return null}}
async function writeTeamData(r,undoable){ // replace this team's data with r in one all-or-nothing batch
  const {F,fs}=FB,d=(...p)=>F.doc(fs,'teams',S.teamId,...p),b=F.writeBatch(fs);let ops=0;const op=()=>{if(++ops>490)throw new Error('too-big')};
  if(undoable){const snap=validateBackup(backupData());if(!snap.errors.length)lsSet(undoKey(),JSON.stringify({at:Date.now(),data:snap.data}))}
  if(r.cfg&&r.cfg.team){b.set(d('club','settings'),{...DEFAULT_CFG,...r.cfg});op()}
  b.set(d('club','squad'),{players:alpha(r.squad)});op();
  b.set(d('club','tournament'),r.tour);op();
  if(r.hasNotes){b.set(d('club','notes'),{items:r.notes});op()}
  Object.keys(S.games).forEach(id=>{if(!(id in r.games)){b.delete(d('games',id));op()}});
  Object.entries(r.games).forEach(([id,g])=>{b.set(d('games',id),g);op()});
  [['awards',r.awards],['archive',r.archive]].forEach(([c,list])=>{const keep=new Set(list.map(x=>x.id));
    S[c].forEach(x=>{if(!keep.has(x.id)){b.delete(d(c,x.id));op()}});list.forEach(({id,...doc})=>{b.set(d(c,id),doc);op()})});
  if(!navigator.onLine)toast('Restore saved on this phone. It finishes uploading when there is signal.');
  await track(b.commit()); // resolves only when the server has accepted every change
}
async function applyRestore(){
  const r=S.restore;S.restore=null;render();if(!r||r.errors.length)return;
  try{await writeTeamData(r.data,true);toast('Restore complete ✓');}
  catch(e){toast(`Restore failed, so nothing was changed (${e.message==='too-big'?'backup too big':errCode(e)}).`);}
  render();
}
async function undoRestore(){
  let u=null;try{u=JSON.parse(lsGet(undoKey())||'null')}catch(_){}
  if(!u||!u.data)return;

}

/* ---------- squad helpers ---------- */
function addNames(text){
  const raw=String(text||'').split(/[\n,;]+/).map(x=>x.replace(/\s+/g,' ').replace(/[^\p{L}\p{M}' -]/gu,'').trim()).filter(Boolean);
  if(!raw.length)return 0;
  const firsts=raw.map(n=>n.split(' ')[0]);
  const all=firsts.map(f=>f.toLowerCase());
  let added=0;const squad=[...S.squad];
  raw.forEach((n,i)=>{const parts=n.split(' '),f=cap(parts[0]);
    let name=f;if(all.filter(x=>x===f.toLowerCase()).length>1&&parts[1])name=f+' '+parts[1][0].toUpperCase();
    if(squad.some(p=>p.name.toLowerCase()===name.toLowerCase()))return;
    squad.push({id:'p'+Math.random().toString(36).slice(2,9),name:name.slice(0,30)});added++});
  S.squad=squad;if(added)saveSquad();return added;
}
const cap=w=>w?w[0].toUpperCase()+w.slice(1):w;

function parseFixtures(text){
  const short=(S.cfg.short||'').trim().toLowerCase();
  let lines=String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(short&&lines.some(l=>l.toLowerCase().includes(short)))lines=lines.filter(l=>l.toLowerCase().includes(short));
  return lines.map(l=>{
    let time='',pitch='',rest=l;
    const tm=rest.match(/\b(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);if(tm){time=tm[1]+':'+tm[2];rest=rest.replace(tm[0],' ')}
    const pm=rest.match(/\(?\s*(?:pitch|pt)\s*([A-Za-z0-9]+)\s*\)?/i)||rest.match(/\bP(\d+)\b/);if(pm){pitch=pm[1];rest=rest.replace(pm[0],' ')}
    rest=rest.replace(/[()\[\]|]/g,' ');
    let parts=rest.split(/\s+(?:vs\.?|v\.?|versus|-|–)\s+/i).map(x=>x.trim()).filter(Boolean);
    let opp=parts.length>1?(parts.find(x=>!short||!x.toLowerCase().includes(short))||parts[1]):(parts[0]||'');
    const side=parts.length>1&&short&&!parts[0].toLowerCase().includes(short)&&parts.slice(1).some(x=>x.toLowerCase().includes(short))?'away':'home';
    if(short)opp=opp.replace(new RegExp(short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),' ');
    opp=opp.replace(/^\s*(?:v|vs)\s+/i,'').replace(/\s+/g,' ').trim().slice(0,40);
    return{time,pitch,opponent:opp,side};
  }).filter(f=>f.opponent||f.time).slice(0,10);
}

function finishTournament(){
  const ids=gids();
  if(!ids.some(id=>started(G(id)))){toast('No games have been played yet, so there is nothing to save.');render();return}
  const games=ids.map(id=>{const g=G(id);return{n:g.n,opponent:g.opponent,team:usName(),side:isAway(g)?'away':'home',size:gameSize(g),time:g.time,pitch:g.pitch,score:g.score,done:g.done,played:started(g),gk:keeper(g)||g.gk||null,mins:mins(g),goals:(g.goals||[]).map(x=>({at:x.at,p:x.p||null,...(x.type?{type:x.type}:{})})),opp:(g.opp||[]).map(x=>({at:x.at,type:x.type}))}});
  const doc={name:S.tour.name||'',date:S.tour.date||today(),savedAt:Date.now(),games,players:S.squad.map(p=>({id:p.id,name:p.name}))};
  const tid='t'+Date.now();
  put('archive/'+tid,doc);S.archive=[{id:tid,...doc},...S.archive.filter(t=>t.id!==tid)];
  ids.forEach(id=>{const n=blank(G(id).n);S.games[id]=n;put('games/'+id,n)});
  S.tour={...S.tour,name:'',date:'',ready:false};saveTour();
  // take the coach to where it went: Season → Results, with this tournament open
  const r=record(games);S.saved={id:tid,name:doc.name,date:doc.date,r};
  S.tab='season';lastTab.season='season';S.openT=tid;S.game=null;S.fx=false;render();window.scrollTo(0,0);
}

/* drag and drop between pitch and bench */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip[data-p]');if(!c||S.readOnly||e.button>0)return;
  drag={c,x:e.clientX,y:e.clientY,pid:e.pointerId,moved:false,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.moved=true;const r=drag.c.getBoundingClientRect();drag.w=r.width;drag.h=r.height;
    const gh=drag.c.cloneNode(true);gh.classList.add('ghost');gh.style.width=r.width+'px';document.body.append(gh);drag.ghost=gh;drag.c.classList.add('dragging')}
  drag.ghost.style.transform=`translate(${e.clientX-drag.w/2}px,${e.clientY-drag.h/2}px) scale(1.08)`;
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.chip[data-p]');
  const ok=t&&t!==drag.c&&(t.dataset.side!==drag.c.dataset.side||t.dataset.side==='pitch')?t:null;
  if(drag.over!==ok){drag.over?.classList.remove('over');ok?.classList.add('over');drag.over=ok}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,350);
  d.ghost.remove();d.c.classList.remove('dragging');d.over?.classList.remove('over');
  if(!cancel&&d.over){S.pick=null;swap(d.c.dataset.g,d.c.dataset.p,d.c.dataset.side,d.over.dataset.p,d.over.dataset.side);render()}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

document.addEventListener('submit',e=>{
  if(e.target.id==='vouchf'){e.preventDefault();redeemVoucher(document.getElementById('vcode').value);return}
  if(e.target.id==='vmakef'){e.preventDefault();makeVoucher();return}
  if(e.target.id==='notef'){e.preventDefault();const p=document.getElementById('notep').value,t=document.getElementById('notet').value.trim().slice(0,300);
    if(!p){toast('Choose a player first.');return}if(!t){toast('Write the note first.');return}
    S.notes=[...S.notes,{id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),p,text:t,at:Date.now(),done:false,by:FB?myName():''}];S.noteFor=p;
    document.getElementById('notet').value='';document.activeElement?.blur();saveNotes();toast(`Note added for ${nameOf(p)}.`);return}
  if(e.target.id==='joinf'){e.preventDefault();joinTeam(document.getElementById('joincode').value);return}
  if(e.target.id==='acctf'){e.preventDefault();document.activeElement?.blur();(e.target.dataset.mode==='create'?createAccount:signInAccount)();return}
  if(e.target.id!=='addf')return;e.preventDefault();
  const i=document.getElementById('newname'),n=i.value.trim();if(!n)return;
  if(S.squad.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast(`${n} is already in the squad.`);return}
  S.squad=[...S.squad,{id:'p'+Math.random().toString(36).slice(2,9),name:n.slice(0,30)}];
  i.value='';saveSquad();setTimeout(()=>document.getElementById('newname')?.focus(),0);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='myname'){lsSet('matchday-name',t.value.trim().slice(0,40));myTeams().forEach(x=>touchMember(x,true));toast('Name saved.');return}
  if(t.id==='restorefile'&&t.files&&t.files[0]){readBackup(t.files[0]);t.value='';return}
  if(t.dataset.gsize&&S.game){const v=Math.min(11,Math.max(3,parseInt(t.value)||tourSize()));mut(S.game,g=>{if(v===tourSize())delete g.size;else g.size=v});return}
  if(t.dataset.ed){editField(t.dataset.ed,t.type==='checkbox'?t.checked:t.value);return}
  if(t.dataset.goalp&&S.game){const i=+t.dataset.goalp,v=t.value||null;mut(S.game,g=>{if(g.goals?.[i])g.goals[i].p=v});return}
  if(t.dataset.subat&&S.game){const i=+t.dataset.subat,v=parseT(t.value);if(v==null){toast('Type the time like 4:30.');render();return}
    if(!tryFix(S.game,g=>{g.subs[i].at=v},`Sub moved to ${fmt(v)}.`))render();return}
  if(t.dataset.cfg&&S.cfgLoaded&&S.cfg.team){const k=t.dataset.cfg;let v=t.value.trim().slice(0,40);if(k==='size')v=Math.min(11,Math.max(3,parseInt(v)||5));if(k==='team'&&!v)return;
    S.cfg={...S.cfg,[k]:v};put('club/settings',S.cfg);render();return}
  if(t.dataset.fx){const [id,f]=t.dataset.fx.split('|');const v=t.value.trim().slice(0,40);if(G(id)[f]!==v)mut(id,g=>{g[f]=v});return}

/* firebase: where every team's data lives */
const FB_SDK='https://www.gstatic.com/firebasejs/12.10.0/';
const TEAM_KEY='matchday-team';   // the team open now
const TEAMS_KEY='matchday-teams'; // every team this phone belongs to (a coach can have several)
let FB=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}};
// Writes go into the phone's offline copy at once (the screen updates straight away) and upload
// when there's signal. A write isn't "saved" until the server confirms it: sync counts the ones
// still waiting so the header can say Saving… / Waiting for signal / Not saved.
const sync={pending:0,failed:0};
function track(p,fail){
  sync.pending++;liveLabel();
  p.then(()=>{sync.failed=0},e=>{sync.failed++;if(fail)fail(e)}).finally(()=>{sync.pending--;liveLabel()});
  return p;
}
function fsAdapter(base){ // the small storage interface put()/remove()/subscribe() use
  const {F,fs}=FB,ref=p=>F.doc(fs,base+'/'+p);
  const fail=e=>{if(e&&e.code==='permission-denied')toast("That change wasn't saved: the server refused it. If it keeps happening, reload the app or rejoin the team.");else toast(`That change wasn't saved (${errCode(e)}).`)};
  return{
    doc:p=>({set:b=>{track(F.setDoc(ref(p),b),fail);return Promise.resolve()},delete:()=>{track(F.deleteDoc(ref(p)),fail);return Promise.resolve()},
      onSnapshot:(cb,err)=>F.onSnapshot(ref(p),s=>cb({exists:s.exists(),data:()=>s.data()}),err)}),
    collection:c=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,base+'/'+c),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)})
  };
}
function myTeams(){
  let l=[];try{l=JSON.parse(lsGet(TEAMS_KEY)||'[]')}catch(_){}

const saveTeams=l=>lsSet(TEAMS_KEY,JSON.stringify([...new Set(l)]));

    F.onSnapshot(F.doc(fs,'teams',t,'club','settings'),s=>{teamInfo[t].name=s.data()?.team||'';render()},gone);
    F.onSnapshot(F.collection(fs,'teams',t,'games'),s=>{teamInfo[t].running=s.docs.filter(d=>d.data().clock?.running).map(d=>d.data().n).sort((a,b)=>a-b);render()},gone);

function liveLabel(){

addEventListener('online',liveLabel);addEventListener('offline',liveLabel);
async function connectFirebase(){
  let cfg=null,env='live';try{const m=await import('./firebase-config.js');cfg=m.default;env=m.ENV||'live';SHOP=m.SHOP||{}}catch(_){}
  if(!cfg||!cfg.apiKey)return false;
  if(env==='beta')document.body.classList.add('beta'); // beta has its own data and sign-ins
  setSync(false,'Connecting…');
  const [{initializeApp},A,F]=await Promise.all(['app','auth','firestore'].map(m=>import(FB_SDK+'firebase-'+m+'.js')));
  // Google's sign-in hand-off has to come back to the same address the app runs on, or iPhones
  // (which block cross-site storage) lose the result. Firebase Hosting serves it on every site address.
  if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))cfg={...cfg,authDomain:location.hostname};
  const app=initializeApp(cfg);
  let fs;
  try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(_){fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,localCache:F.memoryLocalCache()})}
  if(lsGet('matchday-wipe')){ // a wipe that couldn't finish last time: do it before anything is loaded
    try{await F.clearIndexedDbPersistence(fs);lsSet('matchday-wipe',null)}catch(_){}
  }
  FB={A,F,auth:A.getAuth(app),fs};
  // Each phone gets an anonymous sign-in: no passwords. Joining a team with its invite code is what grants access.
  await FB.auth.authStateReady();
  if(FOLLOW){await followFeed();return true} // a parent following the score: no teams, no team data
  if(await finishGoogle())return true; // reloading into the coach's existing account
  await signedIn().catch(()=>{});
  await loadAccountTeams();
  const t=lsGet(TEAM_KEY)||myTeams()[0];
  watchPending();
  if(t)openTeam(t);else{S.gate=true;setSync(false,'No team yet');render()}
  return true;
}
function openTeam(t){
  const {F,fs}=FB;
  if(S.teamId&&S.teamId!==t){switchTeam(t);return} // adding a second team: reload into it
  saveTeams([...myTeams(),t]);syncTeamList();
  lsSet(TEAM_KEY,t);S.gate=false;S.adding=false;S.teamId=t;db=fsAdapter('teams/'+t);liveLabel();watchTeams();
  F.getDoc(F.doc(fs,'teams',t)).then(s=>{S.invite=s.data()?.code||'';S.createdBy=s.data()?.createdBy||null;S.teamCreated=s.data()?.created?.toMillis?.()||0;render()}).catch(()=>{});
  watchBilling(t);
  watchMembers(t);watchRequests(t);touchMember(t);
  subscribe(e=>{if(leaving)return; // we're leaving on purpose: let leaveTeam finish (and wipe)
    if(e&&e.code==='permission-denied'){setSync(false,'Not a member');toast("This phone isn't a member of that team any more.");leaveTeam(false)}});
  render();
}
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I to misread
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>CODE_CHARS[n%CODE_CHARS.length]).join('');
const showCode=c=>c?c.slice(0,3)+'-'+c.slice(3):'';

  let last=null;

    const tref=F.doc(F.collection(fs,'teams')),code=newCode(),b=F.writeBatch(fs);

async function joinTeam(raw){

function getPending(){try{return JSON.parse(lsGet('matchday-pending')||'[]').filter(x=>x&&x.t&&x.code)}catch(_){return[]}}

const pendingWatch={};
function watchPending(){
  const {F,fs,auth}=FB,uid=auth.currentUser?.uid;if(!uid)return;S.pending=getPending();
  S.pending.forEach(({t})=>{if(pendingWatch[t])return;
    pendingWatch[t]=[
      F.onSnapshot(F.doc(fs,'teams',t,'members',uid),m=>{if(!m.exists())return; // accepted
        stopPending(t);dropPending(t);saveTeams([...myTeams(),t]);syncTeamList();
        if(!S.teamId)openTeam(t);else{toast("You've been accepted. Open the team from My teams.");render()}},()=>{}),
      F.onSnapshot(F.doc(fs,'teams',t,'requests',uid),r=>{if(r.exists()||r.metadata.hasPendingWrites)return;
        F.getDoc(F.doc(fs,'teams',t,'members',uid)).then(m=>{if(!m.exists()&&getPending().some(x=>x.t===t)){ // declined
          stopPending(t);dropPending(t);toast("Your request to join wasn't accepted.");render()}}).catch(()=>{})},()=>{})];
  });
}

  if(!email){toast('Type your email address, then tap Forgot password.');return}
  try{await A.sendPasswordResetEmail(auth,email);toast("If there's an account for that email, a reset link is on its way. Check spam too.")}
  catch(e){toast(authMsg(e))}
}
async function signOutAccount(){
  if(!(await uploadedFirst()))return;
  await FB.A.signOut(FB.auth);saveTeams([]);lsSet(TEAM_KEY,null);await wipeLocalData();location.reload();
}

function acctForm(mode){
  return `<form class="acctf" id="acctf" data-mode="${mode}">
    <input id="acctemail" type="email" autocomplete="username" placeholder="Email address" aria-label="Email address">
    <input id="acctpw" type="password" autocomplete="${mode==='create'?'new-password':'current-password'}" placeholder="${mode==='create'?'Choose a password (6+ characters)':'Password'}" aria-label="Password">
    <div class="cbtns"><button class="btn go" type="submit">${mode==='create'?'Create account':'Sign in'}</button>
    ${mode==='signin'?'<button class="btn" type="button" data-act="acctforgot">Forgot password</button>':''}
    <button class="btn" type="button" data-act="acctcancel">Cancel</button></div></form>`;
}
function accountCard(){
  if(!FB)return'';
  const u=FB.auth.currentUser;
  if(isAccount())return `<div class="card"><h3>Your account</h3>
    <p>Signed in as <b>${esc(u.email)}</b>.</p>
    <p class="note">Your teams are saved to this account. On a new phone, open the app and tap <b>Sign in</b> to get them all back.</p>
    <button class="x ${S.confirm==='signout'?'sure':''}" data-act="signout">${S.confirm==='signout'?'Tap again to sign out on this phone':'Sign out on this phone'}</button></div>`;
  return `<div class="card"><h3>Keep your teams safe</h3>
    <p class="note">Right now your teams are only on this phone. Sign in with Google or make a free email account, and you can get all your teams back on a new phone. Optional.</p>
    ${S.acct?acctForm(S.acct):`${googleBtn()}<div class="cbtns"><button class="btn" data-act="acctcreate">Create an account with email</button><button class="btn" data-act="acctsignin">Sign in with email</button></div>`}</div>`;
}
function pendingCard(){
  if(!S.pending.length)return'';
  return `<div class="card"><h3>Waiting to be accepted</h3>
    ${S.pending.map(p=>`<div class="row" style="padding:6px 0;border:0"><span>Request sent with code <b class="num">${esc(showCode(p.code))}</b>. A coach in that team needs to accept you; this updates by itself.</span>
      <button class="x" data-act="reqcancel" data-id="${esc(p.t)}">Cancel</button></div>`).join('')}</div>`;
}

  <p class="note num" style="text-align:center">Match Day v${APP_VERSION}</p><p class="note" style="text-align:center"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>

function teamsView(){
  const l=myTeams();
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="teamsclose">← Back</button>
  <h2>My teams</h2>
  <div class="rows">${l.map(t=>{const i=teamInfo[t]||{},cur=t===S.teamId,name=cur?S.cfg.team:i.name;
    return `<button class="row teamrow ${cur?'cur':''}" data-act="switch" data-id="${esc(t)}">
      <span class="who">${esc(name||'Loading…')}</span>
      ${i.running&&i.running.length?`<span class="flag run">Game ${i.running.join(', ')} running</span>`:''}

/* ---------- members: who's in each team ---------- */
const myName=()=>(lsGet('matchday-name')||FB?.auth?.currentUser?.displayName||'').slice(0,40);
function signInVia(){const u=FB?.auth?.currentUser;if(!u)return'phone';return u.providerData.some(p=>p.providerId==='google.com')?'google':u.email?'email':'phone'}
function touchMember(t,force){ // keep my entry in this team's member list up to date (at most every few hours)
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u||!t)return;
  let seen={};try{seen=JSON.parse(lsGet('matchday-seen')||'{}')}catch(_){}
  if(!force&&seen[t]&&Date.now()-seen[t]<6*3600e3)return;
  F.setDoc(F.doc(fs,'teams',t,'members',u.uid),{name:myName(),via:signInVia(),seen:F.serverTimestamp()},{merge:true})
    .then(()=>{seen[t]=Date.now();lsSet('matchday-seen',JSON.stringify(seen))}).catch(()=>{});
}
function checkOwner(){
  const {F,fs,auth}=FB;if(!auth.currentUser?.email){S.owner=false;return}
  F.getDocs(F.query(F.collection(fs,'teams'),F.limit(1))).then(()=>{S.owner=true;if(S.menu)render()}).catch(()=>{S.owner=false});
}
async function loadAdmin(){
  const {F,fs}=FB;S.admin={loading:true,teams:[]};render();
  try{
    const ts=await F.getDocs(F.collection(fs,'teams'));
    const rows=await Promise.all(ts.docs.map(async d=>{
      const [st,ms]=await Promise.all([F.getDoc(F.doc(fs,'teams',d.id,'club','settings')).catch(()=>null),F.getDocs(F.collection(fs,'teams',d.id,'members')).catch(()=>null)]);
      const bl=await F.getDoc(F.doc(fs,'teams',d.id,'billing','state')).catch(()=>null);
      const cfg=st?.data?.()||{},mem=ms?ms.docs.map(m=>m.data()):[];
      const seen=Math.max(0,...mem.map(m=>m.seen?.toMillis?.()||m.joined?.toMillis?.()||0));
      return{id:d.id,name:cfg.team||'',sport:cfg.sport||'football',created:d.data().created?.toMillis?.()||0,coaches:mem.length,seen,bill:bl?.data?.()||null};
    }));
    const vs=await F.getDocs(F.collection(fs,'vouchers')).catch(()=>null);
    S.admin={loading:false,teams:rows.sort((a,b)=>b.seen-a.seen),vouchers:vs?vs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):[]};
  }catch(e){S.admin={loading:false,error:errCode(e),teams:[]}}
  render();
}
function adminPlan(t){
  const b=t.bill||{};if(b.unlocked)return({founding:'Founding club',voucher:'Unlocked (voucher)',purchase:'Unlocked (paid)',test:'Unlocked (test)'})[b.source]||'Unlocked';
  const end=b.trialEnds||Math.max(t.created||0,PLAN_FROM)+TRIAL_DAYS*864e5,left=Math.ceil((end-Date.now())/864e5);
  return left>0?`Free trial · ${left} day${left>1?'s':''} left`:'Trial ended · view-only';
}
function adminView(){
  const A=S.admin||{teams:[]},T=A.teams,day=864e5,now=Date.now();
  const week=T.filter(t=>now-t.seen<7*day).length,rug=T.filter(t=>t.sport==='rugby').length;
  const when=ms=>ms?nice(new Date(ms).toISOString().slice(0,10)):'–';
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="adminclose">← Back</button>
  <h2>Admin</h2>
  <p class="note">Only you can see this. Team names and activity only, never squads, games or notes.</p>
  ${A.loading?'<p class="note">Loading…</p>':A.error?`<p class="note">Couldn't load (${esc(A.error)}).</p>`:`
  <div class="summary num"><span>Teams <b>${T.length}</b></span><span>Active this week <b>${week}</b></span><span>Football <b>${T.length-rug}</b> · Rugby <b>${rug}</b></span></div>
  <div class="rows">${T.map(t=>`<div class="row adm"><div class="who">${esc(t.name||'(not set up yet)')}<span class="tag">${t.sport==='rugby'?'Rugby':'Football'}</span></div>
    <div class="note">${t.coaches} coach${t.coaches===1?'':'es'} · last active ${esc(when(t.seen))} · created ${esc(when(t.created))}</div>
    <div class="note">${esc(adminPlan(t))}</div>
    <div class="cbtns">${['test','founding','end','reset'].map(k=>`<button class="x" data-act="billset" data-id="${esc(t.id)}" data-v="${k}">${{test:'Test unlock',founding:'Founding club',end:'End trial now',reset:'Reset'}[k]}</button>`).join('')}</div>
    <div class="note num admid">${esc(t.id)}</div></div>`).join('')}</div>
  <button class="btn small" data-act="adminload" style="align-self:flex-start">Refresh</button>
  ${vouchersCard()}`}
  </div>`;
}
function watchMembers(t){
  const {F,fs}=FB;
  let known=null;
  F.onSnapshot(F.collection(fs,'teams',t,'members'),s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));
    const me=FB.auth.currentUser?.uid,ids=new Set(S.members.map(m=>m.id));
    if(known)S.members.filter(m=>!known.has(m.id)&&m.id!==me).forEach(m=>toast(`${m.name||'A new coach'} joined the team.`));
    known=ids;if(S.menu)render()},()=>{});
}
function ago(ts){
  const ms=ts?.toMillis?.();if(!ms)return'';const d=Math.floor((Date.now()-ms)/864e5);
  return d<=0?'active today':d===1?'active yesterday':d<7?`active ${d} days ago`:d<60?`active ${Math.round(d/7)} week${Math.round(d/7)>1?'s':''} ago`:'not active lately';
}
function membersList(){
  const me=FB.auth.currentUser?.uid,via={google:'Google',email:'Email',phone:'No account'};
  const l=[...S.members].sort((a,b)=>(b.id===S.createdBy)-(a.id===S.createdBy)||(b.id===me)-(a.id===me)||(a.name||'~').localeCompare(b.name||'~'));
  return `<div class="rows">${l.map(m=>`<div class="row member"><span class="who">${esc(m.name||(m.via==='phone'||!m.via?'Coach (no account)':'Coach'))}
      ${m.id===S.createdBy?'<span class="tag mgr">Manager</span>':''}${m.id===me?'<span class="tag">you</span>':''}</span>
    <span class="note">${via[m.via]||'No account'}${ago(m.seen)?' · '+ago(m.seen):''}</span>
    ${S.createdBy===me&&m.id!==me?`<button class="x ${S.confirm==='rm-'+m.id?'sure':''}" data-act="rmcoach" data-id="${esc(m.id)}">${S.confirm==='rm-'+m.id?'Tap to remove':'Remove'}</button>`:''}</div>`).join('')||'<p class="note">Loading…</p>'}</div>`;
}

  const u=FB.auth.currentUser;
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="menuclose">← Back</button>
  <div class="card"><h3>You</h3>
    <label style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Your name (other coaches see this)</span>
      <input id="myname" value="${esc(myName())}" placeholder="e.g. Sam (coach)" maxlength="40" autocomplete="name"></label>

    :`<p class="note">Not signed in: your teams are only on this phone. Sign in to get them back on a new phone.</p>
      ${S.acct?acctForm(S.acct):`${googleBtn()}<div class="cbtns"><button class="btn" data-act="acctcreate">Create an account with email</button><button class="btn" data-act="acctsignin">Sign in with email</button></div>`}`}
  </div>
  <div class="card"><h3>My teams</h3>
    <div class="rows">${myTeams().map(t=>{const i=teamInfo[t]||{},cur=t===S.teamId;
      return `<button class="row teamrow ${cur?'cur':''}" data-act="switch" data-id="${esc(t)}"><span class="who">${esc((cur?S.cfg.team:i.name)||'Loading…')}</span>
        ${i.running&&i.running.length?`<span class="flag run">Game ${i.running.join(', ')} running</span>`:''}<span class="note">${cur?'Open now':'Switch'}</span></button>`}).join('')}</div>
    <button class="btn" data-act="addteam">+ Add a team</button></div>
  ${pendingCard()}
  <div class="card"><h3>${esc(S.cfg.team||'This team')}</h3>
    <p>Invite code: <b class="num" style="font-family:var(--display);font-size:26px;letter-spacing:.06em">${esc(showCode(S.invite))||'…'}</b></p>
    <p class="note">Other coaches open the app, tap <b>Join a team</b> and enter this code.</p>
    ${requestsBanner()}
    <span class="lbl">Team members</span>
    ${membersList()}
    <button class="x ${S.confirm==='leave'?'sure':''}" data-act="leave">${S.confirm==='leave'?'Tap again to leave this team on this phone':'Leave this team on this phone'}</button></div>
  ${planCard()}
  ${parentCard()}
  ${backupCard()}
  ${S.owner?'<button class="btn" data-act="admin">Admin: all teams</button>':''}
  <p class="note num" style="text-align:center">Match Day v${APP_VERSION}</p><p class="note" style="text-align:center"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
  </div>`;
}
function teamCard(){
  if(!FB||!S.teamId)return'';
  return `<div class="card"><h3>Invite other coaches</h3>
    <p>Invite code: <b class="num" style="font-family:var(--display);font-size:26px;letter-spacing:.06em">${esc(showCode(S.invite))||'…'}</b></p>

    <button class="x ${S.confirm==='leave'?'sure':''}" data-act="leave">${S.confirm==='leave'?'Tap again to leave this team on this phone':'Leave this team on this phone'}</button></div>`;
}

render();
(async()=>{
  try{
    if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
    if(!await connectFirebase())setSync(false,'Not syncing');
  }catch(e){setSync(false,'Not syncing')}
