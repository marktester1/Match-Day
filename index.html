<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Day</title>
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match Day">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-column touchline app — tournament header, tab bar, then a grass "pitch" panel as the one bold element */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#16211a; --muted:#5b6a60; --line:#d7dfd6;
  --grass:#1e6a3a; --grass-2:#25784318; --grass-deep:#175a30; --chalk:#ffffff;
  --live:#b06a10; --live-bg:#fbefdc; --bad:#b3261e; --good:#1e6a3a; --gk:#7a3fb0; --gk-bg:#f0e6fa; --gold:#c8961a; --gold-ink:#241a02;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#97a99d; --line:#2a372f;
  --grass:#2f8a50; --grass-2:#3fa36226; --grass-deep:#1f6a3b; --chalk:#f4fbf6;
  --live:#e8a440; --live-bg:#3a2a12; --bad:#ef6b5f; --good:#5cc183; --gk:#c79bf0; --gk-bg:#2e2140; --gold:#e6b84a; --gold-ink:#241a02; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.top{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-size:28px;line-height:1}
.brand h1 span{color:var(--grass)}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--good);border-color:currentColor}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:8px}
@media(max-width:420px){.trow{grid-template-columns:1fr 130px}}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:7px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:400px){.tabs button{font-size:15px}}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.pc.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star{color:var(--gold);font-weight:700}
.award{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-top:1px solid var(--line)}
.award:first-child{border-top:0}
.award .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.award .hd span{font-size:13px;color:var(--muted)}
.award ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.award li{font-size:15px}
.award li i{color:var(--muted);font-style:normal}
.cnts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:14px}
.cnt b{font-family:var(--display);font-size:17px}
.cnt.zero{border-style:dashed;color:var(--muted)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tcard>button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.tcard .tn{font-weight:700}
.tcard .ts{font-size:13px;color:var(--muted)}
.tcard .tb{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tcard .gl{display:flex;justify-content:space-between;gap:10px}
.danger{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.tabs button.on{background:var(--grass);color:var(--chalk)}

.summary{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}
.glist{display:flex;flex-direction:column;gap:8px}
.gcard{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.gcard .gn{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;color:var(--muted)}
.gcard .gn small{display:block;font-size:12px;letter-spacing:.08em;font-weight:600}
.gcard .opp{font-weight:700;overflow-wrap:anywhere}
.gcard .sub{font-size:13px;color:var(--muted)}
.gcard .res{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gcard .scr{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live-bg);color:var(--live)}
.pill.ft{background:var(--grass-2);color:var(--good)}
.lenrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lenrow input{width:72px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:22px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pv{display:grid;grid-template-columns:52px 1fr;gap:2px 10px}
.pv b{font-family:var(--display);font-size:18px}
.pv .sm{color:var(--muted)}

.back{border:0;background:none;color:var(--grass);font-weight:700;padding:4px 0;align-self:flex-start}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead h2{font-size:30px}
.meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
/* iPhone Safari gives date boxes a fixed minimum width, which pushed them over their neighbours and widened the page */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.meta label{display:flex;flex-direction:column;gap:4px;min-width:0}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.side .nm{font-weight:700;font-size:14px;text-align:center;overflow-wrap:anywhere}
.sc{display:flex;align-items:center;gap:8px}
.sc b{font-family:var(--display);font-size:46px;line-height:1;min-width:1.2ch;text-align:center}
.sc button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.sc button.plus{background:var(--grass);color:var(--chalk);border-color:var(--grass)}
.clock{text-align:center;padding-inline:4px}
.clock .t{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.clock small{display:block;color:var(--muted);font-size:12px}
.lenbtn{display:block;margin:2px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline dotted;padding:4px 6px}
.fix{display:flex;flex-direction:column;gap:10px}
.fix h3{margin:6px 0 0}
.fix .lenrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fix .lenrow input{width:80px}
.subadd{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px}
.subadd label{display:flex;flex-direction:column;gap:4px;min-width:0}
.subadd select,.subadd input{width:100%;min-width:0}
.subt{width:72px;flex:0 0 auto}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:700;flex:1;text-align:center}
.btn.go{background:var(--grass);border-color:var(--grass);color:var(--chalk)}
.btn.warn{color:var(--bad)}
.btn.small{flex:0 0 auto;padding:7px 11px;font-size:14px}

.pitch{position:relative;background:
  linear-gradient(90deg,transparent calc(50% - 1px),#ffffff55 calc(50% - 1px),#ffffff55 calc(50% + 1px),transparent calc(50% + 1px)),
  repeating-linear-gradient(90deg,var(--grass) 0 12.5%,var(--grass-deep) 12.5% 25%);
  border:2px solid #ffffff66;border-radius:14px;padding:30px 12px 16px;min-height:150px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .lbl{position:absolute;top:8px;left:12px;color:#ffffffcc}
.pitch .cnt{position:absolute;top:8px;right:12px;color:#ffffffcc;font-size:12px;font-weight:700}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;padding:8px 12px;border-radius:10px;border:2px solid transparent;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002;touch-action:none;user-select:none;-webkit-user-select:none}
.chip .n{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .m{font-size:12px;color:var(--muted)}
.chip .gkb{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--gk);color:var(--surface);padding:1px 5px;border-radius:5px}
.chip.keeper{background:var(--gk-bg)}
.chip.sel{border-color:var(--live);background:var(--live-bg)}
.chip.target{border-style:dashed;border-color:var(--grass)}
.chip.over{border-style:solid;border-color:var(--live);transform:scale(1.06)}
.chip.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;box-shadow:0 8px 24px #0004;transform-origin:center}
.benchbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.benchbox .chips{justify-content:flex-start}
.benchbox .chip{background:var(--bg);box-shadow:none}
.hint{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--live-bg);color:var(--ink)}
.hint.quiet{background:var(--grass-2)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:20px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.meta.one{grid-template-columns:minmax(0,1fr);gap:12px}
.seg.fill{width:100%}
.seg.fill button{flex:1 1 0;min-width:0;padding-inline:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button{border:0;background:var(--surface);padding:7px 9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--grass);color:var(--chalk)}
.seg button.on.b{background:var(--live-bg);color:var(--live)}
.seg button.on.k{background:var(--gk);color:var(--surface)}
.log .row{font-size:14px}
.log .at{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);min-width:46px}
.log .txt{flex:1;min-width:0}
.off{color:var(--bad)} .onn{color:var(--good)}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{font-weight:700;overflow-wrap:anywhere}
.mrow .tot{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;text-align:right}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);border-radius:4px}
.mrow.low .bar i{background:var(--live)}
.mrow .brk{grid-column:1/-1;font-size:12px;color:var(--muted)}
.flag{font-size:11px;font-weight:700;color:var(--live);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}

.addf{display:flex;gap:8px}
.addf .btn{flex:0 0 auto}
.teamsw{cursor:pointer;white-space:nowrap}
.acctf{display:flex;flex-direction:column;gap:8px}
.teamsw::after{content:" ▾";font-size:.6em;color:var(--muted)}
.teamsw.others::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
.teamrow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teamrow .who{flex:1 1 auto}
.teamrow.cur .who{color:var(--grass)}
.flag.run{color:var(--live)}
.x{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.x.sure{color:var(--chalk);background:var(--bad);border-color:var(--bad)}
.empty{text-align:center;padding:26px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:0}
.ro [data-act]:not([data-act="tab"]):not([data-act="open"]):not([data-act="back"]){pointer-events:none;opacity:.45}
.ro .chip{pointer-events:none}
.gate .trow,.gate #tabs{display:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:40}
@media (prefers-reduced-motion:no-preference){.chip{transition:transform .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1><span id="hteam" style="color:inherit"></span> <span>Match Day</span></h1><span id="sync" class="sync">Connecting…</span></div>
    <div class="trow">
      <input id="tname" data-tour="name" placeholder="Tournament name" aria-label="Tournament name">
      <input id="tdate" data-tour="date" type="date" aria-label="Tournament date">
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-t="games">Games</button>
    <button data-act="tab" data-t="minutes">Minutes</button>
    <button data-act="tab" data-t="awards">Awards</button>
    <button data-act="tab" data-t="season">Season</button>
    <button data-act="tab" data-t="squad">Squad</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>

<script>
const APP_VERSION='0.4.1';
/*CFG*/const DEFAULT_CFG={team:'Example FC U10s',short:'Example FC',size:5};/*END*/
const S={cfg:{...DEFAULT_CFG},cfgLoaded:false,fx:false,squad:[],tour:{name:'',date:'',len:10,count:6},games:{},tab:'games',game:null,pick:null,confirm:null,readOnly:false,addLate:false,
  imp:{open:false,busy:false,msg:'',result:null},
  gate:false,teamId:null,invite:'',restore:null,fix:null,teams:false,adding:false,acct:null,
  awards:[],archive:[],aw:{date:'',type:'Training',label:'',picks:{}},openT:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nice=d=>{if(!d)return'';const t=new Date(d+'T12:00');return isNaN(t)?d:t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
let db=null,sample=null,canPhoto=false,pending=false,suppressClick=false;
const queues={};
const gids=()=>Array.from({length:Math.min(10,Math.max(1,S.tour.count||6))},(_,i)=>'g'+(i+1));

function blank(n){return{n,opponent:'',team:'',time:'',pitch:'',gk:null,starters:[],bench:[],subs:[],gkChanges:[],clock:{running:false,startedAt:0,acc:0},score:{us:0,them:0},done:false}}
function G(id){const g=S.games[id];const b=blank(+id.slice(1));return g?{...b,...g,clock:{...b.clock,...g.clock},score:{...b.score,...g.score}}:b}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nameOf(id){const p=S.squad.find(p=>p.id===id);if(p)return p.name;for(const t of S.archive){const q=(t.players||[]).find(p=>p.id===id);if(q)return q.name}return'Removed player'}
const el=g=>g.clock.acc+(g.clock.running?Math.max(0,Date.now()-g.clock.startedAt):0);
const started=g=>g.clock.running||g.clock.acc>0;
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtM(ms){const m=ms/60000;return m<1&&ms>0?fmt(ms):Math.round(m)+'m'}
const bySubTime=g=>[...g.subs].sort((a,b)=>a.at-b.at);
const alpha=l=>[...l].sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));
const byName=ids=>[...ids].sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'en',{sensitivity:'base'}));

function onPitch(g){const s=new Set(g.starters);for(const e of bySubTime(g)){s.delete(e.off);if(e.on)s.add(e.on)}return s}
function keeper(g){const ev=[...bySubTime(g).filter(e=>e.gk).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[])].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function inGame(g){return [...new Set([...g.starters,...g.bench,...g.subs.flatMap(e=>[e.off,e.on])])].filter(Boolean)}
function benchNow(g){const p=onPitch(g);return inGame(g).filter(x=>!p.has(x))}
function mins(g){
  const m={},end=el(g);let set=new Set(g.starters),prev=0;
  for(const e of bySubTime(g)){const at=Math.min(e.at,end);for(const p of set)m[p]=(m[p]||0)+Math.max(0,at-prev);set.delete(e.off);if(e.on)set.add(e.on);prev=at}
  for(const p of set)m[p]=(m[p]||0)+Math.max(0,end-prev);
  inGame(g).forEach(p=>{m[p]=m[p]||0});return m;
}

/* ---------- saving ---------- */
function put(path,body){
  if(!db)return;
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).catch(e=>{
    if(e&&e.code==='invalid_argument'){S.readOnly=true;render();toast("You can view this but not edit it. Ask the owner to invite you by email as an Editor.")}
    else if(e&&e.code==='quota_exceeded')toast("Storage is full, so that change wasn't saved.");

/* ---------- swaps (tap or drag) ---------- */
function swap(id,a,aSide,b,bSide){
  const g=G(id);
  if(aSide==='pitch'&&bSide==='pitch'){ // change keeper between two players on the pitch
    const k=keeper(g);if(a!==k&&b!==k){toast('Drag the keeper onto a player to swap the gloves.');return}
    const nk=a===k?b:a;
    if(!started(g))mut(id,g=>{g.gk=nk});
    else mut(id,g=>{g.gkChanges=[...(g.gkChanges||[]),{at:el(g),p:nk}]});
    toast(`${nameOf(nk)} is in goal`);return;
  }
  if(aSide===bSide)return;
  const off=aSide==='pitch'?a:b,on=aSide==='pitch'?b:a;
  if(!started(g)){
    mut(id,g=>{g.starters=g.starters.map(x=>x===off?on:x);g.bench=g.bench.filter(x=>x!==on);g.bench.push(off);if(g.gk===off)g.gk=on});
    return;
  }
  if(g.done){toast('Reopen the game to change subs.');return}
  const wasK=keeper(g)===off;
  mut(id,g=>{g.subs.push({at:el(g),off,on,...(wasK?{gk:true}:{})})});
  toast(`${nameOf(on)} on, ${nameOf(off)} off at ${fmt(el(G(id)))}${wasK?' (now in goal)':''}`);
}

/* ---------- corrections: game length, clock, subs after the fact ---------- */
// Subs are recorded live by default; this panel fixes the clock and adds, retimes or removes subs.
function parseT(v){const m=String(v||'').trim().replace('.',':').match(/^(\d{1,3})(?::(\d{1,2}))?$/);if(!m)return null;return (+m[1]*60+(+(m[2]||0)))*1000}
function keeperAt(g,t,skip){const ev=[...bySubTime(g).filter(e=>e!==skip&&e.gk&&e.at<=t).map(e=>({at:e.at,p:e.on})),...(g.gkChanges||[]).filter(c=>c.at<=t)].sort((a,b)=>a.at-b.at);let k=g.gk;ev.forEach(e=>k=e.p);return k}
function onPitchAt(g,t){const s=new Set(g.starters);for(const e of bySubTime(g)){if(e.at>t)break;s.delete(e.off);if(e.on)s.add(e.on)}return s}
function subsProblem(g){ // replay every sub in time order: each one must take off someone who was on, and bring on someone who wasn't
  const s=new Set(g.starters),end=el(g);
  for(const e of bySubTime(g)){
    if(e.at>end)return `${fmt(e.at)} is later than the clock (${fmt(end)}).`;
    if(!s.has(e.off))return `${nameOf(e.off)} wasn't on the pitch at ${fmt(e.at)}.`;
    if(e.on&&s.has(e.on))return `${nameOf(e.on)} was already on the pitch at ${fmt(e.at)}.`;
    s.delete(e.off);if(e.on)s.add(e.on);
  }
  return null;
}
function tryFix(id,fn,ok){ // apply a correction only if the subs still make sense afterwards
  const g=structuredClone(G(id));fn(g);
  g.subs.forEach(e=>{const k=keeperAt(g,e.at,e)===e.off;if(k)e.gk=true;else delete e.gk});
  const bad=subsProblem(g);if(bad){toast(bad+' Nothing was changed.');return false}
  S.games[id]=g;put('games/'+id,g);if(ok)toast(ok);render();return true;
}

function render(){

  document.body.classList.toggle('ro',S.readOnly);
  document.body.classList.toggle('gate',!!(S.gate||S.teams));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));

  const ta=document.getElementById('imptext');const keep=ta?ta.value:'';

  h.classList.toggle('others',sw&&myTeams().some(t=>t!==S.teamId&&teamInfo[t]?.running?.length));
  if(S.gate){v.innerHTML=gateView();return}
  if(S.teams){v.innerHTML=teamsView();return}
  if(S.cfgLoaded&&!S.cfg.team){v.innerHTML=setupView();return}
  v.innerHTML=S.tab==='games'&&S.fx&&!S.game?fixturesView():S.tab==='games'?(S.game?gameView(S.game):gamesList()):S.tab==='minutes'?minutesView():S.tab==='awards'?awardsView():S.tab==='season'?seasonView():squadView();

}

/* ---------- backup ---------- */
// A backup is one JSON file with every document the app stores. New versions may add fields
// but must keep reading old backups, so never rename or remove a field.
function backupCard(){
  const r=S.restore;
  if(r)return `<div class="card"><h3>Restore this backup?</h3>
    <p>Saved ${esc(nice(r.exported.slice(0,10)))} from <b>${esc(r.cfg?.team||'a team')}</b>: ${[[r.squad.length,'player'],[Object.keys(r.games).length,'game'],[r.archive.length,'tournament'],[r.awards.length,'award']].map(([n,w])=>n+' '+w+(n===1?'':'s')).join(', ')}.</p>
    <p class="note">This replaces the team's current squad, games, season record and awards for every coach on the team.</p>
    <div class="cbtns"><button class="btn warn" data-act="restoreok">Replace with backup</button><button class="btn" data-act="restorecancel">Cancel</button></div></div>`;
  return `<div class="card"><h3>Backup</h3>
    <p class="note">Save a copy of everything (squad, games, season record, awards) to this phone. Do it before the end of the season, or before deleting anything.</p>
    <div class="cbtns"><button class="btn" data-act="backup">Save a backup</button>
    <label class="btn filebtn">Restore from a backup<input id="restorefile" type="file" accept=".json,application/json"></label></div></div>`;
}
async function saveBackup(){
  const data={app:'match-day',version:APP_VERSION,exported:new Date().toISOString(),
    cfg:S.cfg,squad:S.squad,tour:S.tour,games:S.games,awards:S.awards,archive:S.archive};
  const slug=(S.cfg.short||S.cfg.team||'team').replace(/[^\w-]+/g,'-').toLowerCase();
  const name=`match-day-${slug}-${today()}.json`;
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  // Phones: the share sheet lets coaches save to Files, Drive or email. Computers: a normal download.
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved.');
}
async function readBackup(f){
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='match-day'||!Array.isArray(d.squad)||typeof d.games!=='object')throw 0;
    S.restore={exported:String(d.exported||''),cfg:d.cfg||null,squad:d.squad,tour:d.tour||{},games:d.games||{},awards:d.awards||[],archive:d.archive||[]};
  }catch(_){toast("That file isn't a Match Day backup.")}
  render();
}
function applyRestore(){
  const r=S.restore;S.restore=null;
  if(r.cfg&&r.cfg.team){S.cfg={...DEFAULT_CFG,...r.cfg};put('club/settings',S.cfg)}
  S.squad=alpha(r.squad);put('club/squad',{players:S.squad});
  S.tour={...S.tour,...r.tour};put('club/tournament',S.tour);
  Object.keys(S.games).forEach(id=>{if(!(id in r.games))remove('games/'+id)});
  S.games=r.games;Object.entries(r.games).forEach(([id,g])=>put('games/'+id,g));
  const keep=(list,coll)=>{const ids=new Set(list.map(x=>x.id));S[coll].forEach(x=>{if(!ids.has(x.id))remove(coll+'/'+x.id)});
    list.forEach(({id,...doc})=>put(coll+'/'+id,doc));S[coll]=list};
  keep(r.awards,'awards');keep(r.archive,'archive');
  toast('Backup restored.');render();
}

/* ---------- squad helpers ---------- */
function addNames(text){
  const raw=String(text||'').split(/[\n,;]+/).map(x=>x.replace(/\s+/g,' ').replace(/[^\p{L}\p{M}' -]/gu,'').trim()).filter(Boolean);
  if(!raw.length)return 0;
  const firsts=raw.map(n=>n.split(' ')[0]);
  const all=firsts.map(f=>f.toLowerCase());
  let added=0;const squad=[...S.squad];
  raw.forEach((n,i)=>{const parts=n.split(' '),f=cap(parts[0]);
    let name=f;if(all.filter(x=>x===f.toLowerCase()).length>1&&parts[1])name=f+' '+parts[1][0].toUpperCase();
    if(squad.some(p=>p.name.toLowerCase()===name.toLowerCase()))return;
    squad.push({id:'p'+Math.random().toString(36).slice(2,9),name:name.slice(0,30)});added++});
  S.squad=squad;if(added)saveSquad();return added;
}
const cap=w=>w?w[0].toUpperCase()+w.slice(1):w;

    <textarea id="fxpaste" placeholder="9.30am ${esc(S.cfg.short||'Us')} vs Riverside (Pitch 2)&#10;9.45am Hillside vs ${esc(S.cfg.short||'Us')} (Pitch 2)"></textarea>

function parseFixtures(text){
  const short=(S.cfg.short||'').trim().toLowerCase();
  let lines=String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(short&&lines.some(l=>l.toLowerCase().includes(short)))lines=lines.filter(l=>l.toLowerCase().includes(short));
  return lines.map(l=>{
    let time='',pitch='',rest=l;
    const tm=rest.match(/\b(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);if(tm){time=tm[1]+':'+tm[2];rest=rest.replace(tm[0],' ')}
    const pm=rest.match(/\(?\s*(?:pitch|pt)\s*([A-Za-z0-9]+)\s*\)?/i)||rest.match(/\bP(\d+)\b/);if(pm){pitch=pm[1];rest=rest.replace(pm[0],' ')}
    rest=rest.replace(/[()\[\]|]/g,' ');
    let parts=rest.split(/\s+(?:vs\.?|v\.?|versus|-|–)\s+/i).map(x=>x.trim()).filter(Boolean);
    let opp=parts.length>1?(parts.find(x=>!short||!x.toLowerCase().includes(short))||parts[1]):(parts[0]||'');
    if(short)opp=opp.replace(new RegExp(short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),' ');
    opp=opp.replace(/^\s*(?:v|vs)\s+/i,'').replace(/\s+/g,' ').trim().slice(0,40);
    return{time,pitch,opponent:opp};
  }).filter(f=>f.opponent||f.time).slice(0,10);
}

/* ---------- season ---------- */
function finishTournament(){
  const ids=gids();
  const games=ids.map(id=>{const g=G(id);return{n:g.n,opponent:g.opponent,time:g.time,pitch:g.pitch,score:g.score,done:g.done,played:started(g),gk:keeper(g)||g.gk||null,mins:mins(g)}});
  const doc={name:S.tour.name||'',date:S.tour.date||today(),savedAt:Date.now(),games,players:S.squad.map(p=>({id:p.id,name:p.name}))};
  const tid='t'+Date.now();
  put('archive/'+tid,doc);S.archive=[{id:tid,...doc},...S.archive.filter(t=>t.id!==tid)];
  ids.forEach(id=>{const n=blank(G(id).n);S.games[id]=n;put('games/'+id,n)});
  S.tour={...S.tour,name:'',date:''};saveTour();
  toast('Tournament saved to the Season tab.');render();
}
function record(games){let W=0,D=0,L=0,F=0,A=0;games.filter(g=>g.played||g.done).forEach(g=>{F+=g.score.us;A+=g.score.them;g.score.us>g.score.them?W++:g.score.us<g.score.them?L++:D++});return{W,D,L,F,A}}
function seasonView(){
  const ts=[...S.archive].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.savedAt-a.savedAt);
  const all=record(ts.flatMap(t=>t.games||[]));
  const tot={},gp={};ts.forEach(t=>(t.games||[]).forEach(g=>Object.entries(g.mins||{}).forEach(([p,ms])=>{tot[p]=(tot[p]||0)+ms;gp[p]=(gp[p]||0)+1})));
  const ac=awardCounts();
  const ppl=new Map();S.squad.forEach(p=>ppl.set(p.id,p.name));Object.keys(tot).forEach(p=>{if(!ppl.has(p))ppl.set(p,nameOf(p))});
  const rows=[...ppl].map(([id,name])=>({id,name,t:tot[id]||0,n:gp[id]||0,a:ac[id]||0})).sort((a,b)=>a.t-b.t);
  const max=Math.max(1,...rows.map(r=>r.t)),avg=rows.length?rows.reduce((s,r)=>s+r.t,0)/rows.length:0;
  return `<div class="sec" style="gap:14px">
  ${ts.length?`<div class="summary num"><span>Tournaments <b>${ts.length}</b></span><span>W <b>${all.W}</b> · D <b>${all.D}</b> · L <b>${all.L}</b></span><span>Goals <b>${all.F}–${all.A}</b></span><span>Awards <b>${S.awards.length}</b> sessions</span></div>`:''}
  <section class="sec"><h3>Season minutes</h3>
  ${ts.length&&rows.length?`<p class="note">Saved tournaments only, least time first.</p><div class="rows">${rows.map(r=>{const low=avg>0&&r.t<avg*0.8;return `<div class="mrow ${low?'low':''}"><span class="who">${esc(r.name)}${low?'<span class="flag">Needs time</span>':''}</span><span class="tot num">${fmtM(r.t)}</span>
    <span class="bar"><i style="width:${(r.t/max*100).toFixed(1)}%"></i></span><span class="brk num">${r.n} game${r.n===1?'':'s'}${r.a?` · <span class="star">★${r.a}</span> award${r.a>1?'s':''}`:''}</span></div>`}).join('')}</div>`
  :`<div class="empty"><b>Nothing saved yet</b>When a tournament ends, tap "Finish tournament and save to season" on the Games tab.</div>`}</section>
  ${ts.length?`<section class="sec"><h3>Tournaments</h3>${ts.map(t=>{const r=record(t.games||[]),open=S.openT===t.id;
    return `<div class="tcard"><button data-act="topen" data-id="${t.id}"><span><span class="tn">${esc(t.name||'Tournament')}</span><span class="ts" style="display:block">${esc(nice(t.date))}</span></span>
      <span class="num" style="text-align:right"><b>W${r.W} D${r.D} L${r.L}</b><span class="ts" style="display:block">Goals ${r.F}–${r.A}</span></span></button>
      ${open?`<div class="tb">${(t.games||[]).map(g=>`<div class="gl"><span>${esc(g.time||'G'+g.n)} v ${esc(g.opponent||'?')}</span><b class="num">${g.played||g.done?g.score.us+'–'+g.score.them:'not played'}</b></div>`).join('')}
        <button class="x ${S.confirm==='t-'+t.id?'sure':''}" data-act="tdel" data-id="${t.id}" style="align-self:flex-start">${S.confirm==='t-'+t.id?'Tap to delete this tournament':'Delete this tournament'}</button></div>`:''}</div>`}).join('')}</section>`:''}
  ${ts.length||S.awards.length?`<div class="danger"><button class="btn warn" data-act="wipe">${S.confirm==='wipe'?'Tap again to delete all season data':'Delete all season data'}</button>
    <p class="note">For the end of the season: removes every saved tournament and award. The squad stays until you remove the players on the Squad tab.</p></div>`:''}
  </div>`;
}

/* ---------- schedule import ---------- */
function impPrompt(extra){
  return `You are reading a youth football tournament schedule for the ${S.cfg.team} team (they may be listed as ${S.cfg.short}). Extract ${S.cfg.short}'s fixtures in kick-off order and the planned line-up for each game.
Known squad first names: ${S.squad.map(p=>p.name).join(', ')||'(none yet)'}.
Reply with only JSON in this shape:
{"name": string or null, "date": "YYYY-MM-DD" or null, "players": ["Alex", ...], "games": [{"time": "9:30", "opponent": "Riverside", "pitch": "2", "keeper": "Sam", "starters": ["Alex","Charlie"]}]}
Rules: opponent is the other team, never ${S.cfg.short}. keeper is the goalkeeper for that game; starters are the other players starting (do not repeat the keeper). Use first names only, matching the known squad spelling where possible; if two players share a first name, add a surname initial (e.g. "Grace B"). Never include surnames otherwise. If names are crossed out with handwritten replacements, use the printed plan. players lists every ${S.cfg.short} player on the sheet. Leave a field null or empty if it is not shown.${extra?'\n\nSchedule text:\n'+extra:''}`;
}
async function runImport(input,images){
  S.imp.busy=true;S.imp.msg='Reading the schedule. This can take up to a minute.';S.imp.result=null;render();
  try{
    const r=await sample.json(input,images?{images}:{});
    if(!r||!Array.isArray(r.games)||!r.games.length)throw{code:'empty'};
    const known=new Set(S.squad.map(p=>p.name.toLowerCase()));
    const all=[...(r.players||[]),...r.games.flatMap(g=>[g.keeper,...(g.starters||[])])].filter(Boolean).map(s=>String(s).trim().slice(0,30));
    const newPlayers=[...new Set(all.filter(n=>!known.has(n.toLowerCase())))];
    S.imp.result={name:r.name,date:r.date,games:r.games.slice(0,10),newPlayers};
    S.imp.msg='';
  }catch(e){
    S.imp.msg=e.code==='not_granted'?'Reading schedules needs permission to use Claude. You can still set up each game by hand.'
      :e.code==='rate_limited'?'Too many requests just now. Try again in a minute.'
      :e.code==='image_rejected'?'That photo could not be read. Try a clearer or smaller photo.'
      :e.code==='empty'||e.code==='invalid_json'?"Couldn't find any fixtures in that. Try a clearer photo, or paste the fixtures as text."
      :'Something went wrong reading that. Try again.';
  }
  S.imp.busy=false;render();
}
function applyImport(){
  const R=S.imp.result;if(!R)return;
  const squad=[...S.squad];
  const idFor=n=>{if(!n)return null;n=String(n).trim().slice(0,30);let p=squad.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!p){p={id:'p'+Math.random().toString(36).slice(2,9),name:n};squad.push(p)}return p.id};
  R.newPlayers.forEach(idFor);
  const games=R.games.map((x,i)=>{const g=blank(i+1);g.time=String(x.time||'');g.opponent=String(x.opponent||'');g.pitch=String(x.pitch||'');
    g.gk=idFor(x.keeper);g.starters=[...new Set([g.gk,...(x.starters||[]).map(idFor)].filter(Boolean))].slice(0,S.cfg.size);
    g.bench=squad.map(p=>p.id).filter(p=>!g.starters.includes(p));return g});
  S.squad=squad;saveSquad();
  S.tour={...S.tour,count:games.length,...(R.name?{name:String(R.name)}:{}),...(R.date&&/^\d{4}-\d\d-\d\d$/.test(R.date)?{date:R.date}:{})};saveTour();
  games.forEach((g,i)=>{const id='g'+(i+1);S.games[id]=g;put('games/'+id,g)});
  S.imp={open:false,busy:false,msg:'',result:null};S.confirm=null;toast(`Loaded ${games.length} games.`);render();
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=S.game,p=b.dataset.p;
  if(!['reset','del','impapply','finish','awdel','tdel','wipe','leave','clock0','subdel','signout'].includes(a))S.confirm=null;
  switch(a){
    case'tab':S.tab=b.dataset.t;S.pick=null;render();break;
    case'open':S.game=b.dataset.g;S.pick=null;S.addLate=false;render();window.scrollTo(0,0);break;
    case'back':S.fix=null;S.game=null;S.pick=null;render();break;
    case'reset':if(S.confirm==='reset'){S.confirm=null;gids().forEach(g=>{const o=G(g),n=blank(o.n);Object.assign(n,{opponent:o.opponent,time:o.time,pitch:o.pitch,team:o.team});S.games[g]=n;put('games/'+g,n)});toast('Scores, line-ups and subs cleared. Fixtures kept.');render()}else{S.confirm='reset';render()}break;
    case'score':mut(id,g=>{g.score[b.dataset.k]=Math.max(0,g.score[b.dataset.k]+ +b.dataset.d)});break;
    case'kick':mut(id,g=>{g.clock.running=true;g.clock.startedAt=Date.now();g.done=false});break;
    case'pause':mut(id,g=>{g.clock.acc=el(g);g.clock.running=false});break;
    case'ft':S.pick=null;mut(id,g=>{g.clock.acc=el(g);g.clock.running=false;g.done=true});break;
    case'reopen':mut(id,g=>{g.done=false});break;
    case'role':{const r=b.dataset.r,g=G(id);
      const startersAfter=g.starters.filter(x=>x!==p).length;
      if((r==='start'||r==='gk')&&!g.starters.includes(p)&&startersAfter>=S.cfg.size){toast(`${S.cfg.size} are already starting.`+' Move one to the bench first.');break}
      mut(id,g=>{g.starters=g.starters.filter(x=>x!==p);g.bench=g.bench.filter(x=>x!==p);if(g.gk===p)g.gk=null;
        if(r==='gk'){g.gk=p;g.starters.unshift(p)}if(r==='start')g.starters.push(p);if(r==='bench')g.bench.push(p)});break}
    case'tap':{const side=b.dataset.side;
      if(S.pick&&S.pick.g===id&&S.pick.p!==p&&(S.pick.side!==side||side==='pitch')){const pk=S.pick;S.pick=null;swap(id,pk.p,pk.side,p,side);if(!S.pick)render()}
      else{S.pick=S.pick&&S.pick.p===p?null:{g:id,p,side};render()}break}
    case'cancel':S.pick=null;render();break;

/* drag and drop between pitch and bench */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip[data-p]');if(!c||S.readOnly||e.button>0)return;
  drag={c,x:e.clientX,y:e.clientY,pid:e.pointerId,moved:false,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.moved=true;const r=drag.c.getBoundingClientRect();drag.w=r.width;drag.h=r.height;
    const gh=drag.c.cloneNode(true);gh.classList.add('ghost');gh.style.width=r.width+'px';document.body.append(gh);drag.ghost=gh;drag.c.classList.add('dragging')}
  drag.ghost.style.transform=`translate(${e.clientX-drag.w/2}px,${e.clientY-drag.h/2}px) scale(1.08)`;
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.chip[data-p]');
  const ok=t&&t!==drag.c&&(t.dataset.side!==drag.c.dataset.side||t.dataset.side==='pitch')?t:null;
  if(drag.over!==ok){drag.over?.classList.remove('over');ok?.classList.add('over');drag.over=ok}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,350);
  d.ghost.remove();d.c.classList.remove('dragging');d.over?.classList.remove('over');
  if(!cancel&&d.over){S.pick=null;swap(d.c.dataset.g,d.c.dataset.p,d.c.dataset.side,d.over.dataset.p,d.over.dataset.side);render()}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

  db.doc('club/squad').onSnapshot(s=>{S.squad=s.exists?alpha(s.data().players||[]):[];render()},err);

/* firebase: used when the app runs outside Claude (web link or phone app) */
const FB_SDK='https://www.gstatic.com/firebasejs/12.10.0/';
const TEAM_KEY='matchday-team';   // the team open now
const TEAMS_KEY='matchday-teams'; // every team this phone belongs to (a coach can have several)
let FB=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}};
function fsAdapter(base){ // same shape as Claude's db, so put()/remove()/subscribe() work unchanged
  const {F,fs}=FB,ref=p=>F.doc(fs,base+'/'+p);
  const fail=e=>{if(e&&e.code==='permission-denied')toast("This phone isn't allowed to change this team. Rejoin with the invite code on the Squad tab.");else toast("Couldn't save that change.")};
  // Don't wait for the server: writes go into the phone's offline copy at once and upload when there's signal.
  return{
    doc:p=>({set:b=>{F.setDoc(ref(p),b).catch(fail);return Promise.resolve()},delete:()=>{F.deleteDoc(ref(p)).catch(fail);return Promise.resolve()},
      onSnapshot:(cb,err)=>F.onSnapshot(ref(p),s=>cb({exists:s.exists(),data:()=>s.data()}),err)}),
    collection:c=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,base+'/'+c),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)})
  };
}
function myTeams(){
  let l=[];try{l=JSON.parse(lsGet(TEAMS_KEY)||'[]')}catch(_){}
  const t=lsGet(TEAM_KEY);if(t&&!l.includes(t))l.push(t); // phones from before v0.3.0 only had the one team
  return l.filter(x=>typeof x==='string'&&x);
}
const saveTeams=l=>lsSet(TEAMS_KEY,JSON.stringify([...new Set(l)]));
const teamInfo={}; // id -> {name, running:[game numbers]} for the team switcher
function watchTeams(){
  const {F,fs}=FB;
  myTeams().forEach(t=>{
    if(teamInfo[t])return;teamInfo[t]={name:'',running:[]};
    const gone=e=>{if(e&&e.code==='permission-denied')teamInfo[t].gone=true;render()};
    F.onSnapshot(F.doc(fs,'teams',t,'club','settings'),s=>{teamInfo[t].name=s.data()?.team||'';render()},gone);
    F.onSnapshot(F.collection(fs,'teams',t,'games'),s=>{teamInfo[t].running=s.docs.filter(d=>d.data().clock?.running).map(d=>d.data().n).sort((a,b)=>a-b);render()},gone);
  });
}
function switchTeam(t){ // a fresh page load keeps each team's live updates cleanly apart
  saveTeams([...myTeams(),t]);lsSet(TEAM_KEY,t);location.reload();
}
function liveLabel(){if(FB&&db)setSync(navigator.onLine,navigator.onLine?'Shared · live':'Offline · saved on this phone')}
addEventListener('online',liveLabel);addEventListener('offline',liveLabel);
async function connectFirebase(){
  let cfg=null;try{cfg=(await import('./firebase-config.js')).default}catch(_){}
  if(!cfg||!cfg.apiKey)return false;
  setSync(false,'Connecting…');
  const [{initializeApp},A,F]=await Promise.all(['app','auth','firestore'].map(m=>import(FB_SDK+'firebase-'+m+'.js')));
  const app=initializeApp(cfg);
  let fs;
  try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(_){fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,localCache:F.memoryLocalCache()})}
  FB={A,F,auth:A.getAuth(app),fs};
  // Each phone gets an anonymous sign-in: no passwords. Joining a team with its invite code is what grants access.
  await FB.auth.authStateReady();
  await signedIn().catch(()=>{});
  await loadAccountTeams();
  const t=lsGet(TEAM_KEY)||myTeams()[0];
  if(t)openTeam(t);else{S.gate=true;setSync(false,'No team yet');render()}
  return true;
}
function openTeam(t){
  const {F,fs}=FB;
  if(S.teamId&&S.teamId!==t){switchTeam(t);return} // adding a second team: reload into it
  saveTeams([...myTeams(),t]);syncTeamList();
  lsSet(TEAM_KEY,t);S.gate=false;S.adding=false;S.teamId=t;db=fsAdapter('teams/'+t);liveLabel();watchTeams();
  F.getDoc(F.doc(fs,'teams',t)).then(s=>{S.invite=s.data()?.code||'';render()}).catch(()=>{});
  subscribe(e=>{if(e&&e.code==='permission-denied'){setSync(false,'Not a member');toast("This phone isn't a member of that team any more.");leaveTeam(false)}});
  render();
}
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I to misread
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>CODE_CHARS[n%CODE_CHARS.length]).join('');
const showCode=c=>c?c.slice(0,3)+'-'+c.slice(3):'';
const errCode=e=>String(e&&(e.code||e.name||e.message)||'unknown').replace(/^(auth|firestore)\//,'').slice(0,40);
async function signedIn(){if(!FB.auth.currentUser)await FB.A.signInAnonymously(FB.auth);return FB.auth.currentUser.uid}
async function createTeam(){
  const {F,fs}=FB;
  if(!navigator.onLine){toast('You need a signal to create a team.');return}
  let uid;try{uid=await signedIn()}catch(e){toast(`Couldn't sign in (${errCode(e)}). Check your signal and try again.`);return}
  let last=null;
  for(let i=0;i<3;i++){ // retry if the random code is already taken
    const tref=F.doc(F.collection(fs,'teams')),code=newCode(),b=F.writeBatch(fs);
    b.set(tref,{code,createdBy:uid,created:F.serverTimestamp()});
    b.set(F.doc(fs,'teams',tref.id,'members',uid),{code,joined:F.serverTimestamp()});
    b.set(F.doc(fs,'codes',code),{team:tref.id});
    b.set(F.doc(fs,'teams',tref.id,'club','settings'),{...DEFAULT_CFG,team:'',short:''});
    try{await b.commit();openTeam(tref.id);return}catch(e){last=e;if(e.code!=='permission-denied')break}
  }
  toast(`Couldn't create the team (${errCode(last)}). Check your signal and try again.`);
}
async function joinTeam(raw){
  const {F,fs,auth}=FB,code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){toast('Invite codes are 6 letters and numbers, like ABC-234.');return}
  if(!navigator.onLine){toast('You need a signal to join a team.');return}
  try{
    await signedIn();
    const ref=F.doc(fs,'codes',code);
    const s=await F.getDoc(ref).catch(()=>F.getDocFromServer(ref));
    if(!s.exists()){toast("That code didn't match a team. Check it with the coach who sent it.");return}
    const t=s.data().team;
    await F.setDoc(F.doc(fs,'teams',t,'members',auth.currentUser.uid),{code,joined:F.serverTimestamp()});
    openTeam(t);toast('Joined.');
  }catch(e){toast(`Couldn't join (${errCode(e)}). Check your signal and try again, or tell the person who sent you the app.`)}
}
async function leaveTeam(remote=true){
  const {F,fs,auth}=FB,t=S.teamId;
  if(remote&&t)await Promise.race([Promise.all([
    F.deleteDoc(F.doc(fs,'teams',t,'members',auth.currentUser.uid)).catch(()=>{}),
    F.updateDoc(F.doc(fs,'users',auth.currentUser.uid),{['teams.'+t]:F.deleteField()}).catch(()=>{})]),new Promise(r=>setTimeout(r,2500))]);
  const rest=myTeams().filter(x=>x!==t);saveTeams(rest);lsSet(TEAM_KEY,rest[0]||null);location.reload();
}
/* accounts: optional email + password, so a coach's teams follow them to a new phone.
   Creating an account upgrades this phone's sign-in in place, so team access carries over. */
const isAccount=()=>!!FB?.auth?.currentUser?.email;
const within=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function loadAccountTeams(){
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u)return;
  const s=await within(F.getDoc(F.doc(fs,'users',u.uid)).catch(()=>null),3000);
  const theirs=Object.keys(s?.data?.()?.teams||{});
  if(theirs.length)saveTeams([...myTeams(),...theirs]);

function syncTeamList(){
  const {F,fs,auth}=FB,u=auth.currentUser;if(!u)return;
  F.setDoc(F.doc(fs,'users',u.uid),{teams:Object.fromEntries(myTeams().map(t=>[t,true]))},{merge:true}).catch(()=>{});
}
function authMsg(e){

  return({'email-already-in-use':'There\'s already an account for that email. Tap "I have an account" to sign in.',
    'credential-already-in-use':'There\'s already an account for that email. Tap "I have an account" to sign in.',
    'invalid-credential':"That email and password don't match.",'wrong-password':"That email and password don't match.",'user-not-found':"That email and password don't match.",
    'invalid-email':"That doesn't look like an email address.",'missing-email':'Type your email address first.',
    'weak-password':'Use a password of at least 6 characters.','missing-password':'Type a password.',
    'too-many-requests':'Too many tries. Wait a few minutes and try again.',
    'network-request-failed':'You need a signal for this.',
    'operation-not-allowed':"Email sign-in isn't switched on for this app yet."})[c]||`That didn't work (${c||errCode(e)}).`;

const acctVals=()=>({email:(document.getElementById('acctemail')?.value||'').trim(),pw:document.getElementById('acctpw')?.value||''});
async function createAccount(){
  const {A,auth}=FB,{email,pw}=acctVals();
  try{await signedIn();await A.linkWithCredential(auth.currentUser,A.EmailAuthProvider.credential(email,pw));
    syncTeamList();S.acct=null;toast('Account created. Sign in with it on any phone to get your teams back.');render()}

async function signInAccount(){
  const {A,F,fs,auth}=FB,{email,pw}=acctVals();
  if(!email||!pw){toast('Type your email and password.');return}
  // Teams already on this phone move onto the account: note their invite codes before switching sign-in.
  const codes={};
  for(const t of myTeams()){const s=await within(F.getDoc(F.doc(fs,'teams',t)).catch(()=>null),3000);if(s?.exists())codes[t]=s.data().code}
  try{await A.signInWithEmailAndPassword(auth,email,pw)}catch(e){toast(authMsg(e));return}
  const uid=auth.currentUser.uid;
  await Promise.all(Object.entries(codes).map(([t,code])=>F.setDoc(F.doc(fs,'teams',t,'members',uid),{code,joined:F.serverTimestamp()}).catch(()=>{})));
  await loadAccountTeams();syncTeamList();
  if(!lsGet(TEAM_KEY))lsSet(TEAM_KEY,myTeams()[0]||null);
  location.reload();
}
async function resetPassword(){
  const {A,auth}=FB,{email}=acctVals();
  if(!email){toast('Type your email address, then tap Forgot password.');return}
  try{await A.sendPasswordResetEmail(auth,email);toast("If there's an account for that email, a reset link is on its way. Check spam too.")}
  catch(e){toast(authMsg(e))}
}
async function signOutAccount(){
  await FB.A.signOut(FB.auth);saveTeams([]);lsSet(TEAM_KEY,null);location.reload();
}
function acctForm(mode){
  return `<form class="acctf" id="acctf" data-mode="${mode}">
    <input id="acctemail" type="email" autocomplete="username" placeholder="Email address" aria-label="Email address">
    <input id="acctpw" type="password" autocomplete="${mode==='create'?'new-password':'current-password'}" placeholder="${mode==='create'?'Choose a password (6+ characters)':'Password'}" aria-label="Password">
    <div class="cbtns"><button class="btn go" type="submit">${mode==='create'?'Create account':'Sign in'}</button>
    ${mode==='signin'?'<button class="btn" type="button" data-act="acctforgot">Forgot password</button>':''}
    <button class="btn" type="button" data-act="acctcancel">Cancel</button></div></form>`;
}
function accountCard(){
  if(!FB)return'';
  const u=FB.auth.currentUser;
  if(isAccount())return `<div class="card"><h3>Your account</h3>
    <p>Signed in as <b>${esc(u.email)}</b>.</p>
    <p class="note">Your teams are saved to this account. On a new phone, open the app and tap <b>Sign in</b> to get them all back.</p>
    <button class="x ${S.confirm==='signout'?'sure':''}" data-act="signout">${S.confirm==='signout'?'Tap again to sign out on this phone':'Sign out on this phone'}</button></div>`;
  return `<div class="card"><h3>Keep your teams safe</h3>
    <p class="note">Right now your teams are only on this phone. Create a free account with your email, and you can get all your teams back on a new phone. Optional.</p>
    ${S.acct?acctForm(S.acct):`<div class="cbtns"><button class="btn go" data-act="acctcreate">Create an account</button><button class="btn" data-act="acctsignin">I have an account</button></div>`}</div>`;
}
function gateView(){
  return `<div class="sec" style="gap:14px">
  ${S.adding?`<button class="back" data-act="gateback">← My teams</button><h2>Add a team</h2>`:''}
  <div class="card"><h3>Start a new team</h3>
    <p class="note">You'll get an invite code to give the other coaches.</p>
    <button class="btn go" data-act="mkteam">Create a team</button></div>
  <div class="card"><h3>Join a team</h3>
    <p class="note">Ask a coach for the team's invite code. It's on their Squad tab.</p>
    <form class="addf" id="joinf"><input id="joincode" placeholder="e.g. ABC-234" autocomplete="off" autocapitalize="characters" aria-label="Invite code"><button class="btn go" data-act="join" type="submit">Join</button></form></div>
  ${FB&&!isAccount()?`<div class="card"><h3>New phone?</h3>
    <p class="note">If you made a Match Day account, sign in to get all your teams back.</p>
    ${S.acct==='signin'?acctForm('signin'):'<button class="btn" data-act="acctsignin">Sign in</button>'}</div>`:''}
  <p class="note num" style="text-align:center">Match Day v${APP_VERSION}</p>
  </div>`;
}
function teamsView(){
  const l=myTeams();
  return `<div class="sec" style="gap:14px">
  <button class="back" data-act="teamsclose">← Back</button>
  <h2>My teams</h2>
  <div class="rows">${l.map(t=>{const i=teamInfo[t]||{},cur=t===S.teamId,name=cur?S.cfg.team:i.name;
    return `<button class="row teamrow ${cur?'cur':''}" data-act="switch" data-id="${esc(t)}">
      <span class="who">${esc(name||'Loading…')}</span>
      ${i.running&&i.running.length?`<span class="flag run">Game ${i.running.join(', ')} running</span>`:''}
      ${i.gone?'<span class="flag">No longer a member</span>':''}
      <span class="note">${cur?'Open now':'Switch'}</span></button>`}).join('')}</div>
  <button class="btn go" data-act="addteam">+ Add a team</button>
  <p class="note">Each team has its own squad, games, season and invite code. To leave a team, open it and go to the Squad tab.</p>
  </div>`;
}
function teamCard(){
  if(!FB||!S.teamId)return'';
  return `<div class="card"><h3>Invite other coaches</h3>
    <p>Invite code: <b class="num" style="font-family:var(--display);font-size:26px;letter-spacing:.06em">${esc(showCode(S.invite))||'…'}</b></p>
    <p class="note">Other coaches open the app, tap <b>Join a team</b> and enter this code. Everyone who joins can see and change this team's squad and games.</p>
    <button class="x ${S.confirm==='leave'?'sure':''}" data-act="leave">${S.confirm==='leave'?'Tap again to leave this team on this phone':'Leave this team on this phone'}</button></div>`;
}

render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use){
      if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
      if(!await connectFirebase())setSync(false,'Not syncing');return}
    window.claude.use('sample').then(async s=>{sample=s;if(s){const l=await s.limits().catch(()=>null);canPhoto=!!(l&&l.images)}render()});
    db=await window.claude.use('db');
    if(!db){setSync(false,'Not syncing');toast('Changes are only on this device right now.');return}
    const user=await window.claude.use('user');
    if(user){try{const c=await user.can('data.write');if(c===false)S.readOnly=true}catch(_){}}
    setSync(true,S.readOnly?'View only':'Shared · live');
    subscribe(e=>{if(e&&e.code==='revoked')setSync(false,'Not syncing')});
  }catch(e){setSync(false,'Not syncing')}
})();
</script>
