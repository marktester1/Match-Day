# Every browser test with the coach's phone in real Chrome on an Android emulator, set to the screen of
# three popular Android phones (one job each, side by side). Other phones in a test (followers, new
# coaches) are Playwright's Chromium at the same size (see tools/e2e/test.js). Like the other browser
# tests they serve this commit on localhost, which the app points at beta, so they use beta data and
# never touch live. Runs on pushes to main, when these tests change, and by hand (Actions → Android → Run workflow).
name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['tools/e2e/**', '!tools/e2e/ios-sim/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome on ${{ matrix.phone }} (beta data)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd   # one place for avdmanager and the emulator to agree on
    strategy:
      fail-fast: false
      matrix:
        include:
          # screen in pixels and density (160 × Playwright's scale), so pages lay out at the phone's size
          - {phone: Galaxy S24, size: 1080x2340, density: 480}
          - {phone: Galaxy A55, size: 1080x2340, density: 360}
          - {phone: Pixel 9, size: 1080x2424, density: 480}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json
      - run: npm ci
        working-directory: tools/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tools/e2e
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # The phone's screen is built into the emulator (changing it afterwards with `wm` put taps in the wrong place).
      # google_apis is a debug build of Android, so Playwright can start Chrome with its own settings.
      - name: Make the ${{ matrix.phone }} emulator
        run: |
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin IMG='system-images;android-35;google_apis;x86_64'
          yes | $SDK/sdkmanager --licenses >/dev/null
          $SDK/sdkmanager emulator "$IMG" >/dev/null
          mkdir -p $ANDROID_AVD_HOME
          echo no | $SDK/avdmanager create avd --force -n phone --package "$IMG"
          W=${SIZE%x*} H=${SIZE#*x}
          printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=%s\nhw.ramSize=4096\nhw.cpu.ncore=3\nhw.keyboard=yes\n' $W $H $DENSITY >> $ANDROID_AVD_HOME/phone.avd/config.ini
        env:
          SIZE: ${{ matrix.size }}
          DENSITY: ${{ matrix.density }}
      - name: Start it
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd phone -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 3; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size; adb shell wm density
      - name: Serve this commit on localhost:8000
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Run the tests on the emulator
        working-directory: tools/e2e
        # the emulator's own localhost is the phone; reverse forwarding points it at this machine's server
        run: |
          adb reverse tcp:8000 tcp:8000
          npx playwright test --workers=1
        env:
          ANDROID: 1
          ANDROID_PHONE: ${{ matrix.phone }}
          MATCHDAY_URL: http://127.0.0.1:8000
      # Screenshots and page snapshots only: the repository is public, and traces hold sign-in tokens
      - name: Keep the screenshots of any failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-screenshots-${{ matrix.phone }}
          path: |
            tools/e2e/test-results/**/*.png
            tools/e2e/test-results/**/error-context.md
          retention-days: 7
