# The iPhone journeys in real Mobile Safari on Xcode's iPhone simulators (tools/e2e/ios-sim, Appium),
# on GitHub's Mac machines instead of this Mac: they need three simulators and Appium's helper app,
# which is more memory than a laptop has to spare. Like the browser tests they serve this commit on
# localhost, which the app points at beta, so they use beta data and never touch live.
# Runs on pushes to main, when these tests change, and by hand (Actions → iPhone Simulator → Run workflow).
name: iPhone Simulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['tools/e2e/ios-sim/**', '.github/workflows/ios-sim.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sim
  cancel-in-progress: false

jobs:
  journeys:
    name: iPhone Safari journeys (beta data)
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tools/e2e/ios-sim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/e2e/ios-sim/package-lock.json
      - run: npm ci
      # The newest iPhone driver needs Appium 4; this is the one these tests were written against
      - run: APPIUM_HOME=./.appium npx appium driver install xcuitest@12.18.1
      # Build Apple's test helper (WebDriverAgent) now: built inside the first test, it took over 10
      # minutes on GitHub's Mac and the connection gave up. Later builds reuse this one.
      - name: Build WebDriverAgent
        run: |
          APPIUM_HOME=./.appium npx appium driver run xcuitest build-wda
          APP=$(ls -d ~/Library/Developer/Xcode/DerivedData/WebDriverAgent-*/Build/Products/Debug-iphonesimulator/WebDriverAgentRunner-Runner.app | head -1)
          test -d "$APP" && echo "PREBUILT_WDA=$APP" >> "$GITHUB_ENV" && echo "Built: $APP"
      - name: Choose three iPhone simulators
        run: |
          SIMS=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0)).devices;
            const rt = Object.keys(d).filter(k => /iOS/.test(k)).sort().pop();
            const n = [...new Set(d[rt].filter(x => /^iPhone/.test(x.name)).map(x => x.name))].slice(-3);
            if (n.length < 3) throw new Error('fewer than three iPhone simulators: ' + n);
            console.log(n.join(','));")
          echo "SIMS=$SIMS" >> "$GITHUB_ENV"
          echo "Simulators: $SIMS"
      # Start the one the tests use (the coach's phone) now, and wait until it's ready, so the tests don't
      # spend their own time on it (a slow start here used to fail the run)
      - name: Start the simulator
        run: |
          IFS=, read -r A _ <<< "$SIMS"
          xcrun simctl boot "$A" || true
          xcrun simctl bootstatus "$A" -b   # the job's own time limit stops a stuck one
      - name: Serve this commit on localhost:8000
        working-directory: .
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Start Appium
        run: |
          # info-level log (printed below if the tests fail); the connection stays open up to 30 minutes
          # while a session starts (Appium's default of 10 minutes cut it off on GitHub's slow Mac)
          APPIUM_HOME=./.appium npx appium --port 4723 --log-level info --keep-alive-timeout 1800 > appium.log 2>&1 &
          for i in $(seq 60); do curl -s http://127.0.0.1:4723/status >/dev/null && exit 0; sleep 2; done
          cat appium.log; exit 1
      # The one-phone tests: the set-up wizard. GitHub's free Mac can't reliably run two iPhone simulators
      # (the second took over 15 minutes to start, or never did), so the tests with a supporter, a second
      # coach or several managers run here in WebKit (tests.yml) and real Chrome (android.yml), and on a
      # Mac with `npm test` or `node tools/release-check.cjs pre --ios-sim`. A bigger GitHub Mac would run
      # them all: see BACKLOG.md (monetisation).
      - run: node --test --test-concurrency=1 setup-wizard.test.mjs
        env:
          MATCHDAY_URL: http://127.0.0.1:8000
      # The iPhone app itself (ios-app/): a Debug build for the simulator, which opens beta and lets the tests
      # see inside its page. It tests the app's own parts (sign-in options, offline, links), on beta.
      - name: Build the iPhone app (Debug, for the simulator)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/mdapp" CODE_SIGNING_ALLOWED=NO build -quiet
          echo "APP=$RUNNER_TEMP/mdapp/Build/Products/Debug-iphonesimulator/App.app" >> "$GITHUB_ENV"
      - run: node --test --test-concurrency=1 app.test.mjs
      # What Appium was doing when it failed: session start-up, WebDriverAgent, Safari's debugger (no typed values)
      - name: Appium's log
        if: failure()
        run: grep -vE "\[HTTP\]|execute/" appium.log | grep -iE "xcodebuild|webdriveragent|wda|remote ?debugger|webview|simulator|creating new|created|error|timed? ?out|took|install|launch" | grep -viE "setvalue|/value|password" | cut -c1-300 | tail -250
      # Screenshots only: the repository is public
      - name: Keep the screenshots of any failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-sim-screenshots
          path: tools/e2e/ios-sim/test-results/**/*.png
          retention-days: 7
